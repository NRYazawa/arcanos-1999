<script>
// ============================================================================
// ENGINE E REGRAS (REDUZIDAS E ADAPTADAS)
// ============================================================================

// Utilitários genéricos
const uid = () => Math.random().toString(36).slice(2, 9);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = n => 1 + Math.floor(Math.random() * n);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// O estado global do jogo
const STORE = {
    G: null,
    role: null, // 'mestre', 'jogador', 'local'
    myPid: localStorage.getItem('a99_pid') || ('p' + uid()),
    seat: 'mestre',
    tab: 'chat',
    ui: {
        moveMode: false,
        targeting: null,
        diceCallback: null
    }
};
localStorage.setItem('a99_pid', STORE.myPid);

function novoJogo(modo, code) {
    return {
        modo, code, 
        players: {}, 
        enemies: [], 
        combat: { active: false, round: 0, order: [], idx: 0, positions: {} }, 
        log: [], 
        telegraphs: [],
        jukebox: false,
        seq: 0,
        fx: []
    };
}

// Helpers do Sistema
function rollExpr(expr, vars = {}, crit = false) {
    let total = 0; const parts = []; let e = String(expr).replace(/\s+/g, '');
    e = e.replace(/POT|Ritmo|Corpo|PF|Reflexo/g, m => '+' + (vars[m] || 0)).replace(/\+\+/g, '+').replace(/\+-/g, '-');
    const re = /([+-]?)(.*?)d(\d+)|([+-]?)(\d+)/g; let m;
    while ((m = re.exec(e))) {
        if (m[3]) {
            const sign = m[1] === '-' ? -1 : 1; let n = parseInt(m[2] || '1'); if (crit) n *= 2;
            const faces = parseInt(m[3]); const rolls = [];
            for (let i = 0; i < n; i++) rolls.push(rnd(faces));
            const s = rolls.reduce((a, b) => a + b, 0) * sign; total += s; parts.push({ dice: `${n}d${faces}`, rolls, sum: s });
        } else if (m[5]) { const v = parseInt(m[5]) * (m[4] === '-' ? -1 : 1); total += v; if (v) parts.push({ mod: v }); }
    }
    return { total: Math.max(0, total), parts, txt: parts.map(p => p.dice ? `${p.dice}[${p.rolls.join(',')}]` : (p.mod > 0 ? '+' + p.mod : p.mod)).join(' ') };
}

function calcDerived(ch) {
    const c = D.classes.find(x => x.key === ch.classe) || D.classes[0];
    const vidaMax = c.vida + ch.attrs.corpo * 3 + ((ch.nivel || 1) - 1) * (c.vidaN + ch.attrs.corpo);
    const enMax = c.en + ch.attrs.alma * 2 + ((ch.nivel || 1) - 1) * (c.enN + ch.attrs.alma);
    const def = 10 + ch.attrs.reflexo;
    const bld = ch.vest === 'Jaqueta de couro com patches' ? 1 : 0;
    const egd = Math.floor(ch.attrs.alma / 2);
    const pot = ch.attrs.alma;
    const pf = 0;
    return { vidaMax, enMax, def, bld, egd, pot, pf };
}

function getSkills(ch) {
    if (!ch) return [];
    const cls = D.classes.find(x => x.key === ch.classe);
    let skills = [];
    if(cls) {
        cls.habs.forEach((h, i) => {
            if(i === 0) return; // skip passiva for active buttons
            const isAtiva = /Ataque|dano|Derruba/i.test(h.texto);
            skills.push({ id: 'h'+i, nome: h.nome, icon: '💥', tipo: isAtiva ? 'ativa' : 'pacifica', custo: h.tags.match(/(\d+) EN/) ? parseInt(h.tags.match(/(\d+) EN/)[1]) : 0, range: h.tags.match(/(\d+) m/) ? parseInt(h.tags.match(/(\d+) m/)[1])/1.5 : 1, texto: h.texto });
        });
    }
    skills.push({ id: 'atk', nome: 'Ataque Básico', icon: '🗡️', tipo: 'ativa', custo: 0, range: 1, texto: '1d20 vs Defesa. Causa dano da arma.' });
    skills.push({ id: 'cura', nome: 'Usar Item/Comida', icon: '🎒', tipo: 'pacifica', custo: 0, range: 0, texto: 'Usa um item da mochila para curar ou ganhar bônus.' });
    return skills;
}

// ============================================================================
// REDUCER (CENTRAL DE AÇÕES)
// ============================================================================
function logMsg(G, html) {
    G.log.push(html);
    if(G.log.length > 100) G.log.shift();
}
function pushFx(G, f) {
    G.fx.push({ id: ++G.seq, ...f });
    if(G.fx.length > 20) G.fx.shift();
}

function reduce(G, a, from) {
    const isM = from === 'mestre';
    const ch = G.players[a.pid]?.char;
    
    switch(a.type) {
        case 'join':
            if(!G.players[a.pid]) G.players[a.pid] = { pid: a.pid, name: a.name, char: null };
            logMsg(G, `<b>${esc(a.name)}</b> entrou na mesa.`);
            break;
        case 'setChar':
            if(G.players[a.pid]) {
                G.players[a.pid].char = a.char;
                logMsg(G, `<b>${esc(a.char.nome)}</b> preparou a ficha.`);
            }
            break;
        case 'chat':
            logMsg(G, `<b>${isM ? 'Mestre' : G.players[a.pid]?.name || '?'}:</b> ${esc(a.text)}`);
            break;
        case 'startCombat':
            if(!isM) return;
            G.combat.active = true;
            G.combat.round = 1;
            G.combat.order = window.ordemIniciativa(G);
            G.combat.idx = 0;
            // set initial positions
            G.combat.positions = {};
            let px = 1, ex = 1;
            Object.keys(G.players).forEach(p => { if(G.players[p].char) { G.combat.positions['p:'+p] = [px++, 5]; } });
            G.enemies.forEach(e => { G.combat.positions['e:'+e.id] = [ex++, 0]; });
            
            logMsg(G, `<b style="color:var(--accent)">COMBATE INICIADO!</b> Ordem gerada.`);
            startTurn(G);
            break;
        case 'endTurn':
            const cur = G.combat.order[G.combat.idx];
            if(!isM && cur.id !== from) return;
            nextTurn(G);
            break;
        case 'move':
            if(ch && ch.ap && ch.ap.pacifica > 0) {
                G.combat.positions['p:'+a.pid] = [a.x, a.y];
                ch.ap.pacifica--;
                logMsg(G, `${esc(ch.nome)} se moveu.`);
                checkAutoEndTurn(G, ch, a.pid);
            }
            break;
        case 'useSkill':
            if(ch && ch.ap) {
                const sk = getSkills(ch).find(s => s.id === a.skillId);
                if(!sk) return;
                if(ch.ap[sk.tipo] <= 0) { logMsg(G, `Sem ação ${sk.tipo} para usar ${sk.nome}.`); return; }
                if(ch.en < sk.custo) { logMsg(G, `Sem energia para ${sk.nome}.`); return; }
                
                ch.en -= sk.custo;
                ch.ap[sk.tipo]--;
                
                logMsg(G, `<b>${esc(ch.nome)}</b> usou <b>${sk.nome}</b>` + (a.target ? ` em um alvo.` : '.'));
                
                if(a.target) {
                    pushFx(G, { type: 'atk', target: a.target });
                    // Aplica dano simplificado
                    if(sk.tipo === 'ativa') {
                        const dano = rollExpr(sk.id==='atk' ? '1d8' : '2d6').total;
                        let tObj = a.target.startsWith('e:') ? G.enemies.find(x=>x.id === a.target.slice(2)) : G.players[a.target.slice(2)]?.char;
                        if(tObj) {
                            tObj.hp = Math.max(0, (tObj.hp||10) - dano);
                            pushFx(G, { type: 'dmg', target: a.target, val: dano });
                            logMsg(G, `Causou <b>${dano}</b> de dano.`);
                            if(tObj.hp <= 0 && a.target.startsWith('e:')) {
                                tObj.dead = true;
                                logMsg(G, `Inimigo derrotado!`);
                            }
                        }
                    }
                }
                checkAutoEndTurn(G, ch, a.pid);
            }
            break;
        case 'spawnEnemy':
            if(!isM) return;
            const eid = uid();
            G.enemies.push({ id: eid, nome: a.nome, hp: a.hp, hpMax: a.hp, dead: false, chefe: a.chefe });
            if(G.combat.active) {
                G.combat.positions['e:'+eid] = [rnd(6), rnd(2)-1];
                G.combat.order.push({ kind: 'e', id: eid, nome: a.nome, ini: rnd(20) });
                G.combat.order.sort((a,b) => b.ini - a.ini);
            }
            logMsg(G, `Inimigo <b>${a.nome}</b> adicionado.`);
            break;
    }
}

function startTurn(G) {
    const cur = G.combat.order[G.combat.idx];
    if(!cur) return;
    if(cur.kind === 'p') {
        const ch = G.players[cur.id]?.char;
        if(ch) {
            ch.ap = { ativa: 1, pacifica: 1 };
            pushFx(G, { type: 'banner', txt: 'SEU TURNO', sub: ch.nome });
        }
    }
}

function checkAutoEndTurn(G, ch, pid) {
    if(ch.ap.ativa <= 0 && ch.ap.pacifica <= 0) {
        logMsg(G, `Turno de ${ch.nome} encerrado automaticamente.`);
        setTimeout(() => {
            dispatchLocal({ type: 'endTurn', pid }, pid);
        }, 1500);
    }
}

function nextTurn(G) {
    G.combat.idx++;
    if(G.combat.idx >= G.combat.order.length) {
        G.combat.idx = 0;
        G.combat.round++;
        logMsg(G, `--- <b>RODADA ${G.combat.round}</b> ---`);
    }
    startTurn(G);
}

// ============================================================================
// REDE (PEERJS)
// ============================================================================
const NET = { peer: null, conn: null, mode: null, conns: {} };
function goHost() {
    STORE.G = novoJogo('online', uid().slice(0,4).toUpperCase());
    STORE.role = 'mestre'; STORE.seat = 'mestre';
    NET.peer = new Peer('a99-' + STORE.G.code);
    NET.peer.on('open', () => {
        showMesa();
        document.getElementById('room-code-ui').innerText = 'MESA: ' + STORE.G.code;
    });
    NET.peer.on('connection', c => {
        c.on('data', d => {
            if(d.t === 'join') {
                NET.conns[d.pid] = c;
                dispatchLocal({type:'join', pid:d.pid, name:d.name}, 'mestre');
                c.send({t:'state', G: STORE.G});
            }
            if(d.t === 'act') {
                dispatchLocal(d.a, d.pid);
            }
        });
    });
}
function goJoin() {
    const code = prompt('Código da mesa:');
    if(!code) return;
    const name = prompt('Seu nome:');
    if(!name) return;
    STORE.role = 'jogador';
    NET.peer = new Peer();
    NET.peer.on('open', () => {
        NET.conn = NET.peer.connect('a99-' + code.toUpperCase(), {reliable: true});
        NET.conn.on('open', () => {
            NET.conn.send({t:'join', pid: STORE.myPid, name});
            showMesa();
            document.getElementById('room-code-ui').innerText = 'MESA: ' + code.toUpperCase();
        });
        NET.conn.on('data', d => {
            if(d.t === 'state') {
                STORE.G = d.G;
                renderUI();
                playFx();
            }
        });
    });
}
function goLocal() {
    STORE.G = novoJogo('local', 'LOCL');
    STORE.role = 'local'; STORE.seat = 'mestre';
    showMesa();
    document.getElementById('room-code-ui').innerText = 'MESA ÚNICA';
}

function hostBroadcast() {
    if(STORE.role !== 'mestre' && STORE.role !== 'local') return;
    if(STORE.role === 'mestre') {
        Object.values(NET.conns).forEach(c => {
            if(c.open) c.send({t:'state', G: STORE.G});
        });
    }
}

function sendAction(a) {
    if(STORE.role === 'jogador') {
        NET.conn.send({t:'act', pid: STORE.myPid, a});
    } else {
        dispatchLocal(a, STORE.seat);
    }
}

// ============================================================================
// RENDERIZAÇÃO
// ============================================================================
function showMesa() {
    document.getElementById('title-screen').style.display = 'none';
    document.getElementById('mesa-screen').style.display = 'flex';
    if(STORE.role === 'mestre' || STORE.role === 'local') {
        document.getElementById('tab-mestre').style.display = 'block';
        setTab('mestre');
    }
    // Setup Dummy Char for local testing if not master
    if(STORE.role === 'jogador' && !STORE.G.players[STORE.myPid]?.char) {
        const ch = { id: uid(), nome: 'Jogador ' + rnd(100), classe: 'tira', attrs: {corpo:2, reflexo:2, mente:1, presenca:1, alma:2}, hp: 24, en: 10, nivel: 1 };
        sendAction({ type: 'setChar', pid: STORE.myPid, char: ch });
    }
    renderUI();
}

function setTab(t) {
    STORE.tab = t;
    document.querySelectorAll('.stab').forEach(el => el.classList.remove('on'));
    const b = document.getElementById('tab-'+t);
    if(b) b.classList.add('on');
    renderUI();
}

function renderUI() {
    if(!STORE.G) return;
    const G = STORE.G;
    
    // Chat
    if(STORE.tab === 'chat') {
        document.getElementById('side-content').innerHTML = `
            <div style="display:flex; flex-direction:column; height:100%">
                <div style="flex:1; overflow-y:auto; padding-bottom:10px" id="chat-box">
                    ${G.log.map(l => `<div class="chat-msg">${l}</div>`).join('')}
                </div>
                <div class="chat-input">
                    <input type="text" id="chat-in" placeholder="Mensagem ou rolagem (2d6)...">
                    <button onclick="sendChat()">Enviar</button>
                </div>
            </div>
        `;
        const cb = document.getElementById('chat-box');
        if(cb) cb.scrollTop = cb.scrollHeight;
    }
    
    // Mestre
    if(STORE.tab === 'mestre') {
        document.getElementById('side-content').innerHTML = `
            <h2>CONTROLES DO MESTRE</h2>
            <div class="input-grp" style="margin-top:15px;">
                <button class="btn red" onclick="sendAction({type:'startCombat'})">INICIAR COMBATE</button>
            </div>
            <div class="input-grp" style="margin-top:15px;">
                <label>Criar Inimigo</label>
                <input type="text" id="e-nome" placeholder="Nome">
                <input type="number" id="e-hp" placeholder="Vida" value="20" style="margin-top:5px;">
                <button class="btn gold" style="margin-top:5px;" onclick="spawnEnemy()">Adicionar</button>
            </div>
            <div class="input-grp" style="margin-top:15px;">
                <button class="btn tech" onclick="darItemMestre()">Dar Item ao Jogador</button>
            </div>
        `;
    }
    
    // Ficha
    if(STORE.tab === 'ficha') {
        const pid = STORE.role === 'local' ? STORE.seat : STORE.myPid;
        const ch = G.players[pid]?.char;
        if(ch) {
            document.getElementById('side-content').innerHTML = `
                <h2>${esc(ch.nome)}</h2>
                <p style="color:var(--muted)">Vida: ${ch.hp} | Energia: ${ch.en}</p>
                <div style="margin-top:20px;">
                    <p><b>Força:</b> ${ch.attrs.corpo}</p>
                    <p><b>Reflexo:</b> ${ch.attrs.reflexo}</p>
                    <p><b>Mente:</b> ${ch.attrs.mente}</p>
                    <p><b>Presença:</b> ${ch.attrs.presenca}</p>
                    <p><b>Alma:</b> ${ch.attrs.alma}</p>
                </div>
                <button class="btn" style="margin-top:20px; width:100%" onclick="rollFicha()">Rolar Atributo</button>
            `;
        } else {
            document.getElementById('side-content').innerHTML = `<p>Ficha não encontrada.</p>`;
        }
    }
    
    // HUD & Turn Order
    renderBoard();
    renderHUD();
}

function sendChat() {
    const v = document.getElementById('chat-in').value;
    if(!v) return;
    if(/^\d*d\d+([+-]\d+)*$/.test(v.replace(/\s/g, ''))) {
        showDice(v);
    } else {
        sendAction({type: 'chat', text: v});
    }
    document.getElementById('chat-in').value = '';
}

function spawnEnemy() {
    const nome = document.getElementById('e-nome').value || 'Capanga';
    const hp = parseInt(document.getElementById('e-hp').value) || 20;
    sendAction({type: 'spawnEnemy', nome, hp, chefe: false});
}

function darItemMestre() {
    const item = prompt('Nome do Item, Arma ou Comida para dar a um jogador:');
    if(item) {
        sendAction({type: 'chat', text: `🎁 O Mestre concedeu secretamente o item [${item}] para o jogador.`});
        alert('O jogador foi notificado pelo log.');
    }
}

function renderHUD() {
    const G = STORE.G;
    const pid = STORE.role === 'local' ? STORE.seat : STORE.myPid;
    const ch = G.players[pid]?.char;
    const cur = G.combat.active ? G.combat.order[G.combat.idx] : null;
    const isMyTurn = cur && cur.kind === 'p' && cur.id === pid;
    
    // Turn Order
    const toUI = document.getElementById('turn-order-ui');
    if(G.combat.active) {
        toUI.innerHTML = G.combat.order.map((o, i) => `<div class="to-item ${o.kind} ${i===G.combat.idx?'active':''}">${esc(o.nome.split(' ')[0])}</div>`).join('');
    } else {
        toUI.innerHTML = '<div class="to-item">FORA DE COMBATE</div>';
    }
    
    // APs
    const apA = document.getElementById('ap-ativa');
    const apP = document.getElementById('ap-pacifica');
    if(ch && ch.ap && isMyTurn) {
        apA.className = 'ap-dot ativa ' + (ch.ap.ativa > 0 ? 'on' : '');
        apP.className = 'ap-dot pacifica ' + (ch.ap.pacifica > 0 ? 'on' : '');
    } else {
        apA.className = 'ap-dot ativa'; apP.className = 'ap-dot pacifica';
    }
    
    // Skills
    const sbar = document.getElementById('skill-bar');
    if(ch) {
        const skills = getSkills(ch);
        sbar.innerHTML = skills.map(s => {
            const can = isMyTurn && ch.ap && ch.ap[s.tipo] > 0 && ch.en >= s.custo;
            return `<div class="skill ${s.tipo} ${can ? '' : 'dis'}" onclick="clickSkill('${s.id}')">
                <div class="skill-icon">${s.icon}</div>
                <div class="skill-name">${esc(s.nome)}</div>
                ${s.custo ? `<div style="font-size:10px; color:var(--gold); margin-top:2px;">${s.custo} EN</div>` : ''}
            </div>`;
        }).join('');
    }
    
    document.getElementById('btn-endturn').style.display = isMyTurn ? 'block' : 'none';
    document.getElementById('btn-move').style.display = (isMyTurn && ch && ch.ap && ch.ap.pacifica > 0) ? 'block' : 'none';
}

function clickSkill(sid) {
    if(STORE.ui.moveMode) toggleMoveMode();
    const pid = STORE.role === 'local' ? STORE.seat : STORE.myPid;
    const ch = STORE.G.players[pid]?.char;
    const sk = getSkills(ch).find(s => s.id === sid);
    if(!sk) return;
    
    if(sk.range > 0) {
        STORE.ui.targeting = { skillId: sid, range: sk.range };
        renderBoard();
        alert('Selecione um alvo no tabuleiro!');
    } else {
        sendAction({ type: 'useSkill', pid, skillId: sid, target: null });
    }
}

function toggleMoveMode() {
    STORE.ui.moveMode = !STORE.ui.moveMode;
    STORE.ui.targeting = null;
    renderBoard();
}

function endMyTurn() {
    sendAction({ type: 'endTurn', pid: STORE.role==='local'?STORE.seat:STORE.myPid });
}

// ---------------- TABULEIRO 2.5D ----------------
function renderBoard() {
    const G = STORE.G;
    const grid = document.getElementById('iso-grid');
    const layer = document.getElementById('tokens-layer');
    
    // Desenha grid vazio para interações
    let ghtml = '';
    for(let y=0; y<6; y++) {
        for(let x=0; x<8; x++) {
            let cls = '';
            if(STORE.ui.moveMode) cls = 'valid-move';
            ghtml += `<div class="iso-cell ${cls}" style="grid-column:${x+1}; grid-row:${y+1};" onclick="clickCell(${x},${y})"></div>`;
        }
    }
    grid.innerHTML = ghtml;
    
    // Desenha Tokens
    let thtml = '';
    Object.keys(G.combat.positions || {}).forEach(k => {
        const [x, y] = G.combat.positions[k];
        const isE = k.startsWith('e:');
        const id = k.slice(2);
        let obj = isE ? G.enemies.find(e=>e.id===id) : G.players[id]?.char;
        if(!obj) return;
        
        let tx = x * 80;
        let ty = y * 80;
        
        const isTargetable = STORE.ui.targeting && isE && !obj.dead; // simplistic
        
        thtml += `<div class="token ${obj.dead?'dead':''} ${isTargetable?'valid-target':''}" data-kind="${isE?'e':'p'}" id="tok-${k}" style="transform: translate3d(${tx}px, ${ty}px, ${obj.dead?0:20}px)" onclick="clickToken('${k}')">
            <div class="token-inner">${esc(obj.nome.slice(0,2).toUpperCase())}</div>
            <div class="token-hp"><div class="bar" style="width:${Math.max(0, obj.hp/(obj.hpMax||30)*100)}%"></div>${obj.hp}</div>
        </div>`;
    });
    layer.innerHTML = thtml;
}

window.clickCell = function(x, y) {
    if(STORE.ui.moveMode) {
        sendAction({ type: 'move', pid: STORE.role==='local'?STORE.seat:STORE.myPid, x, y });
        STORE.ui.moveMode = false;
        renderUI();
    }
};

window.clickToken = function(k) {
    if(STORE.ui.targeting) {
        const tg = STORE.ui.targeting;
        sendAction({ type: 'useSkill', pid: STORE.role==='local'?STORE.seat:STORE.myPid, skillId: tg.skillId, target: k });
        STORE.ui.targeting = null;
        renderUI();
    } else if (STORE.role === 'mestre' && k.startsWith('e:')) {
        // Mestre attack
        if(confirm('Atacar com este inimigo? (Alvo aleatório)')) {
            const pids = Object.keys(STORE.G.players).filter(p=>STORE.G.players[p].char && !STORE.G.players[p].char.caido);
            if(pids.length) {
                const target = pids[rnd(pids.length)-1];
                sendAction({ type: 'useSkill', pid: 'mestre', skillId: 'e-atk', target: 'p:'+target }); // simplified
            }
        }
    }
};

// ---------------- DICE ROLLER INTERATIVO ----------------
let diceDragging = false;
function showDice(expr) {
    const ov = document.getElementById('dice-overlay');
    const resUI = document.getElementById('dice-result');
    const cube = document.getElementById('dice-cube');
    ov.style.display = 'flex';
    resUI.style.display = 'none';
    cube.className = 'dice-container';
    cube.style.transform = 'rotateX(0deg) rotateY(0deg)';
    
    STORE.ui.diceExpr = expr;
}

document.getElementById('dice-cube').addEventListener('mousedown', () => { diceDragging = true; });
document.addEventListener('mouseup', (e) => {
    if(diceDragging) {
        diceDragging = false;
        const cube = document.getElementById('dice-cube');
        cube.classList.add('anim-toss');
        
        // Compute result
        const r = rollExpr(STORE.ui.diceExpr);
        
        setTimeout(() => {
            document.getElementById('dice-result').style.display = 'flex';
            document.getElementById('dice-tot').innerText = r.total;
            document.getElementById('dice-calc').innerText = r.txt;
            
            setTimeout(() => {
                document.getElementById('dice-overlay').style.display = 'none';
                sendAction({ type: 'chat', text: `Rolou ${STORE.ui.diceExpr}: ${r.txt} = ${r.total}` });
            }, 3000); // Marinate for 3 seconds!
        }, 2000);
    }
});

function rollFicha() {
    showDice('1d20+2');
}

// ---------------- FX RUNNER ----------------
function playFx() {
    const G = STORE.G;
    if(!G.fx) return;
    const novos = G.fx.filter(f => f.id > (STORE.lastFx || 0));
    if(!novos.length) return;
    STORE.lastFx = Math.max(...G.fx.map(f => f.id));
    
    novos.forEach(f => {
        if(f.type === 'dmg' || f.type === 'heal') {
            const el = document.getElementById('tok-' + f.target);
            if(el) {
                const rect = el.getBoundingClientRect();
                const flo = document.createElement('div');
                flo.className = 'floatnum';
                flo.innerText = f.type==='dmg' ? '-'+f.val : '+'+f.val;
                flo.style.color = f.type==='dmg' ? 'var(--accent)' : 'var(--tech)';
                flo.style.left = (rect.left + 30) + 'px';
                flo.style.top = (rect.top - 10) + 'px';
                document.body.appendChild(flo);
                setTimeout(() => flo.remove(), 2000);
                
                if(f.type==='dmg') {
                    el.classList.remove('hit'); void el.offsetWidth; el.classList.add('hit');
                }
            }
        }
        if(f.type === 'atk') {
            const el = document.getElementById('tok-' + f.target); // Should be the attacker actually, but simplify
            if(el) { el.classList.remove('atk'); void el.offsetWidth; el.classList.add('atk'); }
        }
    });
}

function showTutorial() {
    alert("COMO JOGAR:\n1. Você tem 1 Ação Ativa (dano) e 1 Pacífica (mover/cura) por turno.\n2. A rodada passa sozinha quando você usar ambas.\n3. O tabuleiro é interativo: clique para mover.\n4. Para rolar os dados (BG3 style), arraste o cubo para cima na tela!");
}
