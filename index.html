// ---- usar carta ----
function usarCarta(G, a, me) {
  const pid = a.pid; if (me !== 'mestre' && pid !== me) return; const ch = G.players[pid]?.char; if (!ch) return;
  const d = derived(ch); const card = cartasDe(ch).find(c => c.key === a.key); if (!card || card.passiva || card.bloqueada) return;
  if (ch.caido) { logPush(G, `${esc(ch.nome)} está caído e não pode agir.`); return; }
  if (ch.rec[card.key]) { return; }
  let custo = card.custo || 0;
  if (card.musica && ch.ritmo >= 5) { custo = 0; ch.ritmo = 2; logPush(G, `🎸 <b>BIS!</b> ${esc(ch.nome)} toca de graça.`); }
  if (card.tipo === 'classe' && ch.classe === 'mentalista' && card.idx === 4 && false) custo = 0;
  if (ch.en < custo) { logPush(G, `${esc(ch.nome)} não tem Energia para ${esc(card.nome)}.`); return; }
  ch.en -= custo; if (card.rec) ch.rec[card.key] = card.rec;
  const nome = esc(ch.nome); const assin = card.assin || arcano(ch.asc).assin; const vars = { POT: d.pot, Ritmo: ch.ritmo || 0, Corpo: ch.attrs.corpo, PF: d.pf, Reflexo: ch.attrs.reflexo };
  const alvos = (a.targets || []).map(t => findTarget(G, t)).filter(Boolean);
  const mel = card.nivelMel || 0; let linhas = [];
  // efeitos especiais por classe
  if (card.tipo === 'pacto') {
    ch.sangueCena = ch.sangueCena || 0; if (ch.sangueCena >= Math.max(1, ch.attrs.alma)) { logPush(G, 'Limite de Pactos na cena.'); return; }
    ch.hp = Math.max(0, ch.hp - 2); ch.en = Math.min(d.enMax, ch.en + 1); ch.sangue++; ch.sangueCena++;
    logPush(G, `🩸 ${nome} faz um <b>Pacto de Sangue</b>: −2 Vida, +1 EN. Marcas de Sangue: ${ch.sangue}.`, 'blood'); fxPush(G, { type: 'blood', target: 'p:' + pid }); return;
  }
  if (card.arma) return ataqueArma(G, ch, pid, card, alvos[0], d);
  if (card.musica || (ch.classe === 'virtuoso' && card.key === 'h1')) { ch.tocou = true; ch.ritmo = Math.min(5, (ch.ritmo || 0) + 1); vars.Ritmo = ch.ritmo; }
  if (ch.classe === 'ativista' && card.key === 'h2') { const gasto = Math.min(ch.carga || 0, a.carga ?? ch.carga ?? 0); ch.carga -= gasto; card.dano = String(gasto); card.tr = 'Corpo'; card.metade = true; }
  if (ch.classe === 'ativista' && card.key === 'h4') { card.dano = (ch.carga || 0) + '+3d6'; ch.carga = mel >= 2 ? Math.floor(ch.carga / 2) : 0; }
  if (ch.classe === 'virtuoso' && card.key === 'h1') { card.dano = mel >= 1 ? '2d4+Ritmo' : '1d4+Ritmo'; }
  if (ch.classe === 'mentalista' && card.key === 'h2') { card.dano = mel >= 1 ? '3d6+POT' : '2d6+POT'; }
  if (ch.classe === 'devoto' && card.key === 'h1') { card.barreira = mel >= 2 ? '8+POT' : '4+POT'; }
  if (ch.classe === 'tira' && card.key === 'h1') { ch.balaMarcada = mel >= 1 ? 3 : 2; ch.balaDado = mel >= 2 ? '1d8' : '1d6'; }
  if (ch.classe === 'tira' && card.key === 'h4') { // Veredito
    const t = alvos[0]; if (!t) { logPush(G, 'Escolha um alvo para o Veredito.'); ch.en += custo; delete ch.rec[card.key]; return; }
    const rr = rollExpr(d.arma.dano.replace(/(\d+)d/, (m, n) => (n * 3) + 'd') + '+' + d.pf + (mel >= 1 ? '+1d10' : ''));
    const bar = t.obj.barreira; t.obj.barreira = 0; const dd = aplicaDano(G, t, rr.total, 'Verdadeiro', null, { pid }); t.obj.barreira = bar;
    logPush(G, `⚖️ <b>${nome}</b> dá o <b>VEREDITO</b> em ${esc(t.nome)}: ${rr.txt} → <b class="big">${dd}</b>`, 'big'); fxPush(G, { type: 'banner', text: 'VEREDITO', color: '#ff5a1f' });
    if (t.obj.dead || t.obj.hp <= 0) delete ch.rec[card.key]; return;
  }
  if (ch.classe === 'sabio' && card.key === 'h1') { const t = alvos[0]; if (t && t.kind === 'e') { t.obj.rasgoB = (t.obj.rasgoB || 0) + 3; t.obj.rasgoE = (t.obj.rasgoE || 0) + 3; linhas.push(`${esc(t.nome)} perde 3 BLD e 3 EGD`); } }
  if (ch.classe === 'sabio' && card.key === 'h0') { }
  // resolução genérica
  const head = `✨ <b>${nome}</b> usa <b class="card-${card.tipo}">${esc(card.nome)}</b>${custo ? ` (−${custo} EN)` : ''}`;
  if (card.ataque && card.dano) {
    const t = alvos[0]; if (!t) { linhas.push('<i>(sem alvo)</i>'); }
    else {
      const bonus = card.ataque === 'pontaria' ? d.per('Pontaria') : d.atkArcano; const adv = t.obj.conds.some(c => c.n === 'Lido') ? 1 : 0;
      const r = d20(adv); const def = t.kind === 'e' ? t.obj.defesa : derived(t.obj).defesa; const tot = r.v + bonus; const hit = r.v === 20 || (r.v !== 1 && tot >= def);
      if (adv) t.obj.conds = t.obj.conds.filter(c => c.n !== 'Lido');
      fxPush(G, { type: 'roll', who: pid, d: r.v, bonus, total: tot, vs: def, hit, label: card.nome });
      if (hit) { const rr = rollExpr(card.dano, vars, r.v === 20); const dd = aplicaDano(G, t, rr.total, 'Arcano', assin, { pid });
        linhas.push(`Ataque ${r.rolls.length > 1 ? `[${r.rolls.join(',')}]` : r.v}+${bonus}=${tot} vs Def ${def} · <b class="ok">ACERTO</b>${r.v === 20 ? ' CRÍTICO' : ''} · ${rr.txt} → <b class="big">${dd}</b> ${assin}`);

        if (/Lido/.test(stripTags(card.texto)) && card.key === 'h1') addCond(G, t, 'Lido', 1);

    }
  } else if (card.tr || (card.alvo === 'inimigos' && card.dano)) {
    const rr = card.dano ? rollExpr(card.dano, vars) : null;
    if (rr) linhas.push(`Dano: ${rr.txt} = <b>${rr.total}</b>${card.tr ? ` · TR ${card.tr} DT ${d.dt}` : ''}`);
    alvos.forEach(t => {
      let passou = false;
      if (card.tr) { const at = { Corpo: 'corpo', Reflexo: 'reflexo', Mente: 'mente', Alma: 'alma' }[card.tr];
        const bonus = t.kind === 'p' ? t.obj.attrs[at] : Math.floor((t.obj.defesa - 10) / 2) + (t.obj.chefe ? 2 : 0); const r = rnd(20) + bonus; passou = r >= d.dt;
        linhas.push(`${esc(t.nome)}: TR ${r} → ${passou ? '<b class="ok">passou</b>' : '<b class="bad">falhou</b>'}`); }
      if (rr && rr.total > 0) { const v = passou ? (card.metade ? Math.floor(rr.total / 2) : 0) : rr.total; if (v > 0) { const dd = aplicaDano(G, t, v, 'Arcano', assin, { pid }); linhas.push(`${esc(t.nome)} sofre <b>${dd}</b>`); aplicaAssinatura(G, t, assin, pid); } }
      if (!passou) condsDoTexto(card.texto).filter(c => !['Imparável', 'Invisível', 'Exausto'].includes(c)).slice(0, 2).forEach(c => addCond(G, t, c, 1));
    });
  } else if (card.dano && card.alvo === 'inimigo') {

  }

    ts.forEach(t => { const max = derived(t.obj).vidaMax; const v = Math.max(0, Math.min(rr.total + extra, max - t.obj.hp)); t.obj.hp += v; if (t.obj.caido && t.obj.hp > 0) { t.obj.caido = false; t.obj.falhas = 0; } fxPush(G, { type: 'heal', target: 'p:' + t.pid, value: v }); linhas.push(`${esc(t.nome)} cura <b class="ok">${v}</b>`); });

    ts.forEach(t => { t.obj.barreira = Math.max(t.obj.barreira || 0, rr.total); linhas.push(`${esc(t.nome)} ganha Barreira <b>${rr.total}</b>`); fxPush(G, { type: 'shield', target: 'p:' + t.pid, value: rr.total }); });

  logPush(G, head + (linhas.length ? '<br>' + linhas.join('<br>') : '') + `<div class="logcard">${card.texto}</div>`, 'action');
  fxPush(G, { type: 'play', who: pid, card: { nome: card.nome, tipo: card.tipo, cor: card.cor } });
}

function ataqueArma(G, ch, pid, card, t, d) {
  const nome = esc(ch.nome);
  if (card.arma === 'recarga') { ch.mun = d.pente; logPush(G, `🔄 ${nome} recarrega.`); return; }
  if (!t) { logPush(G, `${nome}: escolha um alvo.`); return; }
  const ranged = card.arma === 'tiro' || card.arma === 'cabeca';
  if (ranged) { if (d.pente && ch.mun <= 0) { logPush(G, `${nome}: <b class="bad">pente vazio!</b> Recarregue.`); return; } ch.mun = Math.max(0, ch.mun - 1); }
  let bonus = card.arma === 'pesado' && d.dist ? ch.attrs.corpo + (ch.per?.Luta || 0) * 3 : d.atkArma; if (card.arma === 'cabeca') bonus -= d.hsPen;
  const adv = t.obj.conds.some(c => c.n === 'Lido') ? 1 : 0; const r = d20(adv); const def = t.kind === 'e' ? t.obj.defesa : derived(t.obj).defesa;
  const tot = r.v + bonus; const hit = r.v === 20 || (r.v !== 1 && tot >= def); const crit = r.v === 20 || (hit && card.arma === 'cabeca');
  if (adv) t.obj.conds = t.obj.conds.filter(c => c.n !== 'Lido');
  fxPush(G, { type: 'roll', who: pid, d: r.v, bonus, total: tot, vs: def, hit, crit, label: card.nome });
  const tit = { tiro: '🔫 dispara', cabeca: '🎯 mira na cabeça', leve: '👊 golpe leve', pesado: '💥 golpe pesado' }[card.arma];
  if (!hit) { logPush(G, `${nome} ${tit} em ${esc(t.nome)}: ${r.v}+${bonus}=${tot} vs Def ${def} · <b class="bad">ERROU</b>`, 'action'); return; }
  let expr = (card.arma === 'pesado' && d.dist) ? '1d4' : d.arma.dano; const add = d.pf + (ranged ? 0 : (d.agil ? ch.attrs.reflexo : ch.attrs.corpo)) + (ch.naMira || 0);
  if (card.arma === 'pesado') expr += '+2d6'; if (card.arma === 'leve' && ch.itens.includes('soco_carregado')) expr += '+1d4';
  const rr = rollExpr(expr + '+' + add, {}, crit); let total = rr.total; let extra = '';
  const canal = ranged ? 'Balístico' : 'Impacto'; const dd = aplicaDano(G, t, total, canal, null, { pid, ignoraBld: (card.arma === 'pesado' ? 2 : 0) + (ch.asc === 16 ? 2 : 0) });
  if (ch.balaMarcada > 0 && ranged) { ch.balaMarcada--; const b = rollExpr(ch.balaDado || '1d6'); const db = aplicaDano(G, t, b.total, 'Arcano', arcano(ch.asc).assin, { pid }); aplicaAssinatura(G, t, arcano(ch.asc).assin, pid); extra += ` + Bala Marcada ${db} ${arcano(ch.asc).assin}`; }
  if (ch.itens.includes('brinco_de_osso') && !ranged) { const b = rollExpr('1d4'); const db = aplicaDano(G, t, b.total, 'Arcano', arcano(ch.asc).assin, { pid }); aplicaAssinatura(G, t, arcano(ch.asc).assin, pid); extra += ` + ${db} Arcano`; }
  if (ch.itens.includes('munição_mística') && ranged && !ch.misticaUsada) { ch.misticaUsada = true; const b = rollExpr('2d6'); const db = aplicaDano(G, t, b.total, 'Arcano', arcano(ch.asc).assin, { pid }); aplicaAssinatura(G, t, arcano(ch.asc).assin, pid); extra += ` + Munição Mística ${db}`; }
  if (card.arma === 'cabeca' && ch.classe === 'tira') ch.naMira = Math.min(3, (ch.naMira || 0) + 1);
  logPush(G, `${nome} ${tit} em ${esc(t.nome)}: ${r.v}+${bonus}=${tot} vs Def ${def} · <b class="ok">${crit ? 'CRÍTICO!' : 'ACERTO'}</b> · ${rr.txt} → <b class="big">${dd}</b> ${canal}${extra}`, 'action');
}

function ataqueInimigo(G, a) {
  const e = G.enemies.find(x => x.id === a.eid); if (!e || e.dead) return; const r = inimigoRef(e.ref);
  const atk = a.esp ? r.especiais[a.idx] : r.ataques[a.idx]; if (!atk) return;
  const alvos = (a.targets || []).map(t => findTarget(G, t)).filter(Boolean); const linhas = [];
  if (a.esp) { // especial: rola uma vez, TR por alvo
    const rr = rollExpr(atk.dano); linhas.push(`${rr.txt} = <b>${rr.total}</b>`);
    alvos.forEach(t => { let v = rr.total;
      if (atk.tr) { const at = { Corpo: 'corpo', Reflexo: 'reflexo', Mente: 'mente', Alma: 'alma' }[atk.tr]; const tr = rnd(20) + (t.kind === 'p' ? t.obj.attrs[at] : 0); const dt = 10 + Math.floor((r.ataques[0]?.bonus || 6) / 2) + 2; if (tr >= dt) { v = Math.floor(v / 2); linhas.push(`${esc(t.nome)} passou no TR (${tr})`); } }
      const dd = aplicaDano(G, t, v, atk.assin ? 'Arcano' : 'Impacto', atk.assin, {}); if (atk.assin) aplicaAssinatura(G, t, atk.assin, null); linhas.push(`${esc(t.nome)} sofre <b class="big">${dd}</b>`); });
    logPush(G, `☠️ <b>${esc(e.nome)}</b> usa <b>${esc(atk.nome.replace(/:$/, ''))}</b>!<br>${linhas.join('<br>')}`, 'enemy');

  }

      const hit = rr0.v === 20 || (rr0.v !== 1 && tot >= def);
      if (!hit) { linhas.push(`→ ${esc(t.nome)}: ${rr0.v}+${atk.bonus + (e.atkBonus || 0)}=${tot} vs Def ${def} · <b class="ok">errou</b>`); continue; }
      const rr = rollExpr(atk.dano, {}, rr0.v === 20); const dd = aplicaDano(G, t, rr.total, atk.canal, atk.assin, { sismico: e.ref.startsWith('golgoth') });
      if (atk.assin) aplicaAssinatura(G, t, atk.assin, null);
      linhas.push(`→ ${esc(t.nome)}: ${rr0.v}+${atk.bonus + (e.atkBonus || 0)}=${tot} vs Def ${def} · <b class="bad">${rr0.v === 20 ? 'CRÍTICO' : 'ACERTO'}</b> ${rr.txt} → <b class="big">${dd}</b>`);
    }
  });
  logPush(G, `☠️ <b>${esc(e.nome)}</b> ataca com <b>${esc(atk.nome)}</b><br>${linhas.join('<br>')}`, 'enemy'); fxPush(G, { type: 'shake' });
}

function comer(G, a, me) {
  const ch = G.players[a.pid]?.char; if (!ch || (me !== 'mestre' && a.pid !== me)) return; const i = ch.mochila.indexOf(a.nome); if (i < 0) return;
  const f = comidaBy(a.nome); if (!f) return; const d = derived(ch); const fora = !G.combat.active; const msgs = [];
  if (f.tipo === 'prato' && !fora) { logPush(G, 'Pratos completos só fora de combate.'); return; }
  ch.mochila.splice(i, 1); const ef = stripTags(f.efeito);
  if (f.tipo === 'bebida' || f.tipo === 'recarga' || f.tipo === 'alcool') {
    const fo = ef.match(/\+(\d+) Fôlego/); if (fo) { ch.folego = Math.min(d.folegoMax, ch.folego + +fo[1]); msgs.push(`+${fo[1]} Fôlego`); }
    const en = ef.match(/(?:recupera )?(\d+d\d+|\d+) EN/); if (en) { const v = rollExpr(en[1]).total; ch.en = Math.min(d.enMax, ch.en + v); msgs.push(`+${v} EN`); }
    const rg = ef.match(/Regeneração (\d+) por (\d+)/); if (rg) { ch.regen = { x: +rg[1], n: +rg[2] }; msgs.push(`Regeneração ${rg[1]}×${rg[2]}`); }
    if (/levanta um Caído/.test(ef)) { const v = rollExpr('1d8').total; ch.hp = Math.max(ch.hp, v); ch.caido = false; ch.falhas = 0; msgs.push(`levanta com ${v}`); }
    if (/Sangrando/.test(ef)) ch.conds = ch.conds.filter(c => c.n !== 'Sangrando');
    if (f.tipo === 'alcool') { msgs.push('Brinde! (+1 Presença, −1 Reflexo na próxima cena)'); }
  } else if (f.tipo === 'prato') {
    const c = ef.match(/(\d+) de Vida/); const v = /toda a Vida/.test(ef) ? d.vidaMax : (c ? +c[1] : 0);
    if (/do grupo/.test(ef)) { for (const pid in G.players) { const o = G.players[pid].char; if (o) { o.hp = derived(o).vidaMax; o.bem = f.nome; } } msgs.push('cura toda a Vida do grupo'); }
    else { ch.hp = Math.min(d.vidaMax, ch.hp + v); msgs.push(`+${v} Vida`); }
    const en = ef.match(/(\d+d\d+) EN/); if (en) { const x = rollExpr(en[1]).total; ch.en = Math.min(d.enMax, ch.en + x); msgs.push(`+${x} EN`); }
    ch.bem = f.nome; msgs.push(`Bem Alimentado: ${stripTags(f.bem)}`);
  } else {
    const rg = ef.match(/(\d+) por (\d+) rodadas/);
    if (rg) { if (fora) { const v = Math.min(d.vidaMax - ch.hp, +rg[1] * +rg[2]); ch.hp += v; msgs.push(`+${v} Vida`); } else { ch.regen = { x: +rg[1], n: +rg[2] }; msgs.push(`Regeneração ${rg[1]} por ${rg[2]} rodadas`); } }
    if (/remove Exausto/.test(ef)) ch.conds = ch.conds.filter(c => c.n !== 'Exausto');
    const bem = stripTags(f.bem || ''); if (bem && bem !== '—') { ch.bem = f.nome; msgs.push(`Bem Alimentado: ${bem}`); }
    const fo = stripTags(f.bem || '').match(/^\+(\d+) Fôlego/); if (fo) { ch.folego = Math.min(d.folegoMax, ch.folego + 1); }
    if (/EN/.test(stripTags(f.bem)) && f.tipo === 'lanche') { ch.en = Math.min(d.enMax, ch.en + 1); }
  }
  logPush(G, `🍽️ ${esc(ch.nome)} consome <b>${esc(f.nome)}</b>: ${msgs.join(' · ')}`); fxPush(G, { type: 'heal', target: 'p:' + a.pid, value: 0, text: '🍽' });
}

// ===================== REDE =====================
// Mestre = autoridade. Jogadores mandam ações; Mestre aplica e devolve o estado.
const PREFIX = 'arcanos1999-mesa-';
const NET = { role: null, mode: null, peer: null, conns: {}, conn: null, bc: null, myPid: null, onState: null, onStatus: null, retry: 0 };
const useBC = /[?&]bc=1/.test(location.search) || typeof Peer === 'undefined';

function genCode() { const L = 'ABCDEFGHJKLMNPQRSTUVWXYZ'; let s = ''; for (let i = 0; i < 4; i++) s += L[Math.floor(Math.random() * L.length)]; return s; }

// ---- HOST ----
function hostStart(code, onReady, onError) {
  NET.role = 'host';
  if (useBC) { NET.mode = 'bc'; NET.bc = new BroadcastChannel(PREFIX + code); NET.bc.onmessage = e => hostRecv(e.data, null); onReady(code); return; }
  NET.mode = 'peer';
  const peer = new Peer(PREFIX + code, { debug: 1 }); NET.peer = peer;
  peer.on('open', () => onReady(code));
  peer.on('connection', conn => {
    conn.on('open', () => { conn.send({ t: 'state', G: STORE.G }); });
    conn.on('data', msg => hostRecv(msg, conn));
    conn.on('close', () => { const pid = conn._pid; if (pid && STORE.G.players[pid]) { dispatchLocal({ type: 'leave', pid }, 'mestre'); } delete NET.conns[pid]; });
  });
  peer.on('error', err => { if (err.type === 'unavailable-id') onError('Esse código já está em uso. Tente outro.'); else if (err.type === 'network' || err.type === 'server-error' || err.type === 'socket-error') onError('Sem conexão com o servidor de salas. Use a Mesa Única ou tente de novo.'); else console.warn(err); });
  peer.on('disconnected', () => { setTimeout(() => { try { peer.reconnect(); } catch (e) { } }, 1500); });
}
function hostRecv(msg, conn) {

  const go = () => {
    const conn = peer.connect(PREFIX + code, { reliable: true }); NET.conn = conn;
    const to = setTimeout(() => { if (!done) onErr('Não achei essa mesa. Confira o código e se o Mestre está com a sala aberta.'); }, 12000);
    conn.on('open', () => { clearTimeout(to); conn.send(hello); NET.onStatus && NET.onStatus('online'); });

// --- DADOS ESTILO BG3 ---
let isRolling = false;
let dragStartY = 0;

window.showDiceRoll = function(label, expr, bonus, isD20, adv, callback) {
  const ov = document.getElementById('dice-overlay');
  const cube = document.getElementById('dice-cube');
  const resUI = document.getElementById('dice-result-ui');
  ov.style.display = 'flex';
  resUI.style.display = 'none';
  cube.innerText = isD20 ? '20' : '?';
  cube.style.transform = 'translateY(0px) rotate(0deg)';
  
  let tossed = false;
  
  cube.onmousedown = e => { dragStartY = e.clientY; isRolling = true; };
  cube.ontouchstart = e => { dragStartY = e.touches[0].clientY; isRolling = true; };
  
  const finishToss = () => {
    if(!isRolling || tossed) return;
    tossed = true; isRolling = false;
    
    // Animation
    cube.style.transition = 'transform 1s cubic-bezier(0.2, 0.8, 0.2, 1)';
    cube.style.transform = 'translateY(-200px) rotate(720deg) scale(1.5)';
    
    setTimeout(() => {
        cube.style.transform = 'translateY(0px) rotate(1440deg) scale(1)';
        
        let resText, tot;
        if(isD20) {
            const r = window.d20(adv || 0);
            tot = r.v + (bonus || 0);
            resText = `d20[${r.rolls.join(',')}] ${bonus >= 0 ? '+' : ''}${bonus}`;
            cube.innerText = r.v;
            if(r.v === 20) cube.style.color = 'var(--brass)';
            else if(r.v === 1) cube.style.color = 'var(--blood)';
            else cube.style.color = '#fff';
        } else {
            const r = window.rollExpr(expr);
            tot = r.total;
            resText = r.txt;
            cube.innerText = tot;
            cube.style.color = '#fff';
        }
        
        document.getElementById('d-calc').innerText = resText;
        document.getElementById('d-tot').innerText = tot;
        resUI.style.display = 'block';
        
        // MARINAR O RESULTADO! (3 segundos)
        setTimeout(() => {
            ov.style.display = 'none';
            callback(); // Prossegue com a ação mecanicamente
        }, 3000);
    }, 1000);
  };
  
  window.onmouseup = () => finishToss();
  window.ontouchend = () => finishToss();
  
  // Opção automática (clique duplo)
  cube.ondblclick = () => finishToss();
};

// --- INTERCEPTAR ROLAGENS (dispatch override) ---
const origDispatch = window.dispatch;
window.dispatch = function(a) {
    if (a.type === 'roll' && (a.d20 || a.expr)) {
        window.showDiceRoll(a.label, a.expr, a.bonus, !!a.d20, a.adv, () => {
            origDispatch(a); // Send to backend after animation
        });
        return;
    }
    
    if (a.type === 'useCard' || a.type === 'eat' || a.type === 'folego') {
        const pid = a.pid || STORE.myPid;
        const ch = STORE.G.players[pid]?.char;
        if (ch) {
            // Deduct actions locally before sending
            const isPacif = (a.type === 'eat' || a.type === 'folego' || (a.key && a.key.startsWith('i_')));
            if(isPacif) ch.ap_pacif = Math.max(0, (ch.ap_pacif||1) - 1);
            else ch.ap_ativa = Math.max(0, (ch.ap_ativa||1) - 1);
            
            // if both 0, schedule auto-end
            if(ch.ap_pacif === 0 && ch.ap_ativa === 0) {
                setTimeout(() => {
                    if(STORE.G.combat.active) origDispatch({ type: 'endTurn' });
                }, 2000);
            }
        }
    }
    
    origDispatch(a);
};

// --- SISTEMA DE AÇÕES E HUD ---
const origInicioTurno = window.inicioTurno;
window.inicioTurno = function(G, ent) {
    if(ent.kind === 'p' && G.players[ent.id]?.char) {
        G.players[ent.id].char.ap_ativa = 1;
        G.players[ent.id].char.ap_pacif = 1;
    }
    origInicioTurno(G, ent);
};

const origP_TABS_mao = P_TABS.mao;
P_TABS.mao = () => {
    let html = origP_TABS_mao();
    const ch = myChar();
    if(ch) {
        const ativa = ch.ap_ativa !== undefined ? ch.ap_ativa : 1;
        const pacif = ch.ap_pacif !== undefined ? ch.ap_pacif : 1;
        const apHtml = `<div class="ap-tracker">
            <div><i class="ap-dot ativa ${ativa>0?'on':''}"></i> AÇÃO ATIVA</div>
            <div><i class="ap-dot pacif ${pacif>0?'on':''}"></i> AÇÃO PACÍFICA</div>
        </div>`;
        html = html.replace('<div class="hud-main">', apHtml + '<div class="hud-main">');
        
        // Disable cards if out of actions
        if(ativa <= 0) {
            html = html.replace(/class="card t-magia/g, 'class="card t-magia dis');
            html = html.replace(/class="card t-arma/g, 'class="card t-arma dis');
            html = html.replace(/class="card t-musica/g, 'class="card t-musica dis');
            html = html.replace(/class="card t-apice/g, 'class="card t-apice dis');
        }
        if(pacif <= 0) {
            html = html.replace(/class="card t-item/g, 'class="card t-item dis');
        }
    }
    return html;
};

// --- TABULEIRO DRAG (Simples para Mestre) ---
// Permits absolute positioning manipulation
let dragEl = null;
document.addEventListener('mousedown', e => {
    if(!isMestreView()) return;
    const card = e.target.closest('.ecard, .acard');
    if(card) { dragEl = card; card.style.position = 'absolute'; card.style.zIndex = 100; }
});
document.addEventListener('mousemove', e => {
    if(dragEl) { dragEl.style.left = e.pageX + 'px'; dragEl.style.top = e.pageY + 'px'; }
});
document.addEventListener('mouseup', e => {
    if(dragEl) { dragEl.style.zIndex = ''; dragEl = null; }
});

  ['0','I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII','XIII','XIV','XV','XVI','XVII','XVIII','XIX','XX','XXI'].forEach((r, i) => { const a = i / 22 * 2 * Math.PI - Math.PI / 2; s += `<text x="${Math.cos(a) * 160}" y="${Math.sin(a) * 160 + 3}" fill="#c9a24a" stroke="none" font-family="Cinzel" font-size="9" text-anchor="middle" opacity=".75">${r}</text>`; });

// ---------------- CRIAÇÃO DE PERSONAGEM ----------------
const PASSOS = ['Quem é você', 'Ascendente', 'Classe', 'Atributos', 'Perícias', 'Poderes', 'Equipamento', 'Pronto'];
function novoCriador() { return { passo: 0, ch: novoPersonagem({ libras: 10 * rnd(6) }), sel: null, comidas: [] }; }
VIEWS.criar = () => {
  const cr = STORE.ui.cr; const ch = cr.ch; const p = cr.passo;
  return `<div class="criar"><div class="criar-top"><div class="steps">${PASSOS.map((s, i) => `<div class="step ${i === p ? 'on' : i < p ? 'done' : ''}" data-a="crGo" data-i="${i}"><b>${i + 1}</b><span>${s}</span></div>`).join('')}</div></div>
  <div class="criar-body" data-keep="criar">${CRIAR[p](ch, cr)}</div>
  <div class="criar-foot">${btn('← ' + (p ? 'voltar' : 'cancelar'), 'crPrev', {}, 'ghost')}<div class="crhint">${esc(crCheck(p) || '')}</div>${p < 7 ? btn('PRÓXIMO ▶', 'crNext', {}, 'red big' + (crCheck(p) ? ' dis' : '')) : btn('✦ SENTAR À MESA', 'crFinish', {}, 'gold big')}</div>
  ${modalView()}</div>`;
};
function crCheck(p) {
  const ch = STORE.ui.cr.ch;
  if (p === 0 && !ch.nome.trim()) return 'Dê um nome ao personagem.';
  if (p === 1 && ch.asc === null) return 'Escolha um Ascendente.';
  if (p === 2 && !ch.classe) return 'Escolha uma classe.';
  if (p === 3) { const s = Object.values(ch.attrs).reduce((a, b) => a + b, 0); if (s !== 8) return `Distribua os 8 pontos (${8 - s} restando).`; }
  if (p === 4 && (ch.extra || []).length !== 2) return 'Escolha 2 perícias extras.';
  if (p === 5) { const t = trqMax(ch); if ((ch.truques || []).length > t) return 'Truques demais.';
    if (ch.classe === 'mentalista') { if (Object.keys(ch.afin).length < 2) return 'Escolha 2 Entidades de Afinidade.'; if (ch.magias.length !== magMax(ch)) return `Escolha ${magMax(ch)} magia(s) além da de Ascendente.`; }
    if (ch.classe === 'virtuoso' && ch.musicas.length !== 3 + ch.attrs.presenca) return `Escolha ${3 + ch.attrs.presenca} músicas.`; }
  return '';
}
const magMax = ch => Math.min(1 + ch.attrs.mente, 2);
const trqMax = ch => ch.attrs.alma >= 3 ? 2 : ch.attrs.alma >= 1 ? 1 : 0;
H.crGo = d => { const i = +d.i; for (let k = 0; k < i; k++) if (crCheck(k)) return; STORE.ui.cr.passo = i; render(); };
H.crPrev = () => { const cr = STORE.ui.cr; if (cr.passo === 0) { STORE.screen = STORE.ui.voltar || 'join'; render(); return; } cr.passo--; render(); };
H.crNext = () => { const cr = STORE.ui.cr; if (crCheck(cr.passo)) { SFX.bad(); return; } cr.passo++; SFX.card(); render(); };
H.crFinish = () => {
  const cr = STORE.ui.cr; const ch = cr.ch; ch.mochila = cr.comidas.slice(); ch.magias = ch.classe === 'mentalista' ? ch.magias : []; ch.musicas = ch.classe === 'virtuoso' ? ch.musicas : [];
  const afinExtra = ch.classe === 'mentalista' ? Object.assign({}, ch.afin) : {}; ch.afin = afinExtra;
  if (ch.classe !== 'mentalista') ch.afin = {};
  ch.centelhas = 8 - (ch.itens.length ? 8 : 0);
  finalizarPersonagem(ch); salvarChar(ch); banner(ch.nome.toUpperCase(), classe(ch.classe).nome + ' de ' + arcano(ch.asc).nome, arcano(ch.asc).cor);
  if (STORE.role === 'jogador') { clientSend({ type: 'setChar', pid: STORE.myPid, char: ch }); STORE.screen = 'mesa'; STORE.tab = 'mao'; render(); return; }
  if (STORE.ui.criarSeat) { sentarLocal(ch); return; }
  STORE.ui.join.char = ch.id; STORE.screen = 'join'; render();
};
function sentarLocal(ch) {
  const pid = 'l' + uid(); STORE.ui.criarSeat = false; dispatchLocal({ type: 'join', pid, name: ch.nome }, 'mestre'); dispatchLocal({ type: 'setChar', pid, char: ch }, 'mestre');
  STORE.seat = pid; STORE.screen = 'mesa'; STORE.tab = 'mao'; render();
}

  const s = cr.selC || ch.classe; const c = s ? classe(s) : null;

function classeDetalhe(c) {
  return `<h3 class="h-pix">${CLASS_GLYPH[c.key]} ${esc(c.nome)}</h3><p><i>${esc(c.flavor)}</i></p>
  <div class="kv"><div><b>Função</b> ${esc(c.funcao)}</div><div><b>Vida</b> ${c.vida} (+${c.vidaN}/nível)</div><div><b>Energia</b> ${c.en} (+${c.enN}/nível)</div><div><b>Perícias</b> ${c.pericias.join(', ')}</div><div><b>Arma sugerida</b> ${esc(c.arma)}</div></div>
  <div class="mags">${c.habs.map(h => `<div class="mag ${h.apice ? 'apice' : ''}"><b>${esc(h.nome)}</b> <small>${esc(h.tags)}</small><br>${h.texto}${h.melhorias.length ? `<div class="mels">${h.melhorias.map((m, i) => `<span><b>${'I'.repeat(i + 1)}</b> ${m}</span>`).join('')}</div>` : ''}</div>`).join('')}</div>
  <div class="build"><b>BUILD SUGERIDA</b>${Object.entries(c.build).map(([k, v]) => `<div><b>${k}:</b> ${v}</div>`).join('')}</div>`;

H.crCls = d => { STORE.ui.cr.selC = d.k; SFX.card(); render(); };
H.crClsOk = d => { const ch = STORE.ui.cr.ch; ch.classe = d.k; ch.extra = []; ch.magias = []; ch.musicas = []; ch.afin = {}; const sug = classe(d.k).arma.toLowerCase();
  const ar = D.armas.find(a => sug.includes(a.nome.toLowerCase().split(' ')[0])); if (ar) ch.arma = ar.nome; SFX.big(); render(); };

CRIAR[3] = ch => {
  const tot = Object.values(ch.attrs).reduce((a, b) => a + b, 0); const prev = ch.classe ? derived(Object.assign({}, ch, { nivel: 1 })) : null;
  const desc = { corpo: 'força e resistência. Soma na Vida (×3).', reflexo: 'agilidade. Soma na Defesa e na Iniciativa.', mente: 'raciocínio e percepção.', presenca: 'carisma e liderança.', alma: 'vontade e ligação arcana. Soma na Energia, Potência e DT.' };
  return `<div class="cr-grid two"><div class="panel"><h2 class="h-pix">ATRIBUTOS</h2><p class="muted">Distribua <b>8 pontos</b>, no máximo 3 em cada.</p>
  <div class="pts">${'◆'.repeat(8 - tot)}${'◇'.repeat(tot)} <b>${8 - tot}</b> restando</div>
  ${ATTRS.map(([k, n]) => `<div class="attr-row"><div><b>${n}</b><small>${desc[k]}</small></div><div class="stepper">${btn('−', 'crAttr', { k, d: -1 }, 'sq')}<span class="av">${ch.attrs[k]}</span>${btn('+', 'crAttr', { k, d: 1 }, 'sq')}</div></div>`).join('')}</div>
  <div class="panel">${prev ? statsBlock(prev, ch) : ''}</div></div>`;
};
function statsBlock(d, ch) {
  return `<h2 class="h-pix">PRÉVIA</h2><div class="statgrid">
  <div class="st"><b>${d.vidaMax}</b><span>Vida</span></div><div class="st"><b>${d.enMax}</b><span>Energia</span></div><div class="st"><b>${d.defesa}</b><span>Defesa</span></div>
  <div class="st"><b>${d.bld}</b><span>Blindagem</span></div><div class="st"><b>${d.egd}</b><span>Égide</span></div><div class="st"><b>${d.pot}</b><span>Potência</span></div>
  <div class="st"><b>${d.folegoMax}</b><span>Fôlego</span></div><div class="st"><b>${d.dt}</b><span>DT de Poder</span></div><div class="st"><b>+${d.init}</b><span>Iniciativa</span></div></div>`;
}
H.crAttr = d => { const ch = STORE.ui.cr.ch; const tot = Object.values(ch.attrs).reduce((a, b) => a + b, 0); const v = ch.attrs[d.k] + (+d.d);
  if (v < 0 || v > 3 || (+d.d > 0 && tot >= 8)) { SFX.bad(); return; } ch.attrs[d.k] = v; SFX.click();
  if (ch.classe === 'mentalista') ch.magias = ch.magias.slice(0, magMax(ch)); if (ch.classe === 'virtuoso') ch.musicas = ch.musicas.slice(0, 3 + ch.attrs.presenca); ch.truques = ch.truques.slice(0, trqMax(ch)); render(); };

CRIAR[4] = ch => {
  const fix = classe(ch.classe).pericias;
  return `<div class="panel"><h2 class="h-pix">PERÍCIAS</h2><p class="muted">As 4 da classe já vêm treinadas (+3). Escolha <b>mais 2</b>.</p>
  <div class="per-grid">${D.pericias.map(([n, at]) => { const f = fix.includes(n); const on = f || ch.extra.includes(n);
    return `<div class="per ${on ? 'on' : ''} ${f ? 'fix' : ''}" data-a="${f ? '' : 'crPer'}" data-n="${n}"><b>${n}</b><small>${ATTRS.find(x => x[0] === at)[1]} ${ch.attrs[at]} ${on ? '+3' : ''} = ${ch.attrs[at] + (on ? 3 : 0)}</small></div>`; }).join('')}</div></div>`;
};
H.crPer = d => { const ch = STORE.ui.cr.ch; const i = ch.extra.indexOf(d.n); if (i >= 0) ch.extra.splice(i, 1); else if (ch.extra.length < 2) ch.extra.push(d.n); else { SFX.bad(); return; } render(); };

CRIAR[5] = ch => {
  const tm = trqMax(ch); let html = `<div class="panel"><h2 class="h-pix">TRUQUES</h2><p class="muted">Alma ${ch.attrs.alma}: você conhece <b>${tm}</b> truque(s).</p>
  <div class="opt-grid">${D.truques.map((t, i) => `<div class="opt ${ch.truques.includes(i) ? 'on' : ''}" data-a="crTrq" data-i="${i}"><b>${esc(t.nome)}</b><small>${t.texto}</small></div>`).join('')}</div></div>`;
  if (ch.classe === 'mentalista') {
    const ents = Object.keys(ch.afin).map(Number); const nmag = magMax(ch);
    const pool = [ch.asc, ...ents].filter((v, i, a) => a.indexOf(v) === i);
    html += `<div class="panel"><h2 class="h-pix">GRIMÓRIO DO MENTALISTA</h2><p class="muted">Escolha <b>2 Entidades</b> com quem você tem Afinidade 2 (${ents.length}/2) e <b>${nmag}</b> magias de Tier I delas (além da sua Magia de Ascendente).</p>
    <div class="tarot-row">${D.arcanos.filter(a => a.i !== ch.asc).map(a => `<div class="mini-pick ${ents.includes(a.i) ? 'on' : ''}" data-a="crAfin" data-i="${a.i}" style="--c:${a.cor}"><span>${a.num}</span>${esc(a.nome)}</div>`).join('')}</div>
    <div class="opt-grid">${pool.map(i => { const a = arcano(i); const m = a.magias[0]; const key = i + ':1'; const isAsc = i === ch.asc;
      return `<div class="opt ${isAsc || ch.magias.includes(key) ? 'on' : ''} ${isAsc ? 'fix' : ''}" data-a="${isAsc ? '' : 'crMag'}" data-k="${key}" style="--c:${a.cor}"><b>${esc(m.nome)}</b> <small>${esc(a.nome)} · ${esc(m.tags)}${isAsc ? ' · Ascendente' : ''}</small><small>${m.texto}</small></div>`; }).join('')}</div></div>`;
  }
  if (ch.classe === 'virtuoso') {
    const n = 3 + ch.attrs.presenca;
    html += `<div class="panel"><h2 class="h-pix">SETLIST</h2><p class="muted">Escolha <b>${n}</b> músicas (${ch.musicas.length}/${n}). No nível 1 só valem Tier 0 e I; as outras você aprende depois.</p>
    <div class="opt-grid">${D.musicas.map((s, i) => s.tier > 1 ? '' : `<div class="opt song ${ch.musicas.includes(i) ? 'on' : ''}" data-a="crSong" data-i="${i}"><b>♪ ${esc(s.nome)}</b> <small>${esc(s.artista)} · Tier ${s.tier} · ${esc(s.tags)}</small><small>${s.texto}</small></div>`).join('')}</div></div>`;
  }
  if (!['mentalista', 'virtuoso'].includes(ch.classe)) html += `<div class="panel"><p class="muted">Sua classe usa a Energia pelo próprio kit de habilidades — não precisa escolher magias. Itens Arcanos na Jukebox ampliam seu arsenal.</p></div>`;
  return `<div class="cr-grid two">${html}</div>`;
};
H.crTrq = d => { const ch = STORE.ui.cr.ch; const i = +d.i; const k = ch.truques.indexOf(i); if (k >= 0) ch.truques.splice(k, 1); else if (ch.truques.length < trqMax(ch)) ch.truques.push(i); else SFX.bad(); render(); };
H.crAfin = d => { const ch = STORE.ui.cr.ch; const i = +d.i; if (ch.afin[i]) { delete ch.afin[i]; ch.magias = ch.magias.filter(m => +m.split(':')[0] !== i); } else if (Object.keys(ch.afin).length < 2) ch.afin[i] = 2; else SFX.bad(); render(); };
H.crMag = d => { const ch = STORE.ui.cr.ch; const k = ch.magias.indexOf(d.k); if (k >= 0) ch.magias.splice(k, 1); else if (ch.magias.length < magMax(ch)) ch.magias.push(d.k); else SFX.bad(); render(); };
H.crSong = d => { const ch = STORE.ui.cr.ch; const i = +d.i; const k = ch.musicas.indexOf(i); if (k >= 0) ch.musicas.splice(k, 1); else if (ch.musicas.length < 3 + ch.attrs.presenca) ch.musicas.push(i); else SFX.bad(); render(); };

CRIAR[6] = (ch, cr) => `<div class="cr-grid two"><div class="panel"><h2 class="h-pix">ARMA</h2><div class="opt-grid small">${D.armas.map(a => `<div class="opt ${ch.arma === a.nome ? 'on' : ''}" data-a="crArma" data-n="${esc(a.nome)}"><b>${esc(a.nome)}</b><small>${a.dano} · ideal ${a.ideal} · pente ${a.pente} · £${a.preco}</small><small>${a.props}</small></div>`).join('')}</div>
  <h2 class="h-pix">VESTIMENTA</h2><div class="opt-grid small">${D.vestimentas.map(v => `<div class="opt ${ch.vest === v.nome ? 'on' : ''}" data-a="crVest" data-n="${esc(v.nome)}"><b>${esc(v.nome)}</b><small>${v.efeito}</small></div>`).join('')}</div></div>
  <div class="panel"><h2 class="h-pix">2 COMIDAS DE GRAÇA</h2><div class="opt-grid small">${D.comidas.filter(c => ['bebida', 'lanche', 'refeicao'].includes(c.tipo)).map(c => `<div class="opt ${cr.comidas.includes(c.nome) ? 'on' : ''}" data-a="crFood" data-n="${esc(c.nome)}"><b>${esc(c.nome)}</b><small>${c.efeito}${c.bem && c.bem !== '—' ? ' · ' + c.bem : ''}</small></div>`).join('')}</div>
  <h2 class="h-pix">8 ✦ NA JUKEBOX <small>(opcional)</small></h2><div class="opt-grid small">${D.itens.filter(i => i.tier === 1).map(i => `<div class="opt cat-${i.cat} ${ch.itens.includes(i.id) ? 'on' : ''}" data-a="crItem" data-id="${i.id}"><b>${esc(i.nome)}</b><small>${i.ativo ? '[' + esc(i.ativo) + '] ' : ''}${i.texto}</small></div>`).join('')}</div>
  <p class="muted">Dinheiro inicial: <b>£${ch.libras}</b></p></div></div>`;
H.crArma = d => { STORE.ui.cr.ch.arma = d.n; render(); };
H.crVest = d => { STORE.ui.cr.ch.vest = d.n; render(); };
H.crFood = d => { const c = STORE.ui.cr.comidas; const i = c.indexOf(d.n); if (i >= 0) c.splice(i, 1); else if (c.length < 2) c.push(d.n); else SFX.bad(); render(); };
H.crItem = d => { const ch = STORE.ui.cr.ch; ch.itens = ch.itens[0] === d.id ? [] : [d.id]; render(); };

CRIAR[7] = (ch, cr) => {
  const t = finalizarPersonagem(JSON.parse(JSON.stringify(Object.assign({}, ch, { mochila: cr.comidas })))); const d = derived(t);
  return `<div class="cr-grid two"><div class="panel center"><div class="big-tarot">${arcano(ch.asc).svg}</div><h2 class="h-pix">${esc(ch.nome)}</h2><p>${esc(classe(ch.classe).nome)} · descendente de <b style="color:${arcano(ch.asc).cor}">${esc(arcano(ch.asc).nome)}</b></p><p class="muted">${esc(ch.conceito)}</p></div>
  <div class="panel">${statsBlock(d, t)}<p><b>Arma:</b> ${esc(ch.arma)} · <b>Vestimenta:</b> ${esc(ch.vest)}</p><p><b>Perícias:</b> ${Object.keys(t.per).join(', ')}</p>
  <p><b>Mão inicial:</b> ${cartasDe(t).filter(c => !c.bloqueada).map(c => esc(c.nome)).join(' · ')}</p><p class="muted">O primeiro Ponto de Melhoria você gasta já na mesa, na aba Ficha.</p></div></div>`;
};

// ===================== A MESA =====================
VIEWS.mesa = () => {
  const G = STORE.G; if (!G) return '';
  const mestre = isMestreView();
  const tabs = mestre ? [['combate', '⚔', 'Mesa'], ['encontros', '☠', 'Encontros'], ['jogadores', '♟', 'Jogadores'], ['livro', '📖', 'Livro'], ['log', '✉', 'Registro']]
    : [['mao', '⚔', 'Ações'], ['ficha', '👤', 'Ficha'], ['mochila', '🎒', 'Mochila'], ['livro', '📖', 'Livro'], ['log', '✉', 'Registro']];
  if (!tabs.some(t => t[0] === STORE.tab)) STORE.tab = tabs[0][0];
  if (!mestre && !myChar()) return semPersonagem();
  return `<div class="mesa ${mestre ? 'is-mestre' : 'is-jogador'} ${G.combat.active ? 'in-combat' : ''}">
  ${topbar()}
  <div class="mesa-body">
    <main class="mesa-main tab-${STORE.tab}" data-keep="main">${(mestre ? M_TABS : P_TABS)[STORE.tab]()}</main>
    <aside class="mesa-side">${logView()}</aside>
  </div>
  <nav class="tabbar">${tabs.map(([k, i, n]) => `<button class="tab ${STORE.tab === k ? 'on' : ''}" data-a="tab" data-t="${k}"><span>${i}</span>${n}${k === 'mochila' && G.jukebox ? '<em>!</em>' : ''}</button>`).join('')}</nav>
  ${targetBar()}${sceneOverlay()}${modalView()}
</div>`;
};
function semPersonagem() {
  return `<div class="panel-screen"><div class="panel narrow center"><h2 class="h-pix">SEM PERSONAGEM</h2><p>Você está na mesa <b>${esc(STORE.G.code)}</b>, mas ainda não escolheu um personagem.</p>
  <div class="row">${btn('✚ Criar personagem', 'newCharMesa', {}, 'blue big')} ${btn('☆ Personagem pronto', 'pregens')}</div>${STORE.ui.pregenOpen ? pregenPicker() : ''}</div></div>`;
}
H.newCharMesa = () => { STORE.ui.voltar = 'mesa'; STORE.screen = 'criar'; STORE.ui.cr = novoCriador(); render(); };
const _usePregen = H.usePregen;
H.usePregen = d => {
  if (STORE.screen === 'mesa' && STORE.role === 'jogador') { const ch = deProntos(PRONTOS[+d.i]); salvarChar(ch); STORE.ui.pregenOpen = false; clientSend({ type: 'setChar', pid: STORE.myPid, char: ch }); STORE.tab = 'mao'; return; }
  if (STORE.screen === 'mesa' && STORE.role === 'local') { STORE.ui.pregenOpen = false; STORE.ui.modal = null; sentarLocal(deProntos(PRONTOS[+d.i])); return; }
  if (STORE.screen === 'criar' && STORE.role === 'jogador') { const ch = deProntos(PRONTOS[+d.i]); salvarChar(ch); clientSend({ type: 'setChar', pid: STORE.myPid, char: ch }); STORE.screen = 'mesa'; STORE.tab = 'mao'; render(); return; }
  if (STORE.screen === 'criar' && STORE.ui.criarSeat) { sentarLocal(deProntos(PRONTOS[+d.i])); return; }
  if (STORE.screen === 'criar') { const ch = deProntos(PRONTOS[+d.i]); salvarChar(ch); STORE.ui.join = STORE.ui.join || {}; STORE.ui.join.char = ch.id; STORE.screen = 'join'; render(); return; }
  _usePregen(d);
};
H.tab = d => { STORE.tab = d.t; STORE.ui.targeting = null; render(); };

function topbar() {
  const G = STORE.G; const c = G.combat; const cur = c.active ? c.order[c.idx] : null;
  const st = STORE.ui.status; const online = G.modo === 'local' ? 'local' : (st === 'online' ? 'online' : st === 'erro' ? 'erro' : 'conectando');
  const seats = STORE.role === 'local' ? `<div class="seats">${['mestre', ...Object.keys(G.players)].map(s => s === 'mestre' ? `<button class="seat ${STORE.seat === 'mestre' ? 'on' : ''}" data-a="seat" data-s="mestre">♛ Mestre</button>`
    : `<button class="seat ${STORE.seat === s ? 'on' : ''}" data-a="seat" data-s="${s}">${CLASS_GLYPH[G.players[s].char?.classe] || '?'} ${esc((G.players[s].char?.nome || G.players[s].name).split(' ')[0])}</button>`).join('')}<button class="seat add" data-a="addSeat">✚</button></div>` : '';
  return `<header class="topbar">
  <div class="tb-logo" data-a="menu">ARCANOS<b>1999</b></div>
  ${G.modo !== 'local' ? `<div class="code-chip" data-a="copyCode" title="copiar convite">MESA <b>${esc(G.code)}</b> <i class="dot ${online}"></i></div>` : ''}
  ${seats}
  <div class="tb-turn">${c.active ? `<span class="rnd">RODADA ${c.round}</span><span class="who ${cur?.kind}">${cur ? (cur.kind === 'p' ? '♠ ' : '☠ ') + esc(cur.nome) + (cur.divina ? ' ✦' : '') : ''}</span>` : '<span class="calm">fora de combate</span>'}</div>
  ${STORE.ui.netErr && STORE.role !== 'jogador' ? `<div class="neterr">${esc(STORE.ui.netErr)}</div>` : ''}
</header>`;
}

  ${!isMestreView() && myChar() ? btn('⬇ Exportar personagem', 'exportChar') : ''}

function baixar(nome, obj) { const b = new Blob([JSON.stringify(obj, null, 1)], { type: 'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = nome; a.click(); }

M_TABS.historia = () => {
  const G = STORE.G; const c = G.campaign; const ato = ATOS[c.ato - 1];
  const finais = FINAIS.filter(f => f.cond(c));
  return `<div class="hist">
  <div class="atos">${ATOS.map(a => `<button class="ato ${a.n === c.ato ? 'on' : ''}" data-a="setAto" data-n="${a.n}"><b>ATO ${['I', 'II', 'III', 'IV', 'V'][a.n - 1]}</b><span>${esc(a.nome)}</span></button>`).join('')}</div>
  <section class="panel ato-panel"><h2 class="h-pix">ATO ${['I', 'II', 'III', 'IV', 'V'][ato.n - 1]} — ${esc(ato.nome)}</h2><p class="muted">${esc(ato.data)} · nível ${ato.nivel}</p><p>${esc(ato.resumo)}</p>
   <h3>CENAS</h3><div class="cenas">${ato.cenas.map(s => `<div class="cena"><b>${esc(s.t)}</b><p>${esc(s.x)}</p>${btn('📜 narrar', 'narrar', { t: s.t, x: s.x }, 'tiny gold')}</div>`).join('')}</div>
   ${ato.escolhas.length ? `<h3>ESCOLHAS DO ATO</h3>${ato.escolhas.map(es => `<div class="escolha"><b>⟡ ${esc(es.nome)}</b><p>${esc(es.desc)}</p><div class="opts">${es.opcoes.map(op => `<div class="op ${c.flags[es.id] === op.id ? 'on' : ''}" data-a="escolher" data-ato="${ato.n}" data-id="${es.id}" data-op="${op.id}"><b>${esc(op.label)}</b><small>${esc(op.efeito)}</small></div>`).join('')}</div></div>`).join('')}` : ''}
   <div class="row">${btn('🎁 +1 nível para todos', 'grantNivel', {}, 'gold')}${btn('✦ dar Centelhas', 'grantCent')}${btn('£ dar libras', 'grantLib')}</div></section>
  <div class="hist-grid">
   <section class="panel"><h3>REPUTAÇÃO</h3>${FACCOES.map(f => { const v = c.rep[f.id] || 0; return `<div class="rep"><span>${esc(f.nome)}</span>${btn('−', 'rep', { f: f.id, v: -1 }, 'sq')}<div class="repbar">${[-3, -2, -1, 0, 1, 2, 3].map(k => `<i class="${k === v ? 'on' : ''} ${k < 0 ? 'neg' : k > 0 ? 'pos' : ''}"></i>`).join('')}</div>${btn('+', 'rep', { f: f.id, v: 1 }, 'sq')}<b>${v > 0 ? '+' : ''}${v}</b></div>`; }).join('')}
    <p class="small muted">+3 aliada no final · +2 ajuda por ato · −2 caçadores · −3 interfere no ritual</p></section>
   <section class="panel"><h3>FRAGMENTOS DOS DEUSES MORTOS</h3>${FRAGS.map(f => { const s = c.frags[f.id] || 'pendente'; return `<div class="frag ${s}" style="--c:${f.ent === 'Torre' ? '#c8693a' : '#bde0fe'}"><div><b>${esc(f.nome)}</b><small>${f.ent} · Ato ${f.ato} · ${esc(f.onde)}</small></div><select data-ch="fragSet" data-id="${f.id}">${Object.entries(FRAG_ESTADOS).map(([k, n]) => `<option value="${k}" ${k === s ? 'selected' : ''}>${n}</option>`).join('')}</select></div>`; }).join('')}
    <p class="small">Torre com o grupo: <b>${fragCount(c, 'Torre', 'grupo')}/3</b> · Estrela com o grupo: <b>${fragCount(c, 'Estrela', 'grupo')}/3</b> · Com inimigos: ${fragCount(c, 'Torre', 'inimigo') + fragCount(c, 'Estrela', 'inimigo')}</p></section>
   <section class="panel"><h3>FINAIS DISPONÍVEIS</h3>${FINAIS.map(f => `<div class="final ${finais.includes(f) ? 'on' : ''}"><b>${finais.includes(f) ? '◆' : '◇'} ${esc(f.nome)}</b><small>${esc(f.txt)}</small></div>`).join('')}</section>
   <section class="panel"><h3>JULGAMENTO DO DEUS DESPERTO</h3>${['Torre', 'Estrela'].map(ent => { const mods = JULGAMENTO[ent].filter(([, , f]) => f(c)); const afin = Math.max(0, ...Object.values(G.players).map(p => p.char?.afin?.[ent === 'Torre' ? 16 : 17] || 0)); const tot = mods.reduce((s, m) => s + m[1], 0) + afin;
      return `<div class="julg"><b>${ent === 'Torre' ? 'Golgoth' : 'Astraea'}</b><small>${mods.map(m => `${esc(m[0])} ${m[1] > 0 ? '+' : ''}${m[1]}`).join(' · ')} · maior Afinidade +${afin}</small><div>modificador total <b>${tot >= 0 ? '+' : ''}${tot}</b> vs DT 20 ${btn('rolar julgamento', 'julgar', { ent, m: tot }, 'tiny red')}</div></div>`; }).join('')}</section>
   <section class="panel"><h3>NOTAS DO MESTRE</h3><textarea rows="6" data-in="notas" data-focus="notas" placeholder="ganchos, nomes, o que os jogadores prometeram…">${esc(c.notas)}</textarea></section>
  </div></div>`;
};
H.setAto = d => dispatch({ type: 'campaign', ato: +d.n });
H.escolher = d => { if (STORE.G.campaign.flags[d.id] && !confirm('Trocar a escolha? (efeitos de reputação não são desfeitos)')) return; dispatch({ type: 'campaign', escolha: { ato: +d.ato, id: d.id, op: d.op } }); };
H.rep = d => dispatch({ type: 'campaign', rep: { [d.f]: +d.v } });
IN.fragSet = (v, d) => dispatch({ type: 'campaign', frag: { id: d.id, estado: v } });
let notasT; IN.notas = v => { STORE.G.campaign.notas = v; clearTimeout(notasT); notasT = setTimeout(() => dispatch({ type: 'campaign', notas: v }), 600); };
H.julgar = d => dispatch({ type: 'roll', d20: true, bonus: +d.m, dt: 20, label: `Julgamento de ${d.ent === 'Torre' ? 'Golgoth' : 'Astraea'}` });
H.grantNivel = () => { if (confirm('Subir todos os personagens 1 nível?')) dispatch({ type: 'grant', nivel: 1 }); };
H.grantCent = () => { const v = +prompt('Quantas Centelhas para cada jogador?', '10'); if (v) dispatch({ type: 'grant', centelhas: v }); };
H.grantLib = () => { const v = +prompt('Quantas libras para cada jogador?', '20'); if (v) dispatch({ type: 'grant', libras: v }); };

// ---------------- JOGADORES ----------------
M_TABS.jogadores = () => {
  const G = STORE.G; const pids = Object.keys(G.players);
  return `<div class="jogs">${G.modo === 'local' ? `<div class="row">${btn('✚ adicionar jogador nesta tela', 'addSeat', {}, 'blue')}</div>` : `<div class="invite small"><span>Código: <b>${esc(G.code)}</b></span>${btn('copiar convite', 'copyCode', {}, 'tiny gold')}</div>`}
  ${pids.map(pid => { const p = G.players[pid]; const ch = p.char; if (!ch) return `<div class="panel"><b>${esc(p.name)}</b> — criando personagem…</div>`; const d = derived(ch);
   return `<div class="panel jog"><div class="jog-h"><div class="mini-tarot">${arcano(ch.asc).svg}</div><div><b>${esc(ch.nome)}</b> <small>(${esc(p.name)})${p.online === false && G.modo !== 'local' ? ' · offline' : ''}</small><br><small>${esc(classe(ch.classe).nome)} nv ${ch.nivel} · ${esc(arcano(ch.asc).nome)}</small></div></div>
    ${bar(ch.hp, d.vidaMax, 'hp')}${bar(ch.en, d.enMax, 'en')}<small>✦ ${ch.centelhas} · £${ch.libras} · 🩸 ${ch.sangue} · cicatrizes ${ch.cicatrizes} · PM livres ${d.pm}</small>
    ${ch.objetivo ? `<details><summary>objetivo secreto</summary><p class="secret">${esc(ch.objetivo)}</p></details>` : ''}
    <div class="row">${btn('ficha', 'playerPanel', { pid }, 'tiny')}${btn('+1 nível', 'g1', { pid, k: 'nivel' }, 'tiny gold')}${btn('+✦', 'g1', { pid, k: 'cent' }, 'tiny')}${btn('+🩸', 'g1', { pid, k: 'sangue' }, 'tiny')}${btn('afinidade', 'g1', { pid, k: 'afin' }, 'tiny')}${btn('remover', 'rmP', { pid }, 'tiny ghost')}</div></div>`; }).join('') || '<p class="muted">Ninguém na mesa ainda.</p>'}</div>`;
};
H.g1 = d => {
  if (d.k === 'nivel') dispatch({ type: 'grant', pid: d.pid, nivel: 1 });
  if (d.k === 'cent') { const v = +prompt('Centelhas:', '5'); if (v) dispatch({ type: 'grant', pid: d.pid, centelhas: v }); }
  if (d.k === 'sangue') dispatch({ type: 'grant', pid: d.pid, sangue: 1 });
  if (d.k === 'afin') { const n = prompt('Número do Arcano (0–21) e variação, ex.: "11 +1"', '3 +1'); if (!n) return; const [i, v] = n.split(/\s+/); dispatch({ type: 'grant', pid: d.pid, afin: { i: +i, d: +v || 1 } }); }
};
H.rmP = d => { if (confirm('Remover este jogador da mesa?')) dispatch({ type: 'removePlayer', pid: d.pid }); };

// ---------------- LIVRO (consulta) ----------------
function livroView() {
  const q = (STORE.ui.lq || '').toLowerCase(); const sec = STORE.ui.ls || 'arcanos';
  const has = s => !q || stripTags(s).toLowerCase().includes(q);
  const secs = { arcanos: 'Arcanos', classes: 'Classes', musicas: 'Setlist', itens: 'Itens', comidas: 'Comidas', inimigos: 'Inimigos', regras: 'Condições & Combos' };
  let body = '';
  if (sec === 'arcanos') body = D.arcanos.filter(a => has(a.nome + a.assin + a.desc + a.dom)).map(a => `<div class="book-it arc"><div class="mini-tarot">${a.svg}</div><div>${arcanoDetalhe(a)}</div></div>`).join('');
  if (sec === 'classes') body = D.classes.filter(c => has(c.nome + JSON.stringify(c.habs))).map(c => `<div class="book-it">${classeDetalhe(c)}</div>`).join('');
  if (sec === 'musicas') body = D.musicas.filter(s => has(s.nome + s.artista + s.texto)).map(s => `<div class="book-it song ${s.classico ? 'classico' : ''}"><b>♪ ${esc(s.nome)}</b> <small>${esc(s.artista)} · Tier ${s.tier} · ${esc(s.tags)}</small><p>${s.texto}</p></div>`).join('');
  if (sec === 'itens') body = ['arma', 'vigor', 'arcano'].map(cat => `<h3>${cat.toUpperCase()}</h3>` + D.itens.filter(i => i.cat === cat && has(i.nome + i.texto)).map(i => `<div class="book-it item cat-${cat}"><b>${esc(i.nome)}</b> <small>Tier ${i.tier} · ${i.preco} ✦${i.ativo ? ' · ' + esc(i.ativo) : ''}${i.de ? ' · evolui de ' + esc(i.de) : ''}</small><p>${i.texto}</p></div>`).join('')).join('') + `<h3>ARMAS</h3>${D.armas.map(a => `<div class="book-it"><b>${esc(a.nome)}</b> ${a.dano} · ideal ${a.ideal} · pente ${a.pente} · ${a.props} · £${a.preco}</div>`).join('')}<div class="book-it small">${D.propriedades}</div>`;
  if (sec === 'comidas') body = `<div class="book-it small">${D.regrasComida}</div>` + D.comidas.filter(c => has(c.nome + c.efeito)).map(c => `<div class="book-it"><b>${esc(c.nome)}</b> <small>${c.tipo} · £${c.preco}</small> — ${c.efeito}${c.bem && c.bem !== '—' ? ' · <i>Bem Alimentado:</i> ' + c.bem : ''}</div>`).join('') + `<div class="book-it small">${D.brinde}</div>`;
  if (sec === 'inimigos') body = D.inimigos.filter(e => has(e.nome + e.linhas.join(''))).map(e => `<div class="book-it ${e.chefe ? 'boss' : ''}"><b>${esc(e.nome)}</b> <small>${esc(e.tipo)}</small>${e.linhas.map(l => `<p>${l}</p>`).join('')}</div>`).join('');
  if (sec === 'regras') body = `<h3>CONDIÇÕES</h3>${D.condicoes.filter(c => has(c.nome + c.efeito)).map(c => `<div class="book-it"><b>${esc(c.nome)}${c.pesado ? ' ★' : ''}</b> — ${c.efeito}</div>`).join('')}<p class="small">★ controle pesado: ao terminar, o alvo fica Resiliente por 1 rodada.</p>
    <h3>COMBOS ARCANOS</h3>${D.combos.filter(c => has(c.nome + c.efeito)).map(c => `<div class="book-it"><b>${esc(c.nome)}</b> <span style="color:${corAssin(c.a)}">${esc(c.a)}</span> + <span style="color:${corAssin(c.b)}">${esc(c.b)}</span> — ${c.efeito}</div>`).join('')}
    <h3>ASSINATURAS</h3>${D.arcanos.map(a => `<div class="book-it"><b style="color:${a.cor}">${a.num} ${esc(a.assin)}</b> (${esc(a.nome)}) — ${a.ruptura}</div>`).join('')}`;
  return `<div class="livro"><div class="livro-nav">${Object.entries(secs).map(([k, n]) => `<button class="chip ${sec === k ? 'on' : ''}" data-a="ls" data-s="${k}">${n}</button>`).join('')}<input placeholder="buscar no livro…" data-in="lq" data-focus="lq" value="${esc(STORE.ui.lq || '')}"></div><div class="livro-body">${body || '<p class="muted">nada encontrado</p>'}</div></div>`;
}
H.ls = d => { STORE.ui.ls = d.s; render(); };
IN.lq = v => { STORE.ui.lq = v; render(); };
M_TABS.livro = () => livroView();
M_TABS.log = () => logView();
H.openBook = () => { STORE.ui.modal = { cls: 'wide', html: () => livroView() + `<div class="row end">${btn('fechar', 'x', {}, 'ghost')}</div>` }; render(); };

// ---------------- INICIALIZAÇÃO ----------------
function boot() {
  const sala = new URLSearchParams(location.search).get('sala'); if (sala) { H.goJoin(); return; }
  render();
}

boot();
</script>
<div id="dice-overlay">
  <div style="color:#fff; font-family:var(--ui); font-size:24px; margin-bottom:40px;">Segure e arraste o dado para rolar</div>
  <div id="dice-cube">20</div>
  <div id="dice-result-ui">
    <span id="d-calc">1d20+5</span>
    <b id="d-tot">24</b>
  </div>
</div>

</body></html>
