<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>Arcanos: 1999 — Mesa Online</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Stencil+One&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;600&family=Special+Elite&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a0c; --panel: #14141a; --border: #333344;
  --text: #e0e0e0; --muted: #7a7a8c;
  --accent: #d62839; --accent-hover: #ff3b4e;
  --magic: #8f6bff; --tech: #5fd3c7; --gold: #c9a24a;
  --font-ui: 'Barlow Condensed', sans-serif;
  --font-body: 'Barlow', sans-serif;
  --font-num: 'Bebas Neue', sans-serif;
  --font-punk: 'Saira Stencil One', sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--font-body); overflow: hidden; font-size: 15px; user-select: none; }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-thumb { background: var(--border); }

/* TITULO */
#title-screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(circle at center, #1a1a24, #0a0a0c); z-index: 100; }
.logo { font-family: var(--font-punk); font-size: 80px; color: var(--accent); text-shadow: 4px 4px 0 #000; line-height: 1; text-align: center; }
.logo span { color: var(--text); font-size: 40px; display: block; font-family: var(--font-ui); letter-spacing: 10px; }
.menu-btns { display: flex; flex-direction: column; gap: 15px; margin-top: 40px; width: 300px; }
.btn { background: var(--panel); border: 2px solid var(--border); color: var(--text); padding: 12px; font-family: var(--font-ui); font-size: 18px; font-weight: bold; text-transform: uppercase; cursor: pointer; transition: 0.2s; text-align: center; text-decoration: none; }
.btn:hover { border-color: var(--accent); background: #1f1f2a; transform: translateY(-2px); }
.btn.red { border-color: var(--accent); color: var(--accent); }
.btn.red:hover { background: var(--accent); color: #fff; }
.btn.gold { border-color: var(--gold); color: var(--gold); }

/* MESA LAYOUT */
#mesa-screen { display: none; position: fixed; inset: 0; flex-direction: column; }
.topbar { display: flex; align-items: center; justify-content: space-between; padding: 5px 15px; background: #000; border-bottom: 2px solid var(--border); height: 50px; flex: none; }
.turn-order { display: flex; gap: 5px; overflow-x: auto; flex: 1; margin: 0 20px; }
.to-item { padding: 2px 8px; background: var(--panel); border: 1px solid var(--border); font-family: var(--font-ui); font-size: 14px; white-space: nowrap; border-radius: 4px; }
.to-item.active { background: var(--accent); color: #fff; border-color: #fff; font-weight: bold; transform: scale(1.1); }
.to-item.e { border-color: var(--magic); }

.main-area { display: flex; flex: 1; overflow: hidden; }
.board-area { flex: 1; position: relative; background: radial-gradient(circle at center, #1a1a24, #0a0a0c); display: flex; align-items: center; justify-content: center; overflow: hidden; }
.side-panel { width: 350px; background: var(--panel); border-left: 2px solid var(--border); display: flex; flex-direction: column; }

/* ISO BOARD */
.iso-wrapper { transform: perspective(1000px) rotateX(50deg) rotateZ(-45deg); transition: transform 0.3s; position: relative; width: 640px; height: 480px; }
.iso-grid { display: grid; grid-template-columns: repeat(8, 80px); grid-template-rows: repeat(6, 80px); width: 100%; height: 100%; }
.iso-cell { border: 1px solid rgba(255,255,255,0.05); background: rgba(0,0,0,0.3); transition: 0.2s; position: relative; }
.iso-cell:hover { background: rgba(255,255,255,0.1); }
.iso-cell.valid-target { background: rgba(214, 40, 57, 0.3); border: 1px solid var(--accent); cursor: pointer; }
.iso-cell.valid-move { background: rgba(95, 211, 199, 0.3); border: 1px solid var(--tech); cursor: pointer; }

/* TOKENS */
.token { position: absolute; width: 60px; height: 60px; left: 10px; top: 10px; border-radius: 50%; border: 3px solid #fff; background: #222; display: flex; align-items: center; justify-content: center; font-family: var(--font-punk); font-size: 20px; transition: all 0.4s ease; transform-style: preserve-3d; cursor: pointer; box-shadow: 0 10px 20px rgba(0,0,0,0.8); z-index: 10; }
.token[data-kind="e"] { border-color: var(--magic); }
.token[data-kind="p"] { border-color: var(--tech); }
.token.dead { filter: grayscale(1); opacity: 0.5; }
.token-inner { transform: rotateZ(45deg) rotateX(-50deg); display: flex; flex-direction: column; align-items: center; justify-content: center; text-shadow: 2px 2px 0 #000; width: 100%; height: 100%; }
.token-hp { position: absolute; bottom: -20px; left: 50%; transform: translateX(-50%); font-family: var(--font-num); font-size: 16px; background: #000; padding: 2px 6px; border-radius: 4px; border: 1px solid #555; white-space: nowrap; }
.token-hp .bar { height: 4px; background: var(--accent); margin-top: 2px; border-radius: 2px; }
.token.hit { animation: shake 0.4s; }
.token.atk { animation: bump 0.4s; }
@keyframes shake { 0%, 100% { transform: translate(0,0); } 25% { transform: translate(-5px, 5px); } 75% { transform: translate(5px, -5px); } }
@keyframes bump { 0%, 100% { transform: translate(0,0); } 50% { transform: translate(15px, -15px) scale(1.1); } }

/* HUD & SKILL BAR */
.bottom-hud { height: 140px; background: var(--panel); border-top: 2px solid var(--border); display: flex; align-items: center; padding: 10px 20px; gap: 20px; }
.ap-box { display: flex; flex-direction: column; gap: 10px; flex: none; }
.ap { display: flex; align-items: center; gap: 10px; font-family: var(--font-ui); font-size: 16px; font-weight: bold; text-transform: uppercase; }
.ap-dot { width: 20px; height: 20px; border-radius: 50%; background: #333; box-shadow: inset 0 0 5px #000; }
.ap-dot.ativa.on { background: var(--accent); box-shadow: 0 0 10px var(--accent); }
.ap-dot.pacifica.on { background: var(--tech); box-shadow: 0 0 10px var(--tech); }

.skill-bar { display: flex; gap: 10px; overflow-x: auto; flex: 1; padding-bottom: 5px; }
.skill { width: 80px; height: 80px; background: #000; border: 2px solid var(--border); border-radius: 8px; position: relative; cursor: pointer; transition: 0.2s; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 5px; }
.skill:hover { border-color: var(--gold); transform: translateY(-5px); }
.skill.ativa { border-bottom: 4px solid var(--accent); }
.skill.pacifica { border-bottom: 4px solid var(--tech); }
.skill.dis { opacity: 0.4; filter: grayscale(1); cursor: not-allowed; }
.skill-icon { font-size: 24px; margin-bottom: 4px; }
.skill-name { font-family: var(--font-ui); font-size: 12px; font-weight: bold; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }
.skill-cd { position: absolute; inset: 0; background: rgba(0,0,0,0.7); color: #fff; font-family: var(--font-num); font-size: 32px; display: flex; align-items: center; justify-content: center; border-radius: 6px; }

.hud-actions { display: flex; flex-direction: column; gap: 10px; flex: none; }

/* SIDE TABS */
.side-tabs { display: flex; border-bottom: 2px solid var(--border); }
.stab { flex: 1; padding: 10px; background: #000; border: none; color: var(--muted); font-family: var(--font-ui); font-weight: bold; cursor: pointer; text-transform: uppercase; }
.stab.on { color: var(--gold); background: var(--panel); border-bottom: 2px solid var(--gold); }
.side-content { flex: 1; overflow: auto; padding: 15px; font-family: var(--font-body); font-size: 14px; }

/* CHAT */
.chat-msg { margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
.chat-msg b { color: var(--gold); font-family: var(--font-ui); font-size: 16px; display: block; }
.chat-input { display: flex; margin-top: auto; padding-top: 10px; }
.chat-input input { flex: 1; background: #000; border: 1px solid var(--border); color: #fff; padding: 8px; font-family: var(--font-body); }
.chat-input button { background: var(--border); border: none; color: #fff; padding: 8px 12px; cursor: pointer; }

/* MODAL & POPUPS */
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; z-index: 200; backdrop-filter: blur(5px); }
.modal { background: var(--panel); border: 2px solid var(--border); padding: 25px; width: 90%; max-width: 600px; max-height: 90vh; overflow-y: auto; position: relative; }
.modal h2 { font-family: var(--font-punk); color: var(--gold); margin-bottom: 15px; font-weight: normal; }
.close-modal { position: absolute; top: 15px; right: 15px; background: none; border: none; color: var(--muted); font-size: 24px; cursor: pointer; }
.close-modal:hover { color: #fff; }

/* DICE ROLLER 3D (BG3 STYLE) */
#dice-overlay { position: fixed; inset: 0; z-index: 300; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; perspective: 1000px; }
.dice-container { width: 100px; height: 100px; position: relative; transform-style: preserve-3d; transition: transform 0.1s; cursor: grab; }
.dice-container:active { cursor: grabbing; }
.dice-face { position: absolute; width: 100px; height: 100px; background: rgba(20,20,30,0.9); border: 2px solid var(--gold); display: flex; align-items: center; justify-content: center; font-family: var(--font-num); font-size: 50px; color: var(--gold); box-shadow: inset 0 0 20px rgba(0,0,0,1); backface-visibility: hidden; }
.df-front  { transform: rotateY(  0deg) translateZ(50px); }
.df-back   { transform: rotateY(180deg) translateZ(50px); }
.df-right  { transform: rotateY( 90deg) translateZ(50px); }
.df-left   { transform: rotateY(-90deg) translateZ(50px); }
.df-top    { transform: rotateX( 90deg) translateZ(50px); }
.df-bottom { transform: rotateX(-90deg) translateZ(50px); }
.dice-hint { position: absolute; top: 20%; color: #fff; font-family: var(--font-ui); font-size: 24px; text-shadow: 2px 2px 4px #000; pointer-events: none; }
.dice-result-ui { position: absolute; bottom: 20%; display: none; flex-direction: column; align-items: center; animation: popin 0.5s; }
.dice-total { font-family: var(--font-num); font-size: 80px; color: #fff; text-shadow: 0 0 20px var(--gold); line-height: 1; }
.dice-calc { font-family: var(--font-ui); font-size: 20px; color: var(--muted); }

@keyframes popin { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.anim-toss { animation: toss 2s ease-out forwards; }
@keyframes toss { 
    0% { transform: translate(0, 50vh) rotateX(0) rotateY(0) scale(1.5); } 
    30% { transform: translate(0, -20vh) rotateX(720deg) rotateY(360deg) scale(0.8); } 
    60% { transform: translate(0, 0) rotateX(1080deg) rotateY(720deg) scale(1.2); }
    100% { transform: translate(0, 0) rotateX(1440deg) rotateY(1080deg) scale(1); } 
}

/* FLOATS */
.floatnum { position: fixed; font-family: var(--font-num); font-size: 40px; text-shadow: 2px 2px 0 #000, 0 0 10px currentColor; pointer-events: none; animation: floatup 2s ease-out forwards; z-index: 150; transform: translateX(-50%); }
@keyframes floatup { 0% { opacity:0; transform: translate(-50%, 10px) scale(0.5); } 10% { opacity:1; transform: translate(-50%, -10px) scale(1.2); } 100% { opacity:0; transform: translate(-50%, -60px) scale(1); } }

/* TELEGRAPHS */
.telegraph-toast { position: absolute; top: 60px; right: 20px; background: rgba(214, 40, 57, 0.9); border-left: 4px solid #fff; padding: 10px; color: #fff; font-family: var(--font-ui); z-index: 90; box-shadow: 0 5px 15px rgba(0,0,0,0.5); max-width: 300px; }

.input-grp { display: flex; flex-direction: column; margin-bottom: 12px; }
.input-grp label { color: var(--gold); font-family: var(--font-ui); font-size: 14px; margin-bottom: 4px; text-transform: uppercase; }
.input-grp input, .input-grp select, .input-grp textarea { background: #000; border: 1px solid var(--border); color: #fff; padding: 10px; font-family: var(--font-body); }
.input-grp input:focus { border-color: var(--tech); outline: none; }

</style>
</head>
<body>

<div id="title-screen">
    <div class="logo">ARCANOS<span>1999</span></div>
    <div class="menu-btns">
        <button class="btn red" onclick="goHost()">Criar Mesa (Mestre)</button>
        <button class="btn tech" onclick="goJoin()">Entrar na Mesa (Jogador)</button>
        <button class="btn gold" onclick="goLocal()">Mesa Única (Local)</button>
        <button class="btn" onclick="showTutorial()">Como Jogar</button>
    </div>
</div>

<div id="mesa-screen">
    <div class="topbar">
        <div style="font-family:var(--font-punk); color:var(--accent); font-size:24px;">A:1999</div>
        <div class="turn-order" id="turn-order-ui"></div>
        <div style="font-family:var(--font-ui); font-weight:bold; color:var(--gold);" id="room-code-ui">MESA: ----</div>
    </div>
    
    <div class="main-area">
        <div class="board-area" id="board-container">
            <div class="iso-wrapper">
                <div class="iso-grid" id="iso-grid"></div>
                <div id="tokens-layer"></div>
            </div>
            <div id="telegraphs-ui"></div>
        </div>
        
        <div class="side-panel">
            <div class="side-tabs">
                <button class="stab on" onclick="setTab('chat')">Chat</button>
                <button class="stab" onclick="setTab('ficha')" id="tab-ficha">Ficha</button>
                <button class="stab" onclick="setTab('mestre')" id="tab-mestre" style="display:none; color:var(--accent)">Mestre</button>
            </div>
            <div class="side-content" id="side-content"></div>
        </div>
    </div>
    
    <div class="bottom-hud" id="bottom-hud">
        <div class="ap-box">
            <div class="ap"><div class="ap-dot ativa" id="ap-ativa"></div> ATIVA</div>
            <div class="ap"><div class="ap-dot pacifica" id="ap-pacifica"></div> PACÍFICA</div>
        </div>
        <div class="skill-bar" id="skill-bar"></div>
        <div class="hud-actions">
            <button class="btn gold" id="btn-move" onclick="toggleMoveMode()">Mover</button>
            <button class="btn" id="btn-endturn" onclick="endMyTurn()">Fim do Turno</button>
        </div>
    </div>
</div>

<div id="dice-overlay">
    <div class="dice-hint" id="dice-hint">Arraste para rolar</div>
    <div class="dice-container" id="dice-cube">
        <div class="dice-face df-front" id="df-1">20</div>
        <div class="dice-face df-back" id="df-2">1</div>
        <div class="dice-face df-right" id="df-3">15</div>
        <div class="dice-face df-left" id="df-4">5</div>
        <div class="dice-face df-top" id="df-5">10</div>
        <div class="dice-face df-bottom" id="df-6">18</div>
    </div>
    <div class="dice-result-ui" id="dice-result">
        <div class="dice-total" id="dice-tot">24</div>
        <div class="dice-calc" id="dice-calc">15 + 9</div>
    </div>
</div>

<div id="modal-layer"></div>

do raízes como chicotes capazes de esmagar o aço. Seu poder acelera o crescimento celular, curando feridas instantaneamente ou causando mutações explosivas nos inimigos, que florescem até a morte.", "sociedade": "o Verde Vivo, cooperativas agrícolas e uma ONG ambiental.", "dom": "no fim de cada cena, recupera 1d4 + Corpo de Vida. Curas que você realiza curam +2.", "fraqueza": "sofre +2 de dano de Plasma e de qualquer fogo.", "assin": "Vital", "assinExtra": "", "ruptura": "<b>Florescer</b> — o alvo fica <b>Enraizado</b> por 1 rodada e o aliado mais ferido a até 9 m dele cura 1d6 + POT.", "magias": [{"tier": 1, "nome": "Raízes", "tags": "3 EN · Rec 2 · 12 m", "texto": "raízes rompem o chão; 2d6 + POT Vital e o alvo fica Enraizado (TR Corpo evita o Enraizado)."}, {"tier": 2, "nome": "Seiva", "tags": "5 EN · Rec 3 · 9 m", "texto": "um aliado cura 3d6 + POT e ganha <b>Regeneração 3</b> por 2 rodadas."}, {"tier": 3, "nome": "Floresta do Asfalto", "tags": "8 EN · 1×/cena", "texto": "área de 9 m vira floresta por 3 rodadas: terreno difícil para inimigos, cobertura leve para aliados, e inimigos que terminem o turno ali sofrem 2d6 Vital."}], "svg": "<svg class=\"tarot\" viewBox=\"0 0 100 165\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\">\n<defs>\n<pattern id=\"dotsg3\" width=\"4\" height=\"4\" patternUnits=\"userSpaceOnUse\"><circle cx=\"2\" cy=\"2\" r=\".55\" fill=\"#59d15b\" opacity=\".18\"/></pattern>\n<radialGradient id=\"glowg3\" cx=\"50%\" cy=\"48%\" r=\"50%\"><stop offset=\"0\" stop-color=\"#59d15b\" stop-opacity=\".28\"/><stop offset=\"1\" stop-color=\"#59d15b\" stop-opacity=\"0\"/></radialGradient>\n</defs>\n<rect x=\"0\" y=\"0\" width=\"100\" height=\"165\" rx=\"6\" fill=\"#121212\"/>\n<rect x=\"0\" y=\"0\" width=\"100\" height=\"165\" rx=\"6\" fill=\"url(#dotsg3)\"/>\n<rect x=\"4\" y=\"4\" width=\"92\" height=\"157\" rx=\"4\" fill=\"none\" stroke=\"#59d15b\" stroke-width=\"1.4\"/>\n<rect x=\"7\" y=\"7\" width=\"86\" height=\"151\" rx=\"3\" fill=\"none\" str ente através de ondas sonoras e palavras de poder. Se ele disser \"Ajoelhe\", a gravidade local esmaga os joelhos dos inimigos contra o chão. Seus coros geram campos de ressonância capazes de desintegrar armaduras e estilhaçar a força de vontade de quem os escuta.", "sociedade": "a Ordem do Coro — igrejas, escolas de música e corais.", "dom": "+2 em Persuasão e Intimidação; suas músicas e ordens são ouvidas a 30 m.", "fraqueza": "se estiver impedido de falar ou <b>Silenciado</b>, perde o Dom e não usa magias.", "assin": "Sônico", "assinExtra": "", "ruptura": "<b>Silêncio Imposto</b> — o alvo fica <b>Silenciado</b> por 1 rodada (não usa habilidades nem magias).", "magias": [{"tier": 1, "nome": "Ajoelhe", "tags": "3 EN · Rec 2 · 9 m", "texto": "2d6 + POT Sônico e o alvo cai <b>Derrubado</b> (TR Corpo evita a queda)."}, {"tier": 2, "nome": "Coro de Ressonância", "tags": "5 EN · Rec 3 · 6 m ao redor", "texto": "3d6 + POT Sônico em todos os inimigos e −2 de Blindagem por 2 rodadas."}, {"tier": 3, "nome": "Palavra Primeira", "tags": "8 EN · 1×/cena · 12 m", "texto": "dê uma ordem de uma palavra (\"Fuja\", \"Pare\", \"Solte\"). Todos os inimigos que ouvirem obedecem no próximo turno deles (TR Mente evita; chefes perdem 2 de Postura)."}], "svg": "<svg class=\"tarot\" viewBox=\"0 0 100 165\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\">\n<defs>\n<pattern id=\"dotsg5\" width=\"4\" height=\"4\" patternUnits=\"userSpaceOnUse\"><circle cx=\"2\" cy=\"2\" r=\".55\" fill=\"#ffd23f\" opacity=\".18\"/></pattern>\n<radialGradient id=\"glowg5\" cx=\"50%\" cy=\"48%\" r=\"50%\"><stop offset=\"0\" stop-color=\"#ffd23f\" stop-opacity=\".28\"/><stop offset=\"1\" stop-color=\"#ffd23f\" stop-opacity=\"0\"/></radialGradient>\n</defs>\n<rect x=\"0\" y=\"0\" width=\"100\" height=\"165\" rx=\"6\" fill=\"#121212\"/>\n<rect x=\"0\" y=\"0\" width=\"100\" height=\"165\" rx=\"6\" fill=\"url(#dotsg5)\"/>\n<rect x=\"4\" y=\"4\" width=\"92\" height=\"157\" rx=\"4\" fill=\"none\" stroke=\"#ffd23f\" sucesso, determinação e controle.", "desc": "Balthazar é a personificação do movimento. Absorve e multiplica energia cinética. Quanto mais se move, mais indestrutível e rápido se torna, criando ondas de choque devastadoras apenas ao correr. Uma vez que ele foca em um alvo, as leis da fricção deixam de existir, e seu corpo vira o projétil perfeito.", "sociedade": "a Balthazar Speed — corridas clandestinas e transportadoras.", "dom": "+3 m de deslocamento e +2 em Atletismo.", "fraqueza": "se não se mover no turno, sofre −2 de Defesa até o próximo.", "assin": "Cinético", "assinExtra": "", "ruptura": "<b>Atropelo</b> — o alvo é empurrado 3 m e fica <b>Derrubado</b>; se colidir com uma parede ou criatura, ambos sofrem +1d8.", "magias": [{"tier": 1, "nome": "Impulso", "tags": "3 EN · Rec 2 · você", "texto": "o próximo ataque neste turno causa +1 de dano por 1,5 m que você percorreu antes dele (máx. +8)."}, {"tier": 2, "nome": "Investida Sem Atrito", "tags": "5 EN · Rec 3 · linha de 12 m", "texto": "avance em linha reta; todos no caminho sofrem 3d6 + POT Cinético e são empurrados para os lados."}, {"tier": 3, "nome": "Velocidade Terminal", "tags": "8 EN · 1×/cena", "texto": "por 2 rodadas, ganhe uma Ação de Movimento extra por turno, +2 de Blindagem para cada 6 m percorridos no turno e imunidade a Lento e Enraizado."}], "svg": "<svg class=\"tarot\" viewBox=\"0 0 100 165\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\">\n<defs>\n<pattern id=\"dotsg7\" width=\"4\" height=\"4\" patternUnits=\"userSpaceOnUse\"><circle cx=\"2\" cy=\"2\" r=\".55\" fill=\"#ff9f1c\" opacity=\".18\"/></pattern>\n<radialGradient id=\"glowg7\" cx=\"50%\" cy=\"48%\" r=\"50%\"><stop offset=\"0\" stop-color=\"#ff9f1c\" stop-opacity=\".28\"/><stop offset=\"1\" stop-color=\"#ff9f1c\" stop-opacity=\"0\"/></radialGradient>\n</defs>\n<rect x=\"0\" y=\"0\" width=\"100\" height=\"165\" rx=\"6\" fill=\"#121212\"/>\n<rect x=\"0\" y=\"0\" width=\"100\" height=\"165\" rx=\"6\" fill=\"url(#dotsg7)\"/>\n<rect x , "conceito": "causa e efeito, verdade e equilíbrio.", "desc": "Valeria dita o equilíbrio matemático do universo. Ela não ataca diretamente: invoca a <b>Balança</b>. Qualquer dano físico ou mágico desferido contra ela é imediatamente refletido no agressor na mesma proporção. Se um deus usar todo o seu poder contra Valeria, esse deus sofrerá o impacto integral do próprio golpe. Ela torna todos iguais perante a dor.", "sociedade": "o Tribunal Valeria — escritórios de advocacia e juízes.", "dom": "uma vez por cena, ao sofrer dano, devolva metade dele ao agressor (Retributivo).", "fraqueza": "se atacar quem não atacou você nem um aliado nesta cena, perde o Dom até o fim da cena.", "assin": "Retributivo", "assinExtra": "", "ruptura": "<b>Sentença</b> — até o fim do próximo turno do alvo, metade de todo dano que ele causar volta para ele.", "magias": [{"tier": 1, "nome": "Balança", "tags": "3 EN · Rec 3 · você", "texto": "por 1 rodada, todo dano que sofrer é refletido (metade) em quem o causou."}, {"tier": 2, "nome": "Juramento", "tags": "5 EN · Rec 3 · 12 m", "texto": "marque um inimigo e um aliado. Enquanto durar (2 rodadas), cada dano que o inimigo causar ao aliado é causado de volta, integral, como Retributivo."}, {"tier": 3, "nome": "Equilíbrio", "tags": "8 EN · 1×/cena · 12 m", "texto": "escolha dois alvos (aliados ou inimigos). A Vida dos dois passa a ser a média entre eles (arredonde para baixo)."}], "svg": "<svg class=\"tarot\" viewBox=\"0 0 100 165\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\">\n<defs>\n<pattern id=\"dotsg11\" width=\"4\" height=\"4\" patternUnits=\"userSpaceOnUse\"><circle cx=\"2\" cy=\"2\" r=\".55\" fill=\"#f1f1f1\" opacity=\".18\"/></pattern>\n<radialGradient id=\"glowg11\" cx=\"50%\" cy=\"48%\" r=\"50%\"><stop offset=\"0\" stop-color=\"#f1f1f1\" stop-opacity=\".28\"/><stop offset=\"1\" stop-color=\"#f1f1f1\" stop-opacity=\"0\"/></radialGradient>\n</defs>\n<rect x=\"0\" y=\"0\" width=\"100\" height=\"165\" rx=\"6\" fill=\"#121212\"/>\ el", "morto": false, "cor": "#d0213a", "conceito": "sacrifício, pausa e novas perspectivas.", "desc": "Mael detém o poder sobre a estagnação. Suspende alvos no ar, paralisando-os no tempo e no espaço. Seu verdadeiro poder é o sacrifício: ao ferir a si mesmo — como perfurar a própria mão —, converte a dor em magias catastróficas de área, quebrando as leis da física porque o tributo de sangue já foi pago.", "sociedade": "o Clube dos Pendurados — artistas de performance, tatuadores e body art.", "dom": "ao perder 3 de Vida de propósito (Ação Rápida), ganha +2 POT e +2 no próximo teste até o fim do turno.", "fraqueza": "magias de Tier II e III exigem pagar metade do custo em Vida em vez de Energia.", "assin": "Hemático", "assinExtra": "ignora a Égide do alvo quando você está abaixo da metade da Vida", "ruptura": "<b>Suspensão</b> — o alvo flutua 1 m, não pode se mover e tem −2 de Defesa por 1 rodada.", "magias": [{"tier": 1, "nome": "Suspensão", "tags": "3 EN · Rec 3 · 9 m", "texto": "paralisa um alvo no ar por 1 rodada (TR Corpo evita)."}, {"tier": 2, "nome": "Tributo", "tags": "5 EN + 5 Vida · Rec 3 · 12 m", "texto": "área de 3 m; 4d6 + POT Hemático (TR Corpo, metade)."}, {"tier": 3, "nome": "Sangue Pago", "tags": "8 EN · 1×/cena", "texto": "perca metade da sua Vida atual. Causa o dobro do valor perdido como Hemático, dividido como quiser entre inimigos a 12 m."}], "svg": "<svg class=\"tarot\" viewBox=\"0 0 100 165\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\">\n<defs>\n<pattern id=\"dotsg12\" width=\"4\" height=\"4\" patternUnits=\"userSpaceOnUse\"><circle cx=\"2\" cy=\"2\" r=\".55\" fill=\"#d0213a\" opacity=\".18\"/></pattern>\n<radialGradient id=\"glowg12\" cx=\"50%\" cy=\"48%\" r=\"50%\"><stop offset=\"0\" stop-color=\"#d0213a\" stop-opacity=\".28\"/><stop offset=\"1\" stop-color=\"#d0213a\" stop-opacity=\"0\"/></radialGradient>\n</defs>\n<rect x=\"0\" y=\"0\" width=\"100\" height=\"165\" rx=\"6\" fill=\"#121212\"/>\n<rect x=\"0\" y=\"0\" width=\"100\" hei das, ficando mais forte quanto mais destruição houver ao redor, e reanima os minerais e ossos do chão para lutar por ele.", "sociedade": "a Funerária Moros — funerárias, ferros-velhos e cemitérios.", "dom": "ao participar de um abate, recupera 1d4 de Energia.", "fraqueza": "equipamentos de metal que carrega enferrujam (seus itens de Arma custam +2 ✦), e estranhos o evitam (−2 em Persuasão).", "assin": "Entrópico", "assinExtra": "", "ruptura": "<b>Decomposição</b> — +1d8 de dano e o alvo fica <b>Ferido</b> (curas pela metade) por 2 rodadas.", "magias": [{"tier": 1, "nome": "Decomposição", "tags": "3 EN · Rec 2 · 9 m", "texto": "o alvo sofre 1d6 + POT Entrópico por turno durante 3 turnos."}, {"tier": 2, "nome": "Ossos do Chão", "tags": "5 EN · Rec 4 · 9 m", "texto": "ergue 2 esqueletos minerais (Vida 8, Defesa 12, +4, 1d6 Entrópico) por 3 rodadas."}, {"tier": 3, "nome": "Colheita", "tags": "8 EN · 1×/cena · 9 m ao redor", "texto": "todo inimigo abaixo de 25% da Vida na área morre (chefes perdem 15 de Vida). Você cura 1d8 por criatura afetada."}], "svg": "<svg class=\"tarot\" viewBox=\"0 0 100 165\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\">\n<defs>\n<pattern id=\"dotsg13\" width=\"4\" height=\"4\" patternUnits=\"userSpaceOnUse\"><circle cx=\"2\" cy=\"2\" r=\".55\" fill=\"#9bb45f\" opacity=\".18\"/></pattern>\n<radialGradient id=\"glowg13\" cx=\"50%\" cy=\"48%\" r=\"50%\"><stop offset=\"0\" stop-color=\"#9bb45f\" stop-opacity=\".28\"/><stop offset=\"1\" stop-color=\"#9bb45f\" stop-opacity=\"0\"/></radialGradient>\n</defs>\n<rect x=\"0\" y=\"0\" width=\"100\" height=\"165\" rx=\"6\" fill=\"#121212\"/>\n<rect x=\"0\" y=\"0\" width=\"100\" height=\"165\" rx=\"6\" fill=\"url(#dotsg13)\"/>\n<rect x=\"4\" y=\"4\" width=\"92\" height=\"157\" rx=\"4\" fill=\"none\" stroke=\"#9bb45f\" stroke-width=\"1.4\"/>\n<rect x=\"7\" y=\"7\" width=\"86\" height=\"151\" rx=\"3\" fill=\"none\" stroke=\"#9bb45f\" stroke-width=\".5\" opacity=\".7\"/>\n<circle cx=\"50\" cy=\"80\" r=\" em 1d8 e ficam Derrubados.", "magias": [{"tier": 1, "nome": "Fissura", "tags": "3 EN · Rec 2 · linha de 6 m", "texto": "rompe o chão; 2d6 + POT Sísmico e Derrubado (TR Reflexo evita a queda)."}, {"tier": 2, "nome": "Palmas da Ruína", "tags": "5 EN · Reação · Rec 4", "texto": "anule uma magia ou habilidade que mire você; o conjurador sofre 2d6 Sísmico."}, {"tier": 3, "nome": "Desabamento", "tags": "8 EN · 1×/cena · 18 m", "texto": "uma estrutura ou área de 6 m desaba: 6d6 + POT Sísmico (TR Reflexo, metade) e o terreno vira abismo/escombro."}], "svg": "<svg class=\"tarot\" viewBox=\"0 0 100 165\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\">\n<defs>\n<pattern id=\"dotsg16\" width=\"4\" height=\"4\" patternUnits=\"userSpaceOnUse\"><circle cx=\"2\" cy=\"2\" r=\".55\" fill=\"#c8693a\" opacity=\".18\"/></pattern>\n<radialGradient id=\"glowg16\" cx=\"50%\" cy=\"48%\" r=\"50%\"><stop offset=\"0\" stop-color=\"#c8693a\" stop-opacity=\".28\"/><stop offset=\"1\" stop-color=\"#c8693a\" stop-opacity=\"0\"/></radialGradient>\n</defs>\n<rect x=\"0\" y=\"0\" width=\"100\" height=\"165\" rx=\"6\" fill=\"#121212\"/>\n<rect x=\"0\" y=\"0\" width=\"100\" height=\"165\" rx=\"6\" fill=\"url(#dotsg16)\"/>\n<rect x=\"4\" y=\"4\" width=\"92\" height=\"157\" rx=\"4\" fill=\"none\" stroke=\"#c8693a\" stroke-width=\"1.4\"/>\n<rect x=\"7\" y=\"7\" width=\"86\" height=\"151\" rx=\"3\" fill=\"none\" stroke=\"#c8693a\" stroke-width=\".5\" opacity=\".7\"/>\n<circle cx=\"50\" cy=\"80\" r=\"46\" fill=\"url(#glowg16)\"/>\n<text x=\"50\" y=\"25\" text-anchor=\"middle\" font-family=\"Cinzel\" font-weight=\"900\" font-size=\"15\" fill=\"#c8693a\">XVI</text>\n<line x1=\"22\" y1=\"31\" x2=\"78\" y2=\"31\" stroke=\"#c8693a\" stroke-width=\".6\"/>\n<path d=\"M36,110 L40,58 L60,58 L64,110Z\" fill=\"none\" stroke=\"#c8693a\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M38,58 L38,50 L46,50 L46,54 L54,54 L54,50 L62,50 L62,58\" fill=\"none\" stroke=\"#c8693a\" stroke- iedade": "a Casa dos Ecos — historiadores, médiuns e guardiões de memoriais.", "dom": "uma vez por cena, um aliado que cair pode agir mais uma vez antes de ficar Caído.", "fraqueza": "ouve sussurros dos mortos. Em cenas silenciosas, −2 em Percepção.", "assin": "Ancestral", "assinExtra": "", "ruptura": "<b>Eco</b> — no início do seu próximo turno, o golpe que causou a Ruptura se repete com metade do dano.", "magias": [{"tier": 1, "nome": "Eco", "tags": "3 EN · Rec 3 · 12 m", "texto": "invoca o eco de um aliado ou inimigo derrotado nesta cena, que faz um ataque com os valores originais dele."}, {"tier": 2, "nome": "Toque de Despertar", "tags": "5 EN · Rec 4 · 9 m", "texto": "um aliado Caído levanta com 1d8 + POT de Vida; ou uma magia/habilidade que você usou nesta cena se repete sem custo."}, {"tier": 3, "nome": "Exército de Ecos", "tags": "8 EN · 1×/cena", "texto": "ecos de uma sociedade caída varrem uma linha de 18 × 3 m: 6d6 + POT Ancestral e empurram 6 m."}], "svg": "<svg class=\"tarot\" viewBox=\"0 0 100 165\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\">\n<defs>\n<pattern id=\"dotsg20\" width=\"4\" height=\"4\" patternUnits=\"userSpaceOnUse\"><circle cx=\"2\" cy=\"2\" r=\".55\" fill=\"#c7a6ff\" opacity=\".18\"/></pattern>\n<radialGradient id=\"glowg20\" cx=\"50%\" cy=\"48%\" r=\"50%\"><stop offset=\"0\" stop-color=\"#c7a6ff\" stop-opacity=\".28\"/><stop offset=\"1\" stop-color=\"#c7a6ff\" stop-opacity=\"0\"/></radialGradient>\n</defs>\n<rect x=\"0\" y=\"0\" width=\"100\" height=\"165\" rx=\"6\" fill=\"#121212\"/>\n<rect x=\"0\" y=\"0\" width=\"100\" height=\"165\" rx=\"6\" fill=\"url(#dotsg20)\"/>\n<rect x=\"4\" y=\"4\" width=\"92\" height=\"157\" rx=\"4\" fill=\"none\" stroke=\"#c7a6ff\" stroke-width=\"1.4\"/>\n<rect x=\"7\" y=\"7\" width=\"86\" height=\"151\" rx=\"3\" fill=\"none\" stroke=\"#c7a6ff\" stroke-width=\".5\" opacity=\".7\"/>\n<circle cx=\"50\" cy=\"80\" r=\"46\" fill=\"url(#glowg20)\"/>\n<text x=\"50\" y=\"25\" text-anchor=\"middle\" font-fa iciais (fábricas, metrô, palácio).", "assin": "Telúrico", "assinExtra": "", "ruptura": "<b>Sobrecarga Magnética</b> — o alvo e todos a 3 m sofrem 1d8, e os itens ativos do alvo ganham +1 de Recarga.", "magias": [{"tier": 1, "nome": "Fusão de Ambientes", "tags": "3 EN · Rec 3 · 12 m", "texto": "área de 3 m vira outro terreno (lama, gelo, água, magma frio) por uma cena."}, {"tier": 2, "nome": "Polo Magnético", "tags": "5 EN · Rec 3 · 12 m", "texto": "puxe ou empurre até 3 alvos em 6 m. Quem carrega armas de metal sofre 2d6 + POT Telúrico."}, {"tier": 3, "nome": "Maré Profunda", "tags": "8 EN · 1×/cena", "texto": "o peso do oceano desaba numa área de 9 m: 6d6 + POT Telúrico, Lento por 2 rodadas e todos os projéteis na área param."}], "svg": "<svg class=\"tarot\" viewBox=\"0 0 100 165\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\">\n<defs>\n<pattern id=\"dotsg21\" width=\"4\" height=\"4\" patternUnits=\"userSpaceOnUse\"><circle cx=\"2\" cy=\"2\" r=\".55\" fill=\"#2ec4a6\" opacity=\".18\"/></pattern>\n<radialGradient id=\"glowg21\" cx=\"50%\" cy=\"48%\" r=\"50%\"><stop offset=\"0\" stop-color=\"#2ec4a6\" stop-opacity=\".28\"/><stop offset=\"1\" stop-color=\"#2ec4a6\" stop-opacity=\"0\"/></radialGradient>\n</defs>\n<rect x=\"0\" y=\"0\" width=\"100\" height=\"165\" rx=\"6\" fill=\"#121212\"/>\n<rect x=\"0\" y=\"0\" width=\"100\" height=\"165\" rx=\"6\" fill=\"url(#dotsg21)\"/>\n<rect x=\"4\" y=\"4\" width=\"92\" height=\"157\" rx=\"4\" fill=\"none\" stroke=\"#2ec4a6\" stroke-width=\"1.4\"/>\n<rect x=\"7\" y=\"7\" width=\"86\" height=\"151\" rx=\"3\" fill=\"none\" stroke=\"#2ec4a6\" stroke-width=\".5\" opacity=\".7\"/>\n<circle cx=\"50\" cy=\"80\" r=\"46\" fill=\"url(#glowg21)\"/>\n<text x=\"50\" y=\"25\" text-anchor=\"middle\" font-family=\"Cinzel\" font-weight=\"900\" font-size=\"15\" fill=\"#2ec4a6\">XXI</text>\n<line x1=\"22\" y1=\"31\" x2=\"78\" y2=\"31\" stroke=\"#2ec4a6\" stroke-width=\".6\"/>\n<ellipse cx=\"50\" cy=\"80\" rx=\"22\" ry=\"32\" fill=\"none\" st t-family=\"Special Elite\" font-size=\"6.2\" fill=\"#2ec4a6\">OMNIS</text>\n<text x=\"50\" y=\"156\" text-anchor=\"middle\" font-family=\"Oswald\" font-weight=\"600\" font-size=\"5\" letter-spacing=\".6\" fill=\"#f2ece0\" opacity=\".75\">TELÚRICO</text>\n</svg>"}], "classes": [{"key": "devoto", "nome": "O Devoto", "funcao": "Suporte", "vida": 22, "vidaN": 5, "en": 14, "enN": 4, "pericias": ["Ocultismo", "Persuasão", "Percepção", "Investigação"], "arma": "revólver .38", "flavor": "Pode usar a Energia para aplicar efeitos em outros membros do grupo e em inimigos. Reza para Entidades que não respondem há mil anos — e, ultimamente, elas respondem.", "habs": [{"nome": "Rosário", "apice": false, "tags": "Passiva", "texto": "Sempre que você cura, protege ou concede um bônus a um aliado, ganha 1 <b>Fé</b> (máx. 5). Gaste Fé a qualquer momento: <b>1 Fé</b> = +1 no teste de um aliado a 9 m (depois de rolar); <b>3 Fé</b> = remove uma condição de um aliado (Ação Rápida).", "melhorias": []}, {"nome": "Bênção", "apice": false, "tags": "Nv 1 · 2 EN · Rec 1 · 12 m · Ação Rápida", "texto": "Um aliado ganha <b>Barreira 4 + POT</b> e +2 no próximo teste.", "melhorias": ["o aliado também ganha +3 m de deslocamento por 1 rodada.", "Barreira +4.", "afeta 2 aliados."]}, {"nome": "Marca da Fé", "apice": false, "tags": "Nv 1 · 3 EN · Rec 2 · 12 m", "texto": "Ataque Arcano. O inimigo sofre <b>1d8 + POT</b> e fica <b>Marcado</b> por 2 rodadas: −2 em ataques e na Defesa. Aliados que o acertarem curam 2 de Vida.", "melhorias": ["Marcado também reduz a Égide do alvo em 2.", "a cura dos aliados vira 1d4 + 2.", "se o alvo cair, a Marca salta para outro inimigo a 6 m."]}, {"nome": "Intercessão", "apice": false, "tags": "Nv 2 · 3 EN · Rec 3 · 9 m", "texto": "Escolha uma Entidade com quem você tenha <b>Afinidade 2+</b>. Um aliado ganha o <b>Dom</b> dela até o fim do próximo turno dele (além do próprio Dom).", "melhorias": ["dura 2 rodadas.", "alcance 18 m e você ganha 1 Fé.", "os ataques do aliado também aplicam Marcas da Assinatura daquela Entidade."]}, {"nome": "Milagre", "apice": true, "tags": "Ápice · Nv 3 · 6 EN · Rec 6 · 12 m ao redor", "texto": "Todos os aliados na área curam <b>3d6 + POT</b> e se livram de uma condição. Aliados Caídos levantam com metade dessa cura.", "melhorias": ["+1d6 de cura.", "aliados ficam <b>Imparáveis</b> por 1 rodada.", "inimigos na área sofrem dano igual à cura (TR Alma, metade)."]}], "build": {"Ordem de Melhorias": "Bênção I → Marca da Fé I → Bênção II → Milagre I", "Itens-chave": "Bênção Portátil, Bateria Extra, Extensor de Duração, Segunda Chance", "Ascendentes que combinam": "Ishara (curas +2), Astraea (aura contra medo), Azrael (aliado caído age de novo)", "Dica de mesa": "guarde 3 de Fé para tirar o Atordoado do tanque na hora certa. Um Devoto parado é o melhor item do time."}}, {"key": "mentalista", "nome": "O Mentalista", "funcao": "Mago / Controle", "vida": 18, "vidaN": 4, "en": 16, "enN": 5, "pericias": ["Percepção", "Persuasão", "Ocultismo", "Investigação"], "arma": "pistola 9 mm", "flavor": "Seres sensitivos que usam de forma ativa os poderes do seu Ascendente, indo além dos atributos passivos. São poucos no mundo. Leem pessoas, entendem o que pensam e as manipulam.", "habs": [{"nome": "Sensitivo", "apice": false, "tags": "Passiva", "texto": "Você é o <b>único</b> que conjura magias do <b>Grimório dos Arcanos</b> (Capítulo 4). Conhece <b>2 + Mente</b> magias e começa sabendo a Magia de Ascendente. Na criação, escolha duas outras Entidades: sua Afinidade com elas começa em 2. Ao ver um inimigo, você sabe a Assinatura dele e quantas habilidades dele estão fora de Recarga.", "melhorias": []}, {"nome": "Leitura", "apice": false, "tags": "Nv 1 · 1 EN · Rec 1 · 18 m · Ação Rápida", "texto": "TR Mente. Se falhar, o alvo fica <b>Lido</b>: o próximo ataque contra ele tem vantagem e ele não usa Reações até o próximo turno dele. Você também descobre o que ele pretende fazer no próximo turno.", "melhorias": ["alcance 30 m.", "sem TR se o alvo tiver Marca da sua Assinatura.", "lê 2 alvos."]}, {"nome": "Pulso Mental", "apice": false, "tags": "Nv 1 · 2 EN · Rec 1 · 18 m", "texto": "Ataque Arcano: <b>2d6 + POT</b>. Se o alvo estiver Lido, +1d6 e aplica 2 Marcas.", "melhorias": ["+1d6 de dano.", "atinge também um segundo alvo a 3 m do primeiro.", "alvos Lidos ficam Silenciados por 1 rodada."]}, {"nome": "Eco do Ascendente", "apice": false, "tags": "Nv 2 · custo da magia +2 EN · Rec da magia", "texto": "Conjure sua <b>Magia de Ascendente</b> ampliada: dobre a área, <b>ou</b> a duração, <b>ou</b> os dados de dano.", "melhorias": ["escolha duas ampliações.", "a Recarga da magia diminui em 1.", "funciona com qualquer magia de Tier I que você conheça."]}, {"nome": "Voz da Entidade", "apice": true, "tags": "Ápice · Nv 3 · 6 EN · Rec 6 · você", "texto": "Por 2 rodadas você canaliza o Ascendente: <b>+4 POT</b>, magias custam metade (arred. p/ cima), cada acerto aplica 2 Marcas e você fica <b>Imparável</b>. Depois, fica <b>Exausto</b> (−2 em tudo) por 1 rodada.", "melhorias": ["dura 3 rodadas.", "sem Exaustão.", "durante a Voz, conjure a magia de Tier III do seu Arcano mesmo que já usada na cena."]}], "build": {"Ordem de Melhorias": "Pulso Mental I → Leitura I → Pulso Mental II → Voz da Entidade I", "Itens-chave": "Fita K7 → Fita Dupla → Espírito Sem Limites; Relógio Quebrado; Vinil Riscado", "Ascendentes que combinam": "Sybil (Lido em cadeia), Solarius (Clarão e Meio-Dia), Ilios & Lyra (Térmico duplo)", "Dica de mesa": "Leitura antes de tudo: além de vantagem para o time, você descobre o próximo passo do inimigo e avisa a mesa."}}, {"key": "virtuoso", "nome": "O Virtuoso", "funcao": "Suporte / Controle", "vida": 22, "vidaN": 5, "en": 14, "enN": 4, "pericias": ["Performance", "Persuasão", "Atletismo", "Tecnologia"], "arma": "guitarra (corpo a corpo e foco)", "flavor": "Canaliza a Energia no próprio instrumento, criando músicas que afetam os inimigos e o grupo. Cada show é um ritual; cada acorde, uma oração barulhenta.", "habs": [{"nome": "Crescendo", "apice": false, "tags": "Passiva", "texto": "Você tem um medidor de <b>Ritmo</b> (0–5). Ganha 1 Ritmo em cada turno em que <b>tocar</b> (usar Riff, uma música da Setlist ou manter uma música Sustentada). Se passar um turno inteiro sem tocar, o Ritmo zera. Músicas que causam dano, curam ou dão escudo <b>somam o Ritmo</b>. Com Ritmo 5, a próxima música é um <b>Bis</b>: custa 0 EN e o Ritmo volta a 2. Você conhece <b>3 + Presença</b> músicas da <b>Setlist</b> (Capítulo 8).", "melhorias": []}, {"nome": "Riff", "apice": false, "tags": "Nv 1 · 1 EN · sem Recarga · 9 m · Ação Rápida", "texto": "Um aliado ganha +2 no próximo teste, <b>ou</b> um inimigo sofre <b>1d4 + Ritmo</b> (sem teste).", "melhorias": ["+1d4 no dano.", "alcance 18 m.", "afeta um aliado <i>e</i> um inimigo ao mesmo tempo."]}, {"nome": "Acorde Dissonante", "apice": false, "tags": "Nv 1 · 3 EN · Rec 2 · cone de 6 m", "texto": "Onda sonora: <b>2d6 + POT + Ritmo</b>; TR Corpo ou é empurrado 3 m e fica Derrubado (passou: metade do dano).", "melhorias": ["+1d6.", "com Ritmo 4+, quem falhar também fica Atordoado.", "cone de 9 m."]}, {"nome": "Microfonia", "apice": false, "tags": "Nv 2 · 2 EN · Rec 3 · 12 m", "texto": "Coloque um <b>amplificador fantasma</b> num ponto por 3 rodadas. Suas músicas podem sair dele, e inimigos que terminarem o turno a 3 m dele sofrem <b>1d6 + Ritmo</b> e perdem 1 Fôlego.", "melhorias": ["dura 5 rodadas.", "dano 2d6 + Ritmo.", "dois amplificadores."]}, {"nome": "Solo", "apice": true, "tags": "Ápice · Nv 3 · 6 EN · Rec 6 · 12 m · Sustentada", "texto": "Por até 3 rodadas (mantenha com Ação Rápida), aliados na área ganham <b>+2 em todos os testes</b> e <b>+Ritmo de dano</b> nos ataques; inimigos sofrem −2. Seu Ritmo não cai durante o Solo.", "melhorias": ["aliados recuperam 1 Fôlego por turno.", "inimigos na área ficam Lentos.", "ao fim, <b>Guitarra Quebrada</b>: explosão de 6d6 em 6 m (TR Reflexo, metade)."]}], "build": {"Ordem de Melhorias": "Riff I → Acorde Dissonante I → Microfonia I → Solo I", "Itens-chave": "Bateria Extra, Giz de Sal, Carga Extra (Acorde), Extensor de Duração", "Ascendentes que combinam": "Oram (Sônico silencia), Nox (Onírico apavora), Vesper (Recargas)", "Dica de mesa": "nunca deixe o Ritmo cair. Um Riff de 1 EN mantém o Crescendo vivo enquanto você espera a música certa."}}, {"key": "ativista", "nome": "O Ativista", "funcao": "Tanque / Iniciador", "vida": 30, "vidaN": 7, "en": 8, "enN": 3, "pericias": ["Luta", "Atletismo", "Intimidação", "Rua"], "arma": "taco de beisebol ou corrente", "flavor": "Pode usar a Energia para absorver dano e gerar uma onda cinética que afeta os inimigos próximos. É quem fica na frente do piquete quando a Guarda chega.", "habs": [{"nome": "Carga Cinética", "apice": false, "tags": "Passiva", "texto": "Sempre que sofrer dano, ganhe <b>Carga</b> igual à metade do dano (depois das reduções). Máximo de Carga: 10 + 5 × nível. A Carga zera no fim da cena.", "melhorias": []}, {"nome": "Aguentar a Pancada", "apice": false, "tags": "Nv 1 · 1 EN · Rec 1 · Reação", "texto": "Reduza um dano que você sofreria em <b>1d6 + Corpo</b>. O valor reduzido também vira Carga.", "melhorias": ["+1d6 de redução.", "use quando um aliado a 3 m for atingido: você se joga na frente e recebe o golpe no lugar dele.", "ganhe 1 Fôlego ao usar."]}, {"nome": "Onda Cinética", "apice": false, "tags": "Nv 1 · 2 EN · Rec 2 · 3 m ao redor", "texto": "Gaste quanto quiser da sua Carga: todos os inimigos na área sofrem esse valor como dano arcano (TR Corpo, metade) e são empurrados 1,5 m.", "melhorias": ["área de 4,5 m.", "se gastou 10+ de Carga, quem falhar fica Derrubado.", "aplica 2 Marcas."]}, {"nome": "Linha de Piquete", "apice": false, "tags": "Nv 2 · 3 EN · Rec 3 · você", "texto": "Por 2 rodadas, <b>Provoca</b>: inimigos a 6 m que atacarem outro alvo têm desvantagem. Você ganha +2 de Blindagem e +2 de Égide.", "melhorias": ["ganhe também Barreira 6.", "aliados adjacentes a você têm cobertura (+2 Defesa).", "inimigos a 6 m fazem TR Mente; quem falhar gasta o próximo movimento vindo até você."]}, {"nome": "Terremoto de Rua", "apice": true, "tags": "Ápice · Nv 3 · 6 EN · Rec 6 · salto de 9 m", "texto": "Salte até 9 m e caia liberando <b>toda a Carga + 3d6</b> em 6 m ao redor (TR Corpo, metade). Quem falhar fica Derrubado e Lento.", "melhorias": ["você fica Imparável durante o salto e até seu próximo turno.", "a Carga não zera: cai pela metade.", "área de 9 m."]}], "build": {"Ordem de Melhorias": "Aguentar a Pancada I → Onda Cinética I → Aguentar a Pancada II → Terremoto de Rua I", "Itens-chave": "Jaqueta Forrada → Escudo de Combate → Fortaleza; Placa de Kevlar; Imparável; Inibidor", "Ascendentes que combinam": "Tiberion (Blindagem), Golgoth (Sísmico derruba), Leonora (Fúria e Sangramento)", "Dica de mesa": "entre primeiro, provoque com a Linha de Piquete e segure a Onda até ter 15+ de Carga."}}, {"key": "assombrado", "nome": "O Assombrado", "funcao": "Assassino", "vida": 20, "vidaN": 5, "en": 12, "enN": 4, "pericias": ["Furtividade", "Percepção", "Ocultismo", "Atletismo"], "arma": "canivete borboleta e pistola", "flavor": "Pode usar a Energia para criar projeções astrais, desaparecer, aumentar a agilidade ou distrair inimigos. Viveu tempo demais perto da linha entre os vivos e os ecos.", "habs": [{"nome": "Entre Mundos", "apice": false, "tags": "Passiva", "texto": "O primeiro ataque que você faz <b>saindo de Invisibilidade</b>, ou contra um alvo que não o viu neste turno, é um <b>Crítico</b>. Sempre que participar de um abate, todas as suas Recargas diminuem em 1.", "melhorias": []}, {"nome": "Projeção", "apice": false, "tags": "Nv 1 · 1 EN · Rec 2 · 18 m · Ação Rápida", "texto": "Coloque sua projeção astral num ponto por 3 rodadas. Você vê e ouve por ela. Ela tem a sua Defesa e 1 de Vida.", "melhorias": ["um inimigo adjacente à projeção tem desvantagem no próximo ataque.", "alcance 30 m.", "duas projeções."]}, {"nome": "Desaparecer", "apice": false, "tags": "Nv 1 · 3 EN · Rec 3 · você", "texto": "Fique <b>Invisível</b> até o fim do seu próximo turno ou até atacar, e ganhe +3 m de deslocamento.", "melhorias": ["também remove Lento e Enraizado.", "dura 2 rodadas.", "ao reaparecer atacando, o alvo fica Silenciado por 1 rodada."]}, {"nome": "Passo Fantasma", "apice": false, "tags": "Nv 2 · 2 EN · Rec 2 · teleporte", "texto": "Troque de lugar com sua Projeção (ou teleporte 9 m) e faça um <b>Golpe Leve</b> gratuito.", "melhorias": ["o golpe aplica 2 Marcas.", "Recarga 1.", "leve junto um aliado adjacente."]}, {"nome": "Dobra Fantasma", "apice": true, "tags": "Ápice · Nv 3 · 6 EN · Rec 6 · você", "texto": "Crie uma <b>duplicata</b> com a sua ficha e metade da sua Vida atual. Ela age logo depois de você por 3 rodadas e causa metade do dano. Se você cair, pode trocar de lugar com ela.", "melhorias": ["a duplicata causa dano integral.", "a duplicata começa Invisível.", "duas duplicatas."]}], "build": {"Ordem de Melhorias": "Desaparecer I → Passo Fantasma I → Desaparecer III → Dobra Fantasma I", "Itens-chave": "Brinco de Osso, Cano Curto, Surto, Frenesi", "Ascendentes que combinam": "Nox (Onírico + Invisível), Enoch (escuridão), Nihil (Caos e teleporte)", "Dica de mesa": "mire no suporte inimigo. Abates reduzem suas Recargas: limpe Tropas para resetar o Desaparecer."}}, {"key": "tira", "nome": "O Tira", "funcao": "Atirador", "vida": 24, "vidaN": 6, "en": 10, "enN": 3, "pericias": ["Pontaria", "Luta", "Investigação", "Intimidação"], "arma": "pistola 9 mm ou escopeta", "flavor": "Pode usar a Energia para imbuir sua arma com o poder do seu Ascendente, aplicando efeitos diferentes conforme a Entidade. Ex-policial, segurança, caçador de recompensa — ou um Tira de verdade, que trocou de lado.", "habs": [{"nome": "Distintivo", "apice": false, "tags": "Passiva", "texto": "Seu <b>Tiro na Cabeça</b> tem penalidade de −3 (em vez de −5). Cada Tiro na Cabeça acertado concede <b>Na Mira</b>: +1 PF até o fim da cena (máx. +3).", "melhorias": []}, {"nome": "Bala Marcada", "apice": false, "tags": "Nv 1 · 2 EN · Rec 2 · Ação Rápida", "texto": "Seus próximos 2 tiros causam <b>+1d6 de dano arcano</b> e cada acerto aplica 1 Marca da sua Assinatura.", "melhorias": ["vale para 3 tiros.", "+1d8 em vez de +1d6.", "os tiros perfuram e acertam também quem estiver logo atrás do alvo."]}, {"nome": "Fogo Cruzado", "apice": false, "tags": "Nv 1 · 3 EN · Rec 3", "texto": "Faça <b>dois ataques</b> com a arma na mesma Ação Principal, sem penalidade (gasta 2 de munição).", "melhorias": ["três ataques, cada um com −2.", "se dois acertarem o mesmo alvo, ele fica Lento.", "os ataques podem mirar alvos diferentes sem penalidade."]}, {"nome": "Algemas Arcanas", "apice": false, "tags": "Nv 2 · 3 EN · Rec 4 · 12 m", "texto": "Ataque de Pontaria. Se acertar, o alvo fica <b>Enraizado e Desarmado</b> por 1 rodada.", "melhorias": ["alcance 18 m.", "Enraizado por 2 rodadas.", "algeme o alvo a outro inimigo a 6 m: os dois ficam Enraizados."]}, {"nome": "Veredito", "apice": true, "tags": "Ápice · Nv 3 · 6 EN · Rec 6 · alcance da arma", "texto": "Um tiro que <b>acerta automaticamente</b> e ignora Blindagem e escudos. Causa o dano da arma <b>× 3 + PF</b>. Se o alvo cair, a Recarga do Veredito zera.", "melhorias": ["+1d10 de dano.", "contra alvos abaixo de 30% da Vida, × 4.", "atravessa todos os alvos em linha."]}], "build": {"Ordem de Melhorias": "Bala Marcada I → Fogo Cruzado I → Bala Marcada II → Veredito I", "Itens-chave": "Pente Estendido, Mira Riscada → Luneta Longa → Caçador de Cabeças, Munição Mística, Balas Ácidas", "Ascendentes que combinam": "Solarius (Plasma derrete Blindagem), Vane (Rasgo), Valeria (Retributivo)", "Dica de mesa": "o Tiro na Cabeça a −3 é a sua identidade. Com um alvo Lido pela Mentalista, ele vira vantagem."}}, {"key": "sabio", "nome": "O Sábio", "funcao": "Estrategista", "vida": 18, "vidaN": 4, "en": 16, "enN": 4, "pericias": ["Investigação", "Ocultismo", "Tecnologia", "Percepção"], "arma": "besta ou rifle de caça", "flavor": "Pode usar a Energia para focar e lembrar de coisas que nunca aprendeu, mas que seu Ascendente sabe. No combate, é quem lê o tabuleiro inteiro.", "habs": [{"nome": "Análise", "apice": false, "tags": "Passiva", "texto": "Como Ação Rápida, <b>Analise</b> um inimigo que você veja. Você e seus aliados descobrem as Resistências, Vulnerabilidades e a Postura dele, e ele sofre <b>+2 de dano de todas as fontes</b>. Só um alvo pode estar Analisado por vez. <b>Fora de combate:</b> gaste 1 EN e faça um teste de Mente (DT 12) para perguntar ao Mestre algo que seu Ascendente poderia saber.", "melhorias": []}, {"nome": "Ponto Fraco", "apice": false, "tags": "Nv 1 · 2 EN · Rec 2 · 18 m", "texto": "O alvo Analisado perde <b>3 de Blindagem e 3 de Égide</b> até o fim do seu próximo turno.", "melhorias": ["dura 1 rodada a mais.", "cada aliado que acertá-lo ganha 1 EN.", "aplique 1 Marca de cada Assinatura presente no seu grupo (abre Combos Arcanos)."]}, {"nome": "Memória Ancestral", "apice": false, "tags": "Nv 1 · 3 EN · Rec 3", "texto": "Escolha: ganhe treino (+3) numa perícia até o fim da cena, <b>ou Copie</b> a última habilidade de Tier I (ou menor) que um <b>inimigo</b> usou nesta cena, usando a sua POT.", "melhorias": ["pode copiar habilidades de aliados.", "pode copiar Tier II.", "Recarga 2."]}, {"nome": "Plano de Batalha", "apice": false, "tags": "Nv 2 · 3 EN · Rec 3 · 18 m", "texto": "Até 3 aliados se movem <b>3 m</b> cada (sem provocar ataques) e ganham +2 de Defesa até o seu próximo turno.", "melhorias": ["6 m.", "cada um recupera 1 Fôlego.", "um deles pode fazer uma Ação Principal imediatamente."]}, {"nome": "Revelação", "apice": true, "tags": "Ápice · Nv 3 · 6 EN · Rec 6 · Reação", "texto": "Quando um inimigo <b>declarar</b> uma ação, anule-a: \"eu já li isso\". A Energia e a Recarga dele são gastas mesmo assim, e cada aliado ganha uma Ação Rápida imediata.", "melhorias": ["também revela todos os invisíveis a 18 m e os deixa Lidos.", "Recarga 5.", "contra chefes, também retira 3 de Postura."]}], "build": {"Ordem de Melhorias": "Ponto Fraco I → Plano de Batalha I → Ponto Fraco II → Revelação I", "Itens-chave": "Válvula de Rádio, Relógio Quebrado, Glifo do Silêncio, Maldição", "Ascendentes que combinam": "Sybil (leitura total), Vesper (tempo), Azrael (ecos)", "Dica de mesa": "Ponto Fraco III num grupo com três Assinaturas diferentes abre um Combo Arcano quase garantido."}}], "musicas": [{"nome": "Blitzkrieg Bop", "artista": "Ramones, 1976", "tags": "Golpe · 9 m", "tier": 0, "texto": "Três notas rápidas: até 3 alvos sofrem 1d4 + Ritmo cada, sem teste.", "classico": false}, {"nome": "Born to Be Wild", "artista": "Steppenwolf, 1968", "tags": "Sustentada · 9 m", "tier": 0, "texto": "Um aliado ganha +3 m de deslocamento e recupera 1 Fôlego no início de cada turno.", "classico": false}, {"nome": "We Will Rock You", "artista": "Queen, 1977", "tags": "Sustentada · 9 m ao redor", "tier": 0, "texto": "Batida, batida, palma. Aliados na área causam +1 de dano com armas para cada 2 de Ritmo.", "classico": false}, {"nome": "I Wanna Be Sedated", "artista": "Ramones, 1978", "tags": "Golpe · 9 m", "tier": 0, "texto": "TR Mente: o alvo fica Lento e sem Reação por 1 rodada.", "classico": false}, {"nome": "Rock and Roll All Nite", "artista": "KISS, 1975", "tags": "fora de combate", "tier": 0, "texto": "Festa até de manhã: o grupo ganha um descanso curto extra hoje e +1 de Energia máxima até o próximo descanso longo.", "classico": false}, {"nome": "London Calling", "artista": "The Clash, 1979", "tags": "Golpe · 18 m", "tier": 1, "texto": "O chamado ecoa pela cidade: todos os aliados podem se mover imediatamente até 6 m sem provocar ataques, perdem Apavorado e ganham +2 em Iniciativa na próxima rodada.", "classico": false}, {"nome": "Here Comes the Sun", "artista": "The Beatles, 1969", "tags": "Golpe · 12 m", "tier": 1, "texto": "Um aliado cura 2d6 + POT + Ritmo e perde Cego e Apavorado. Toda escuridão mágica (Umbral, Onírico) a 3 m dele se desfaz.", "classico": false}, {"nome": "Paranoid", "artista": "Black Sabbath, 1970", "tags": "Golpe · 12 m", "tier": 1, "texto": "TR Mente: o alvo fica Apavorado por 1 rodada. Com Ritmo 3+, em vez de fugir ele ataca a criatura mais próxima.", "classico": false}, {"nome": "Paint It Black", "artista": "The Rolling Stones, 1966", "tags": "Golpe · área de 3 m a 12 m", "tier": 1, "texto": "Tudo vira preto: TR Reflexo ou Cego por 1 rodada. Aplica 1 Marca <b>Umbral</b>, seja qual for sua Assinatura.", "classico": false}, {"nome": "Thunderstruck", "artista": "AC/DC, 1990", "tags": "Golpe · 18 m", "tier": 1, "texto": "Ataque Arcano: 2d6 + POT + Ritmo, e o raio salta para até 2 alvos a 6 m (metade do dano). Com Ritmo 4+, salta para 3.", "classico": false}, {"nome": "Smoke on the Water", "artista": "Deep Purple, 1972", "tags": "Sustentada · 12 m", "tier": 1, "texto": "Fumaça de 6 m: ataques à distância contra quem está dentro sofrem −4. Inimigos que começarem o turno nela sofrem 1d6 + Ritmo.", "classico": false}, {"nome": "Comfortably Numb", "artista": "Pink Floyd, 1979", "tags": "Sustentada · aliado a 9 m", "tier": 1, "texto": "Anestesia: o aliado reduz em 3 + Ritmo o dano de cada golpe e não pode ficar Apavorado.", "classico": false}, {"nome": "Sweet Child O' Mine", "artista": "Guns N' Roses, 1987", "tags": "Golpe · aliado a 12 m", "tier": 1, "texto": "Barreira 6 + POT + Ritmo. Se o aliado estiver abaixo da metade da Vida, a Barreira dobra.", "classico": false}, {"nome": "Highway to Hell", "artista": "AC/DC, 1979", "tags": "Golpe · você", "tier": 1, "texto": "Dispare em linha reta por até 12 m, deixando um rastro de fogo por 2 rodadas: quem o atravessar ou começar o turno nele sofre 2d6 + Ritmo.", "classico": false}, {"nome": "November Rain", "artista": "Guns N' Roses, 1991", "tags": "Sustentada · 6 m ao redor", "tier": 1, "texto": "Chuva fria de novembro: aliados na área curam 1d6 + Ritmo no início de cada turno. Fogo e Plasma na área são apagados.", "classico": false}, {"nome": "Estranged", "artista": "Guns N' Roses, 1993", "tags": "Golpe · 12 m", "tier": 2, "texto": "Isolamento: o alvo é empurrado 6 m para longe dos aliados dele e fica <b>Afastado</b> por 2 rodadas: não recebe cura, escudos nem bônus de aliados e não pode ajudá-los (TR Mente reduz para 1 rodada).", "classico": false}, {"nome": "Another Brick in the Wall", "artista": "Pink Floyd, 1979", "tags": "Golpe · 12 m", "tier": 2, "texto": "Ergue um muro de tijolos de 6 m × 3 m (Vida 30, Blindagem 4) por 3 rodadas. Bloqueia linha de visão e passagem.", "classico": false}, {"nome": "Hotel California", "artista": "Eagles, 1976", "tags": "Sustentada · área de 6 m a 18 m", "tier": 2, "texto": "Inimigos podem entrar, mas não sair (TR Mente a cada tentativa). Dentro, sofrem 1d6 + Ritmo por turno. Aliados saem quando quiserem.", "classico": false}, {"nome": "Enter Sandman", "artista": "Metallica, 1991", "tags": "Golpe · 12 m", "tier": 2, "texto": "TR Mente. Falhou: o alvo adormece (Atordoado até sofrer dano, máx. 2 rodadas). Passou: Lento por 1 rodada.", "classico": false}, {"nome": "Gimme Shelter", "artista": "The Rolling Stones, 1969", "tags": "Golpe · 6 m ao redor", "tier": 2, "texto": "Todos os aliados na área ganham Barreira 8 + POT + Ritmo. Com Ritmo 5, a Barreira dobra.", "classico": false}, {"nome": "Another One Bites the Dust", "artista": "Queen, 1980", "tags": "Golpe · 18 m", "tier": 2, "texto": "Ataque Arcano: 3d6 + POT + Ritmo. Contra alvo abaixo de 30% da Vida, dano dobrado. Se ele cair, a música não gasta Energia e você ganha +2 Ritmo.", "classico": false}, {"nome": "Master of Puppets", "artista": "Metallica, 1986", "tags": "Golpe · 9 m", "tier": 2, "texto": "TR Mente. Falhou: no próximo turno do alvo, <b>você</b> decide a Ação de Movimento e a Ação Principal dele (ele não pode ferir a si mesmo). Chefes perdem 3 de Postura.", "classico": false}, {"nome": "God Save the Queen", "artista": "Sex Pistols, 1977", "tags": "Golpe · 18 m ao redor", "tier": 2, "texto": "Irreverência pura: todos os inimigos perdem bônus de liderança e ordens ativas. Agentes da Coroa sofrem 4d6 + POT + Ritmo (TR Mente, metade) e −2 de Postura.", "classico": false}, {"nome": "Knockin' on Heaven's Door", "artista": "Bob Dylan, 1973", "tags": "Reação · 18 m", "tier": 2, "texto": "Quando um aliado cair, ele fica com 1 de Vida, Imparável e com Barreira 5 + Ritmo até o fim do próximo turno dele.", "classico": false}, {"nome": "Shine On You Crazy Diamond", "artista": "Pink Floyd, 1975", "tags": "Sustentada (até 4 rodadas) · aliado a 12 m", "tier": 3, "texto": "A música começa lenta. Na 1ª rodada, o aliado só cura 2d6. A partir da 2ª, ele vira o <b>Diamante</b>: Imparável, +4 de Blindagem e Égide, Críticos em 18–20 e cura 2d6 + Ritmo no início de cada turno.", "classico": true}, {"nome": "Bohemian Rhapsody", "artista": "Queen, 1975", "tags": "Sustentada (3 rodadas, em ordem) · 12 m", "tier": 3, "texto": "<b>1ª — Balada:</b> aliados curam 2d6 + POT + Ritmo. <b>2ª — Ópera:</b> um coro de vozes causa 3d6 + Ritmo em todos os inimigos (TR Mente: falhou, também Apavorado). <b>3ª — Rock:</b> todos os aliados ganham uma Ação Principal extra no próximo turno.", "classico": true}, {"nome": "Stairway to Heaven", "artista": "Led Zeppelin, 1971", "tags": "Golpe · 18 m ao redor", "tier": 3, "texto": "Uma escadaria de luz: todos os aliados Caídos levantam com metade da Vida, e todos os aliados levitam por 2 rodadas (ignoram terreno, +2 Defesa contra corpo a corpo).", "classico": true}, {"nome": "Anarchy in the U.K.", "artista": "Sex Pistols, 1976", "tags": "Golpe · 18 m ao redor", "tier": 3, "texto": "Caos total: todas as Recargas inimigas aumentam em 2, todos os inimigos perdem escudos e bônus, e na próxima rodada <b>todos os jogadores agem antes</b> de qualquer inimigo.", "classico": true}], "truques": [{"nome": "Faísca", "texto": "1d4 de dano arcano (sua Assinatura) num alvo a 9 m. Sem Recarga. O \"tiro básico\" de quem está sem munição."}, {"nome": "Isqueiro de Ded
