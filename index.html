relogioInfo: 'Do fim da Gala (20/12) até a meia-noite de 31/12, o grupo tem 10 DIAS. Cada pista do Ato IV gasta dias. A ESCURIDÃO sobe 1 por dia: com Escuridão 5+, toda magia causa +1d6 mas o Tocado sofre 1d4 ao conjurar; com 8+, Fanáticos do Apagão aparecem em toda cena.',

// ----------------- ATOS -----------------
atos: [
{ n: 'I', titulo: 'O Plano Mais Idiota de Albion', data: '1 a 4 de dezembro de 1999', nivel: 1,
  resumo: 'Os jogadores se conhecem num show invadido pela Seção Zero, são escondidos por Ziggy e — achando que a ideia é deles — decidem roubar a coroa. Primeira missão: roubar a planta do palácio do Arquivo Real de Obras.',
  cenas: [
  { id: 'i1', titulo: 'Barulho no Porão', tipo: 'combate',
    leitura: 'Porão do Starman, uma da manhã. O teto é tão baixo que o vocalista bate a cabeça a cada pulo. Sessenta pessoas suadas onde cabem vinte, cheiro de cerveja derramada e cigarro de cravo. A banda no palco é ruim de um jeito maravilhoso. Então a música para — não porque acabou, mas porque todas as lâmpadas do porão estouraram ao mesmo tempo. No escuro, alguém começa a brilhar. E logo depois, a porta de aço lá em cima é arrombada. Lanternas. Botas. Uma voz no megafone: "SEÇÃO ZERO. NINGUÉM SAI."',
    mestre: 'Peça a cada jogador para descrever como o próprio poder se manifestou ao mesmo tempo, sem controle (uma luz, um som, um vulto, um tremor). Combate curto: 1 Guarda da Coroa por jogador + 1 Cão Blindado. O objetivo não é vencer: é FUGIR pela saída dos fundos (marque uma casa no canto do tabuleiro). Quem chegar na saída sai do combate. Dee Dee aparece segurando a porta com fita crepe.',
    combate: ['guarda', 'guarda', 'cao'],
    escolhas: [
     { id: 'i1a', txt: 'Voltar para tirar desconhecidos do porão antes de fugir', efe: { lacos: { ziggy: 1 } }, nota: 'Ziggy vê. "Vocês são do tipo que volta. Isso vai dar problema."' },
     { id: 'i1b', txt: 'Fugir direto e deixar o porão para trás', efe: {}, nota: 'Três jovens são presos. Um deles reaparece no Ato III como Tocado Vitrificado.' }] },
  { id: 'i2', titulo: 'Chá com Rum no Andar de Cima', tipo: 'social',
    leitura: 'O andar de cima do Starman é um museu de uma vida que acabou: discos de ouro empoeirados, uma jaqueta de lantejoulas numa moldura, fotos de um homem jovem e ruivo com uma guitarra de cristal. O homem agora está mais velho, serve chá com rum em canecas lascadas e liga uma TV pequena. Na tela, a Rainha de Vidro anuncia a Gala do Milênio. "Pela primeira vez em quarenta anos, a Coroa de Albion será exibida ao povo." Ziggy desliga a TV e sorri torto. "Quarenta anos escondida. Alguém devia pegar emprestada, né? Só pra ver a cara dela."',
    mestre: 'Esta é a cena mais importante do Ato I e parece a mais boba. Ziggy NUNCA propõe o roubo diretamente: ele joga a ideia e deixa os jogadores a "inventarem". Se ninguém morder, Dee Dee morde ("e se a gente trocasse por uma de lata?!"). Quando a ideia nascer, Ziggy ri, diz que é a coisa mais idiota que já ouviu, e oferece o porão do Starman como QG e Raulzito como motorista. Deixe os jogadores fazerem perguntas a Ziggy: ele responde com verdades parciais (perdeu a filha para a Coroa em 1989; não sabe o que é ser Tocado; "eu só odeio a Rainha, estrelinha").',
    testes: ['Percepção DT 18: um dos discos de ouro tem o nome "Os Mil Anos de Joplin" e foi arranhado com uma chave.', 'Intuição (Mente) DT 20: Ziggy olha para a TV como quem olha para um alvo, não para uma piada.'],
    escolhas: [
     { id: 'i2a', txt: 'Aceitar o dinheiro e o QG de Ziggy', efe: { lacos: { ziggy: 1 }, dinheiro: 200 }, nota: 'Cada jogador recebe £200 para o plano.' },
     { id: 'i2b', txt: 'Recusar ajuda e fazer tudo por conta própria', efe: { lacos: { ziggy: -1 } }, nota: 'Ziggy ajuda por fora mesmo assim (manda Raulzito "por acaso").' }] },
  { id: 'i3', titulo: 'O Quadro do Golpe', tipo: 'narracao',
    leitura: 'Um quadro de cortiça no porão do Starman. Barbante vermelho, fotos recortadas de jornal, um mapa do Palácio de Vidro desenhado de memória. Ziggy aponta com um palito de pirulito: "Para roubar uma coroa vocês precisam de três coisas. Um jeito de entrar. Um jeito de abrir a vitrine. E um jeito de sair vivo."',
    mestre: 'Apresente o QUADRO DO GOLPE (aparece na aba Campanha). Objetivos do Ato I–II: (1) a PLANTA do palácio — no Arquivo Real de Obras; (2) a CHAVE da vitrine — ninguém sabe ainda (a planta vai revelar); (3) a FUGA — Raulzito e a Kombi. Deixe os jogadores escolherem papéis: Rosto (fala), Sombra (entra), Técnico (abre), Músculo (segura), Coringa (improvisa). Os papéis dão +2 nos testes da função nos Atos II e III.' },
  { id: 'i4', titulo: 'Missão: O Arquivo Real de Obras', tipo: 'missao',
    leitura: 'O Arquivo Real de Obras fica num prédio cinzento de seis andares onde tudo que a Coroa já construiu tem uma planta, uma cópia e uma cópia da cópia. Às seis da tarde, a maioria dos funcionários vai embora. Às seis e um, o único que fica é o Sr. Morrissey, arquivista-chefe, que almoça um único biscoito e conversa com os gladíolos murchos da mesa dele. A planta do Palácio de Vidro está no sexto andar, na Sala Restrita. A Sala Restrita tem um guarda, um cofre e um cachorro que, de acordo com o Sr. Morrissey, "é a única criatura que me entende".',
    mestre: 'Missão aberta. Três caminhos óbvios e os que os jogadores inventarem: DISFARCE (macacões de manutenção, Persuasão DT 13 na portaria, Tecnologia DT 14 no cofre); DUTOS (Atletismo DT 14, Furtividade DT 14 por andar, uma falha = barulho); MORRISSEY (Persuasão DT 16, ou DT 12 se alguém elogiar sinceramente os poemas dele — ele tem um caderno). Cada falha sobe o ALARME (0–3). Alarme 3 = combate com 2 Guardas + 1 Segurança por jogador. A planta revela: sob a vitrine da coroa existe um nível que não aparece em nenhum outro documento: CÂMARA ASTRAL — SELADO 1959 — SEÇÃO ZERO. E uma nota: "o mostruário abre apenas com o Astrolábio de Ferro".',
    testes: ['Persuasão DT 13 (portaria, com disfarce)', 'Tecnologia DT 14 (cofre)', 'Furtividade DT 14 (dutos, por andar)', 'Investigação DT 15 (achar a nota do Astrolábio entre mil folhas)'],
    combate: ['guarda', 'guarda', 'seguranca'],
    escolhas: [
     { id: 'i4a', txt: 'Levar o Sr. Morrissey com vocês (ele viu tudo)', efe: {}, nota: 'Morrissey vira um contato dramático e leal. No Ato IV, ele sabe onde o Arquivo guarda as plantas do Domo do Milênio (+1 pista grátis).' },
     { id: 'i4b', txt: 'Convencê-lo a ficar calado', efe: {}, nota: 'Teste de Persuasão DT 15. Se falhar, a Seção Zero recebe descrições dos jogadores: Siouxsie começa o Ato II com uma pista sobre eles.' },
     { id: 'i4c', txt: 'Trancá-lo no arquivo e sumir', efe: {}, nota: 'Ele não conta nada à polícia. Mas escreve um poema sobre isso, que vira hit de rádio pirata.' }] },
  { id: 'i5', titulo: 'Fim do Ato I: O Astrolábio', tipo: 'narracao',
    leitura: 'De volta ao Starman, a planta aberta sobre a mesa de sinuca. Ziggy lê a nota sobre o Astrolábio e fica em silêncio tempo demais. Depois abre um jornal: "LEILÃO DO MILÊNIO — Hotel Ultravox, 10 de dezembro. Lote 22: Astrolábio de Ferro, origem desconhecida, século X." Ele bate na mesa e ri. "O universo gosta de vocês, estrelinhas."',
    mestre: 'Coincidência? Não. Ziggy sabia do leilão havia meses (ele mesmo descobriu onde o Astrolábio estava e vazou a informação para Madame Faithless). Sobem para o nível 2.' }] },

{ n: 'II', titulo: 'Lote 22', data: '10 de dezembro de 1999', nivel: 2,
  resumo: 'Um leilão do mercado negro num hotel de luxo. Disfarces, lances blefados, um ladrão argentino rival e uma inspetora infiltrada. O Astrolábio de Ferro reage ao toque de um Tocado — e todo mundo vê.',
  cenas: [
  { id: 'ii1', titulo: 'Ensaio Geral', tipo: 'social',
    leitura: 'O Hotel Ultravox é o tipo de lugar em que a fruta da recepção é mais cara que o aluguel de vocês. Para entrar no leilão de Madame Marianne Faithless, é preciso um convite em papel com borda dourada e um nome que valha alguma coisa. Raulzito tem um primo que faz convites. Ziggy tem um terno que "talvez sirva". Dee Dee tem fita crepe.',
    mestre: 'Preparação. Cada jogador escolhe COMO entra: como comprador (roupa de gala, identidade falsa — Persuasão DT 14 na porta, ou £300 para o primo de Raulzito fazer um convite perfeito), como funcionário (uniforme de garçom ou macacão — Furtividade DT 12 na cozinha) ou por fora (telhado de vidro, Atletismo DT 15). Use o botão DAR ITEM do Mestre para entregar as roupas. Defina um orçamento de lances: Ziggy entrega £5.000 "do fundo da aposentadoria" ao grupo.' },
  { id: 'ii2', titulo: 'O Leilão', tipo: 'social',
    leitura: 'O salão de baile tem um lustre do tamanho de um carro e cem pessoas que fingem não se conhecer. Madame Faithless sobe ao púlpito com o monóculo brilhando. "Senhoras, senhores e criaturas da noite. Esta noite vendemos o que o mundo esqueceu que existia." Lote 7: a guitarra queimada de um astro que morreu em 1970. Lote 13: uma carta de tarô pintada em 1600, "A Torre", com uma rachadura no meio. Lote 19: uma fita demo de 1989 que, dizem, enlouquece quem ouve. E então: "Lote 22. O Astrolábio de Ferro. Século X. Lance inicial: mil libras."',
    mestre: 'MINIGAME DO LEILÃO (3 rodadas). Em cada rodada, cada jogador escolhe UMA jogada: LANCE (soma o dinheiro; Gus cobre com +£800 por rodada), BLEFE (Persuasão DT 15: um rival desiste), SABOTAGEM (Furtividade ou Tecnologia DT 15: atrapalhar Gus — derrubar champanhe, trocar o crachá, cortar o microfone), OBSERVAR (Percepção DT 15: descobrir algo — veja abaixo). O grupo vence o leilão se, ao fim da 3ª rodada, o lance deles for maior que o de Gus (Gus começa com £2.000 e sobe £800 por rodada; cada sabotagem bem-sucedida tira £800 dele; cada blefe tira £500). OBSERVAR pode revelar: (a) a garçonete de luvas é a Inspetora Siouxsie Marr; (b) Gus recebe um bilhete de alguém de fora — a letra é de Ziggy (só um jogador que conhece a letra de Ziggy percebe, DT 18); (c) a mulher de véu na última fileira é uma emissária da Rainha.',
    testes: ['Persuasão DT 15 (blefe)', 'Furtividade/Tecnologia DT 15 (sabotagem)', 'Percepção DT 15 (observar)', 'Percepção DT 18 (a letra de Ziggy)'],
    escolhas: [
     { id: 'ii2a', txt: 'Vencer o leilão de forma limpa', efe: { lacos: { gus: 1 } }, nota: 'Gus aplaude de pé. "Bravo, queridos. Da próxima vez, não vou ser tão educado."' },
     { id: 'ii2b', txt: 'Vencer com sabotagem descarada', efe: { lacos: { gus: -1 } }, nota: 'Gus sabe exatamente quem foi. Ele não esquece.' },
     { id: 'ii2c', txt: 'Perder o leilão e planejar o roubo do lote', efe: {}, nota: 'Vá para "O Toque" mesmo assim: os jogadores precisam chegar perto do Astrolábio para roubá-lo.' }] },
  { id: 'ii3', titulo: 'O Toque', tipo: 'combate',
    leitura: 'Quando a mão de um de vocês encosta no Astrolábio, o ferro esquenta. Os anéis de metal giram sozinhos, cada vez mais rápido, e projetam no teto do salão um céu inteiro de estrelas — estrelas no lugar errado, formando desenhos que nenhum de vocês conhece e que todos vocês reconhecem. Cem pessoas olham para cima. A garçonete de luvas larga a bandeja e saca um distintivo. "Seção Zero. Ninguém sai." De novo.',
    mestre: 'Combate e fuga. Siouxsie + 1 Agente da Seção Zero por 2 jogadores + Seguranças do Hotel. Gus aproveita o caos: na segunda rodada, ele tenta roubar o Astrolábio de quem estiver segurando (Reflexo DT 15 para segurar). Cenário vertical: salão, cozinha, poço do elevador, telhado de vidro. A luta final é no TELHADO DE VIDRO: Gus Cerati, elegante, sob a lua. Se o grupo estiver muito ferido, Raulzito aparece com a Kombi embaixo do prédio e alguém precisa pular.',
    combate: ['siouxsie', 'agente', 'seguranca', 'seguranca'],
    escolhas: [
     { id: 'ii3a', txt: 'Siouxsie escorrega no telhado: salvá-la', efe: { lacos: { siouxsie: 2 } }, nota: 'Ela não agradece. Mas no relatório escreve "suspeitos não identificados".' },
     { id: 'ii3b', txt: 'Deixá-la cair (ela sobrevive, com o braço quebrado)', efe: { lacos: { siouxsie: -2 } }, nota: 'A partir de agora é pessoal.' },
     { id: 'ii3c', txt: 'Propor sociedade a Gus no telhado', efe: { lacos: { gus: 1 } }, nota: 'Persuasão DT 16. Se aceitar, Gus some com uma piscadela e reaparece na Gala como "garçom".' }] },
  { id: 'ii4', titulo: 'A Fita Escondida', tipo: 'investigacao',
    leitura: 'No banco de trás da Kombi, o Astrolábio esfria aos poucos. Um dos anéis está solto. Dentro dele, enrolada como um pergaminho, uma fita cassete antiga. Na etiqueta, escrito à mão com caneta rosa: "JO, 1989 — NÃO APAGAR".',
    mestre: 'A fita contém Jo cantando, acompanhada de uma guitarra (Ziggy), numa gravação caseira. No fim, ela diz: "Pai, a voz voltou. Ela diz que me conhece." Se os jogadores mostrarem a fita a Ziggy, ele chora e mente ("uma fã antiga"). Investigação DT 16 ou mostrar a Madame Faithless (que cobra um favor): a voz é a de Jo Lennox, filha de Ziggy, desaparecida em 1989. GUARDE ESTA FITA: ela é a chave da redenção de Ziggy no Ato V. Sobem para o nível 3.',
    escolhas: [
     { id: 'ii4a', txt: 'Mostrar a fita a Ziggy', efe: { lacos: { ziggy: 1 } }, nota: 'Ele chora. Mente. Mas guarda o momento.' },
     { id: 'ii4b', txt: 'Esconder a fita e investigar sozinhos', efe: {}, nota: 'Ninguém sabe que eles sabem. Vantagem no Ato III.' }] }] },

{ n: 'III', titulo: 'A Gala do Milênio', data: '20 de dezembro de 1999', nivel: 3,
  resumo: 'O golpe. Cinco fases, ao vivo na TV. No ápice, com a coroa nas mãos, o céu escurece no mundo inteiro. Ziggy revela quem é, leva a coroa e a filha. Começa a contagem regressiva.',
  cenas: [
  { id: 'iii1', titulo: 'Fase 1 — Entrada', tipo: 'missao',
    leitura: 'O Palácio de Vidro de noite parece uma joia acesa no meio da cidade. Holofotes, carros pretos, câmeras da TV Real em cada canto. Lá dentro, mil convidados, uma orquestra, uma banda de rock contratada para "modernizar a imagem da Coroa" e, no centro do salão principal, sobre um pedestal de cristal dentro de uma redoma: a Coroa. Faltam 40 minutos para a Rainha subir ao palco e colocá-la na cabeça ao vivo.',
    mestre: 'O GOLPE EM 5 FASES. Cada fase pede um teste principal (o jogador com o papel certo ganha +2). Falhas não encerram o golpe: sobem a TENSÃO (0–5). Tensão 3: uma patrulha extra. Tensão 5: o alarme toca e a fuga vira combate imediato. ENTRADA: convites (Persuasão DT 15), como a banda contratada (Performance DT 15 — o Virtuoso brilha aqui), como funcionários (Furtividade DT 14) ou pelo telhado (Atletismo DT 16).' },
  { id: 'iii2', titulo: 'Fase 2 — A Distração', tipo: 'missao',
    leitura: 'A banda da Gala sobe ao palco. Mil cabeças se viram. É o momento.',
    mestre: 'Alguém precisa prender a atenção do salão por 3 minutos: um show (Performance DT 16), um escândalo (Persuasão/Intimidação DT 16), um apagão (Tecnologia DT 16), uma cena de amor falsa (Persuasão DT 14 em dupla). Gus, se for aliado, oferece uma distração "à moda portenha": um tango que derruba a torre de champanhe.' },
  { id: 'iii3', titulo: 'Fase 3 — A Redoma', tipo: 'missao',
    leitura: 'O Astrolábio encaixa no pedestal com um clique que parece um coração. Os anéis giram. A redoma de cristal sobe devagar. E o pedestal começa a descer — não para o porão, para baixo do porão, para baixo de tudo.',
    mestre: 'Teste em equipe: Ocultismo DT 15 (quem segura o Astrolábio) + qualquer apoio. Quem estiver no pedestal desce com ele. Os outros podem pular atrás (Atletismo DT 12) ou ficar segurando o salão. É AQUI que os jogadores descobrem que a coroa não fica no pedestal: ela desce para a Câmara Astral.' },
  { id: 'iii4', titulo: 'Fase 4 — A Câmara Astral', tipo: 'narracao',
    leitura: 'Uma sala redonda de pedra antiga, mais velha que o palácio, mais velha que a cidade. O teto é um céu de verdade — estrelas vivas, girando devagar. No centro, um sarcófago de vidro transparente. Dentro dele, flutuando como se estivesse debaixo d’água, uma menina de uns quinze anos, de jaqueta jeans com bottons de 1989. A coroa está presa sobre o sarcófago por fios de luz que entram no peito da menina. Em volta, nas paredes, onze nichos com onze outras figuras de vidro. Todas jovens. Todas com a mesma expressão: a de quem ouviu uma voz.',
    mestre: 'Pausa dramática. Deixe os jogadores reagirem. Quem tiver ouvido a fita reconhece a jaqueta de Jo (ela usava a mesma na foto do disco de ouro). Quem for Tocado de Astraea (Estrela) ouve a voz MAIS ALTO aqui: "Me tirem daqui." Pegar a coroa exige cortar os fios de luz: Ocultismo DT 16 ou simplesmente puxar (o fio arrebenta, Jo grita no vidro). Os jogadores PODEM desistir aqui. Se desistirem, Ziggy pega a coroa ele mesmo (ver Fase 5).' },
  { id: 'iii5', titulo: 'Fase 5 — A Virada', tipo: 'narracao',
    leitura: 'A coroa sai. E o mundo inteiro escurece. Não a sala: o mundo. No salão lá em cima, a transmissão ao vivo mostra mil pessoas olhando pela parede de vidro enquanto as estrelas começam a se mover no céu de Albion — e de Tóquio, e de Buenos Aires, e de Lagos, e de São Paulo. Elas se rearranjam, devagar, formando um numeral romano gigante sobre a cidade: XI. Atrás de vocês, alguém aplaude devagar. Ziggy Lennox desce a escada da Câmara de jaqueta de lantejoulas, com uma guitarra de cristal nas costas. "Perfeitos. Vocês foram perfeitos, estrelinhas." Ele encosta a mão no sarcófago e o vidro se desfaz como açúcar. A menina cai nos braços dele, tossindo vidro. "Oi, Jo. O pai chegou."',
    mestre: 'A REVELAÇÃO. Ziggy é Tocado de Astraea (o vidro obedece a ele). Ele pede a coroa com educação — "por favor, estrelinha, eu não quero machucar ninguém". Se os jogadores recusarem: combate rápido em que Ziggy NÃO pode ser vencido (ele foge com Jo após 3 rodadas, levando a coroa com Space Oddity — se um jogador estiver segurando a coroa, Ziggy usa Queda da Estrela e a toma). Se o grupo for MUITO bem, deixe-os ficar com UM DOS DOIS: Jo ou a coroa. Ficar com Jo muda o Ato IV (ela vira aliada direta; Ziggy tem a coroa mas não tem a voz — e precisa recuperá-la). Ficar com a coroa: Ziggy tem Jo e precisa da coroa. Em qualquer caso: a Rainha desce a escada, rachando. "Vocês não fazem ideia do que fizeram." O palácio começa a trincar. FUGA: Siouxsie bloqueia a saída de serviço (combate se Laço ≤ 0; se ≥ 1, ela abre a porta e diz "corram, antes que eu mude de ideia").',
    combate: ['ziggy'],
    escolhas: [
     { id: 'iii5a', txt: 'Lutar para ficar com Jo', efe: { lacos: { jo: 2, ziggy: -1 } }, nota: 'Jo sai com os jogadores. Ziggy tem a coroa.' },
     { id: 'iii5b', txt: 'Lutar para ficar com a coroa', efe: { lacos: { ziggy: -2 }, marcos: ['coroa'] }, nota: 'Os jogadores têm a coroa (o fragmento da Estrela). Ziggy tem Jo. Ele vai vir buscá-la.' },
     { id: 'iii5c', txt: 'Deixar Ziggy ir', efe: { lacos: { ziggy: 1, jo: -1 } }, nota: 'Ziggy leva tudo. Os jogadores ficam com a culpa e o céu escuro.' },
     { id: 'iii5d', txt: 'Libertar os outros onze vitrificados', efe: { lacos: { rainha: -1 } }, nota: 'Ocultismo DT 18 por figura — ou 1 por rodada de fuga. Cada um libertado vira um aliado no Ato V (uma voz a mais no Coro dos jogadores).' }] }] },

{ n: 'IV', titulo: 'Contagem Regressiva', data: '21 a 30 de dezembro de 1999', nivel: 4,
  resumo: 'Dez dias. O céu escurece um pouco mais a cada noite e conta para trás em numerais romanos. O mundo entra em pânico. Os jogadores precisam descobrir onde, como e por quê — e escolher que pistas seguir antes que o tempo acabe.',
  cenas: [
  { id: 'iv0', titulo: 'O Céu Conta para Trás', tipo: 'narracao',
    leitura: 'Na manhã de 21 de dezembro, o sol nasce fraco, como uma lâmpada com mau contato. Às dez da manhã já parece fim de tarde. Nos rádios: o primeiro-ministro pede calma, a Igreja do Último Dia pede arrependimento, a rádio pirata toca "It’s the End of the World as We Know It" em loop. No céu, o numeral muda à meia-noite: X. Vocês são procurados. As fotos de vocês, borradas, tiradas pela TV Real, estão na primeira página de todos os jornais: OS LADRÕES DO FIM DO MUNDO.',
    mestre: 'O QUADRO DE PISTAS. Há 5 pistas. Cada uma gasta dias (veja o custo). O grupo tem 10 dias, e nenhuma pista pode ser repetida. Eles NÃO conseguem fazer todas: precisam escolher. Para chegar ao Ato V com chance real, precisam saber pelo menos ONDE (Observatório ou Morrissey/Arquivo) e idealmente COMO e POR QUÊ. Marque cada dia gasto no Relógio da aba Campanha. A Escuridão sobe sozinha. Siouxsie caça o grupo: a cada pista, role 1d6 — com 1–2, a Seção Zero chega no meio da cena.' },
  { id: 'iv1', titulo: 'Pista: O Observatório do Meridiano', tipo: 'missao', dias: 2, revela: 'ONDE',
    leitura: 'O observatório fica no alto de um morro, uma cúpula verde de cobre rachada. Lá dentro, cercado de pilhas de papel com cálculos, um homem de casaco militar soviético desenha estrelas no chão com giz. "Elas não estão se movendo ao acaso", diz Viktor Kino sem se virar. "Estão convergindo. Para um ponto. Aqui. Nesta cidade." Lá fora, tochas sobem o morro. Gente comum, cantando. Os Fanáticos do Apagão acham que Viktor está "atrapalhando o fim".',
    mestre: 'Combate: 2 Fanáticos por jogador + 1 Agente. Depois, Viktor revela (com Investigação DT 14 ajudando nos cálculos): o centro do Campo das Constelações — o ponto exato para onde as estrelas convergem — fica sob o DOMO DO MILÊNIO. A Coroa construiu o Domo em cima do Campo. Ou alguém dentro da Coroa construiu. Viktor pode vir junto (Laço não conta, mas ele ajuda no Ato V: +2 em qualquer teste de navegação no Domo).',
    combate: ['cultista', 'cultista', 'cultista', 'agente'] },
  { id: 'iv2', titulo: 'Pista: A Linha Morta', tipo: 'missao', dias: 3, revela: 'COMO',
    leitura: 'A entrada da Linha Morta é uma grade enferrujada atrás de uma lavanderia. Lá embaixo, os túneis cheiram a ferro e a terra molhada. Placas de 1888. Lâmpadas a gás que se acendem sozinhas quando vocês passam. E, ao longe, o som de um trem que não deveria existir.',
    mestre: 'Masmorra em 3 estações: (1) ESTAÇÃO SANTA BÁRBARA — desabamento, teste de Atletismo DT 15 ou 2d6; (2) ESTAÇÃO DOS OSSOS — o COLOSSO DA LINHA MORTA (chefe); (3) ESTAÇÃO ZERO — uma estação que não está em nenhum mapa, com murais de pedra do ano 999 mostrando o Primeiro Pedido: um homem rico no centro de um círculo, um pedaço de estrela na mão, e vinte e duas figuras cantando em volta. Revela o COMO: o Pedido precisa do fragmento no centro do Círculo à meia-noite e de vozes de Tocados cantando. Quanto mais vozes, mais forte o Pedido. O coração do Colosso é o NÚCLEO DA TORRE — um fragmento de Golgoth. Com ele, os jogadores também podem fazer um Pedido.',
    combate: ['colosso'],
    escolhas: [
     { id: 'iv2a', txt: 'Levar o Núcleo da Torre', efe: { marcos: ['nucleo'] }, nota: 'Os jogadores agora têm um fragmento. Quem carregar: +2 de dano e ouve um rangido de pedra em vez da voz.' },
     { id: 'iv2b', txt: 'Destruir o Núcleo ali mesmo', efe: { marcos: ['nucleoDestruido'] }, nota: '+2 no Julgamento final. O túnel desaba atrás deles.' }] },
  { id: 'iv3', titulo: 'Pista: A Igreja do Último Dia', tipo: 'social', dias: 2, revela: 'A VOZ',
    leitura: 'A Igreja do Último Dia está cheia pela primeira vez em quarenta anos. Gente ajoelhada no corredor, gente chorando nos degraus. No púlpito, uma freira de botas e alfinetes no hábito prega com a calma de quem sempre soube. Quando vê vocês, para no meio da frase. "Finalmente. A sacristia. Agora."',
    mestre: 'Irmã Patti mostra o DIÁRIO DO HOMEM RICO (999). Leitura em voz alta da última página: "A voz da Estrela me pediu para voltar. Eu disse não, e ela chorou como uma criança. Prendi o coração dela na coroa para que ninguém mais a ouvisse. Mas ela canta. Ela canta para os que nascem tocados. O próximo dirá não?" Revela A VOZ: o que os Tocados escutam é Astraea. Quem fizer o Pedido com o fragmento da Estrela precisa vencer o JULGAMENTO ou a deusa renasce. Patti também ensina a ORAÇÃO DO SILÊNCIO: no Ato V, cada Tocado que a conhece ganha +1 no Julgamento.',
    escolhas: [
     { id: 'iv3a', txt: 'Aprender a Oração do Silêncio', efe: { marcos: ['oracao'] }, nota: '+1 no Julgamento para cada jogador.' }] },
  { id: 'iv4', titulo: 'Pista: O Palácio Rachado', tipo: 'social', dias: 2, revela: 'O LACRE',
    leitura: 'O Palácio de Vidro está rachado de cima a baixo, como um para-brisa depois de uma pedrada. Metade da guarda desertou. Vocês entram por uma janela quebrada e encontram a Rainha sozinha, sentada no chão da sala do trono, tirando as luvas devagar. Os dedos dela são inteiramente de vidro. "Vieram me matar ou me roubar de novo?"',
    mestre: 'A Rainha conta TUDO (a verdade do lacre, a vitrificação, os doze nomes que ela lembra de cor, o plano de Ziggy). Ela propõe um acordo: tragam a coroa de volta e ela recoloca o lacre na meia-noite — com Jo ou outro Tocado dentro ("é o preço; sempre foi"). Os jogadores podem aceitar, recusar, ou propor outra coisa (O Círculo Quebrado — se alguém sugerir destruir os fragmentos, ela fica em silêncio e depois diz: "ninguém nunca tentou"). Se atacarem, é combate contra a Rainha (chefe).',
    combate: ['rainha', 'guarda', 'guarda'],
    escolhas: [
     { id: 'iv4a', txt: 'Aceitar o acordo da Rainha', efe: { lacos: { rainha: 2 }, marcos: ['acordoRainha'] }, nota: 'Abre o final A Coroa Eterna. Ela dá ao grupo o Terno da Seção Zero (credenciais).' },
     { id: 'iv4b', txt: 'Propor quebrar o ciclo para sempre', efe: { lacos: { rainha: 1 }, marcos: ['ideiaCirculo'] }, nota: 'Abre o final secreto O Círculo Quebrado. Ela vai ao Domo, sem coroa.' },
     { id: 'iv4c', txt: 'Lutar contra a Rainha', efe: { lacos: { rainha: -3 } }, nota: 'Se ela cair, o palácio desaba. Sem ela, A Coroa Eterna se torna impossível.' }] },
  { id: 'iv5', titulo: 'Pista: O Rastro de Ziggy', tipo: 'investigacao', dias: 2, revela: 'POR QUÊ',

function rollExpr(expr, ctx = {}, crit = false) {
  if (expr === 'TUDO') return { total: 9999, dice: [], txt: 'tudo' };
  const { e, mult } = exprSub(expr, ctx);
  const dice = []; let total = 0; const parts = [];
  e.replace(/\s/g, '').split(/(?=[+-])/).forEach((tok) => {
    const sg = tok[0] === '-' ? -1 : 1; const t = tok.replace(/^[+-]/, '');

      parts.push((sg < 0 ? '−' : '') + n + 'd' + f);
    } else if (t !== '') { total += sg * (+t || 0); if (+t) parts.push((sg < 0 ? '−' : '+') + t); }
  });

}

combate() { return `<h2 class="hq">Combate</h2>

function processaFx() {

    if (f.tipo === 'dano') { Board.treme(f.alvo); Board.flutua(f.alvo, '−' + f.v + (f.abs ? ` (🛡${f.abs})` : ''), (f.tipoDano === 'M' ? 'mag' : '') + (f.v >= 15 ? ' grande' : '')); if (f.notas && f.notas.length) setTimeout(() => Board.flutua(f.alvo, f.notas.join(' '), 'cond'), 300); }

    else if (f.tipo === 'esc') Board.flutua(f.alvo, '🛡+' + f.v, 'esc');

  novos.forEach((f) => {

      const meu = UI.pendLance && ch && ch.owner === meuPid() && f.lanc ? UI.pendLance : null; if (meu) UI.pendLance = null;
      Bandeja.tocar(f, meu);

    else if (f.tipo === 'vez') { const ch = meuChar(); if (ch && ch.id === f.alvo) { SFX.vez(); banner('SUA VEZ!', '#ffe81a', true); } if (ME.papel === 'unica' && CFG.autoAssento && G.chars[f.alvo]) { ME.assento = G.chars[f.alvo].owner; setTimeout(render, 50); } if (ME.papel === 'unica' && CFG.autoAssento && G.inis[f.alvo]) { ME.assento = 'mestre'; UI.selIni = f.alvo; setTimeout(render, 50); } if (souMestre() && G.inis[f.alvo]) { UI.selIni = f.alvo; UI.abaDoca = 'combate'; } }
    else if (f.tipo === 'tele') SFX.alerta();
    else if (!temDados) tocaTab(f);

}

  charRem(d) { if (confirm('Remover este personagem da mesa?')) despacha({ type: 'charRem', id: d.id }); },
  novoAssento() { ME.assento = 'mestre'; UI.criacao = novaCriacao(); UI.tela = 'criacao'; render(); },
  // ----- mestre: mesa -----
  loja(d) { despacha({ type: 'loja', loja: d.k, aberta: !G.lojas[d.k] }); },
  narrar() { const t = document.getElementById('cenaTit').value, x = document.getElementById('cenaTxt').value; if (!x.trim()) return toast('Escreva o texto da cena.', 'erro'); despacha({ type: 'cena', titulo: t, texto: x }); },
  cenaFechar() { despacha({ type: 'cenaFechar' }); },
  descanso(d) { despacha({ type: 'descanso', longo: !!d.l }); },
  pintar(d) { UI.pintar = d.t || null; render(); }, tileLimpa() { despacha({ type: 'tileLimpa' }); },
  togMorte() { despacha({ type: 'cfg', cfg: { morte: !G.cfg.morte } }); },
  exportarMesa() { const b = new Blob([JSON.stringify(G)], { type: 'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'arcanos1999_mesa_' + new Date().toISOString().slice(0, 10) + '.json'; a.click(); },
  limparLog() { despacha({ type: 'limparLog' }); },
  derrotaVoltar() { despacha({ type: 'derrotaVoltar' }); }, derrotaContinuar() { despacha({ type: 'derrotaContinuar' }); },
  derrotaFim() { const t = prompt('Um epitáfio para o grupo (opcional):', 'Eles tentaram.'); despacha({ type: 'derrotaFim', txt: t || '' }); },
  // ----- campanha -----
  campSub(d) { UI.campSub = d.k; render(); }, campAto(d) { UI.campAto = +d.i; render(); }, campSetAto(d) { despacha({ type: 'camp', ato: +d.i }); },
  campNarrar(d) { const c = CAMPANHA.atos.flatMap((a) => a.cenas).find((x) => x.id === d.c); despacha({ type: 'cena', titulo: c.titulo, texto: c.leitura }); },
  campNarrarFinal(d) { const f = CAMPANHA.finais.find((x) => x.id === d.id); despacha({ type: 'cena', titulo: f.nome, texto: f.txt }); },
  campCombate(d) { const c = CAMPANHA.atos.flatMap((a) => a.cenas).find((x) => x.id === d.c); const n = Math.max(1, Object.keys(G.chars).length); const lista = []; c.combate.forEach((b) => { lista.push(b); }); if (n >= 4) c.combate.filter((b) => inimigoBase(b).tipo === 'tropa').forEach((b) => lista.push(b)); lista.forEach((b) => despacha({ type: 'inimigoAdd', base: b })); UI.abaDoca = 'combate'; toast('Inimigos no tabuleiro. Posicione e inicie o combate.', 'bom'); render(); },
  campEscolha(d) { const c = CAMPANHA.atos.flatMap((a) => a.cenas).find((x) => x.id === d.c); const e = c.escolhas.find((x) => x.id === d.e); despacha({ type: 'camp', escolha: { cena: c.id, id: e.id, efe: e.efe } }); toast('Escolha aplicada: ' + e.txt, 'bom'); },
  campFeita(d) { despacha({ type: 'camp', cenaFeita: d.c }); },
  campLaco(d) { despacha({ type: 'camp', lacos: { [d.k]: +d.v - G.camp.lacos[d.k] } }); },
  campDias(d) { despacha({ type: 'camp', dias: +d.v }); }, campMin(d) { despacha({ type: 'camp', minutos: G.camp.minutos + +d.d }); },
  campMarco(d) { despacha(G.camp.marcos.includes(d.m) ? { type: 'camp', marcoRem: d.m } : { type: 'camp', marco: d.m }); },
};
const CHG = {
  importarMesa(el) { const f = el.files[0]; if (!f) return; f.text().then((t) => { try { const g = JSON.parse(t); if (!g.chars) throw 0; localStorage.setItem('a99v2_mesa', t); toast('Mesa importada!', 'bom'); if (UI.tela === 'mesa') { G = g; depois(); } } catch (e) { toast('Arquivo inválido.', 'erro'); } }); },
  trocaAssento(el) { if (el.value === '+') { ACT.novoAssento(); return; } ME.assento = el.value; UI.acao = null; UI.mAlvo = null; render(); },
  darSel(el) { UI.darSel[el.dataset.k] = el.type === 'checkbox' ? el.checked : el.value; if (el.dataset.k === 't') UI.darSel.v = ''; render(); },
  iniCond(el) { if (el.value) despacha({ type: 'inimigoEdit', id: el.dataset.id, cond: { nome: el.value, d: 2 } }); },
  pcCond(el) { if (el.value) despacha({ type: 'charEdit', id: el.dataset.id, cond: { nome: el.value, d: el.value === 'Caído' ? 99 : 2, v: el.value === 'Regenerando' ? 2 : 0 } }); },
  tema(el) { despacha({ type: 'tema', tema: el.value }); },
  tamTab(el) { despacha({ type: 'tema', tema: G.board.tema, w: el.dataset.k === 'w' ? +el.value : G.board.w, h: el.dataset.k === 'h' ? +el.value : G.board.h }); },
  campNotas(el) { despacha({ type: 'camp', notas: el.value }); },
};
document.addEventListener('click', (e) => { const b = e.target.closest('[data-act]'); if (!b || b.disabled) return; const f = ACT[b.dataset.act]; if (f) { e.preventDefault(); f(b.dataset, e, b); } });
document.addEventListener('change', (e) => { const el = e.target.closest('[data-act-change]'); if (el && CHG[el.dataset.actChange]) CHG[el.dataset.actChange](el); });
document.addEventListener('input', (e) => { const el = e.target; if (el.dataset && el.dataset.campo && UI.criacao) { UI.criacao[el.dataset.campo] = el.value; const pe = document.querySelector('.criacao-pe'); if (pe && UI.criacao.passo === 6) { const ok = passoOk(UI.criacao, 6); pe.querySelector('[data-act="criaFinalizar"]').disabled = ok !== true; pe.querySelector('.mini').textContent = ok === true ? '' : ok; } } });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { if (Bandeja.ocupada()) { Bandeja.cancelarLance(); } if (UI.acao || UI.mAlvo) { UI.acao = null; UI.mAlvo = null; render(); } document.querySelectorAll('.modal').forEach((m) => m.remove()); } if (e.key === 'Enter' && e.target.dataset && e.target.dataset.enter) { ACT[e.target.dataset.enter](); } });

// ---------------- ENTRAR NA MESA ----------------
function salvaMeuChar() { const ch = meuChar(); if (!ch) return; const s = JSON.parse(localStorage.getItem('a99v2_salvos') || '[]').filter((x) => x.nome !== ch.nome); const cp = JSON.parse(JSON.stringify(ch)); delete cp.owner; s.unshift(cp); localStorage.setItem('a99v2_salvos', JSON.stringify(s.slice(0, 8))); }
function enviarPersonagem(ch, trazido) {
  if (ME.papel === 'unica') { const owner = 'local_' + Math.random().toString(36).slice(2, 6); const e = reduce(G, 'mestre', { type: 'novoPersonagem', ch, owner, mesa: 1 }); if (e) return toast(e, 'erro'); ME.assento = owner; entrarMesa(); return; }
  Net.enviar({ type: 'novoPersonagem', ch }); UI.tela = 'mesa'; toast('Entrando na mesa…');
}
function entrarMesa() {
  UI.tela = 'mesa'; if (ME.papel === 'unica') { try { localStorage.setItem('a99v2_unica', JSON.stringify(G)); } catch (e) {} }
  UI.ultimoFx = Math.max(0, ...(G.fx || []).map((f) => f.id)); render();
  setTimeout(() => { Board.ajusta(); if (souMestre() ? !CFG.tutoMestre : !CFG.tutoJog) tutorial(); }, 400);
}
function abrirSala() {
  ME.papel = 'mestre'; const code = Net.codigo(); ME.sala = code; G.sala = code;
  const tenta = (c) => Net.hospedar(c, { ok: (cc) => { ME.sala = cc; G.sala = cc; entrarMesa(); toast('Mesa aberta! Código: ' + cc, 'bom'); }, erro: (e) => { toast(e, 'erro'); if (/uso/.test(e)) tenta(Net.codigo()); }, recebe: recebeDoJogador, info: () => Net.transmitir(G) });
  tenta(code);
  setInterval(() => { if (G && tick(G)) depois(); }, 300);
}
// tick da mesa única também
setInterval(() => { if (ME.papel === 'unica' && G && tick(G)) { try { localStorage.setItem('a99v2_unica', JSON.stringify(G)); } catch (e) {} render(); processaFx(); } }, 300);
// salvar mesa única a cada mudança
const _depois = depois; depois = function () { if (ME.papel === 'unica') { try { localStorage.setItem('a99v2_unica', JSON.stringify(G)); } catch (e) {} } _depois(); };
// sincroniza fim de turno visual (contagem) sem esperar rede
setInterval(() => { if (UI.tela === 'mesa' && G && G.combate.ativo && G.combate.turno && G.combate.turno.autoFim) { const el = document.querySelector('.hud-turno .mini'); if (el) { const s = Math.max(0, Math.ceil((G.combate.turno.autoFim - Date.now()) / 1000)); el.textContent = `o turno acaba sozinho em ${s}s…`; } } }, 500);
addEventListener('resize', () => { if (UI.tuto) posTuto(); });

// ---------------- INÍCIO ----------------
aplicaCfg(); ceu();
if (new URLSearchParams(location.search).get('sala')) UI.tela = 'jogador';
render();
</script>
