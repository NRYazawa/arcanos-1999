/* ============================================================
   ARCANOS: 1999 — visual QUADRINHO PUNK
   ============================================================ */
:root{
  --tinta:#0d0b12; --tinta2:#1a1622; --papel:#f6efdc; --papel2:#ece2c6; --papel3:#fffaf0;
  --rosa:#ff2d95; --ciano:#18e0ff; --amarelo:#ffe81a; --verm:#ff3b30; --roxo:#8b5cff; --verde:#3dff8a; --laranja:#ff8a1f;
  --sombra:6px 6px 0 var(--tinta); --sombra-s:3px 3px 0 var(--tinta); --borda:3px solid var(--tinta);
  --t-titulo:'Bangers',Impact,'Arial Black',sans-serif; --t-cab:'Anton','Arial Narrow',Impact,sans-serif; --t-ui:'Barlow Condensed','Arial Narrow',sans-serif;
  --t-corpo:'Atkinson Hyperlegible',Verdana,system-ui,sans-serif; --t-mao:'Permanent Marker','Comic Sans MS',cursive; --t-maq:'Special Elite','Courier New',monospace; --t-mono:'Rubik Mono One',monospace;
  --esc:1; --hud-h:178px;
}
*{box-sizing:border-box}
html{font-size:calc(17px * var(--esc))}
html,body{margin:0;height:100%;background:var(--tinta);color:var(--papel);font-family:var(--t-corpo);line-height:1.45;-webkit-tap-highlight-color:transparent}
body{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;font-size:1rem;color:var(--tinta);background:var(--papel3);border:var(--borda);border-radius:4px;padding:8px 10px;width:100%}
textarea{min-height:90px;resize:vertical}
a{color:var(--ciano)}
::-webkit-scrollbar{width:12px;height:12px} ::-webkit-scrollbar-thumb{background:var(--rosa);border:3px solid var(--tinta);border-radius:6px} ::-webkit-scrollbar-track{background:var(--tinta2)}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#ceu{position:fixed;inset:0;z-index:-1}
.reticula{background-image:radial-gradient(rgba(0,0,0,.22) 1.2px,transparent 1.6px);background-size:7px 7px}
.reticula-clara{background-image:radial-gradient(rgba(255,255,255,.08) 1.2px,transparent 1.6px);background-size:7px 7px}

/* ---------- tipografia de quadrinho ---------- */
.hq{font-family:var(--t-titulo);letter-spacing:.04em;text-transform:uppercase;line-height:1}
.desalinhado{text-shadow:-3px 0 var(--ciano),3px 0 var(--rosa)}
.recorte{display:inline-block;padding:.08em .18em;margin:0 .04em;border:3px solid var(--tinta);box-shadow:var(--sombra-s);font-family:var(--t-titulo);line-height:1;transform:rotate(var(--r,0deg))}
.mao{font-family:var(--t-mao)} .maq{font-family:var(--t-maq)}
.rotulo{font-family:var(--t-ui);font-weight:800;text-transform:uppercase;letter-spacing:.08em;font-size:.82rem}
h1,h2,h3{margin:.2em 0 .4em}
h2.hq{font-size:2rem} h3.hq{font-size:1.45rem}
small,.mini{font-size:.82rem;opacity:.85}

/* ---------- botões ---------- */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:.45em;padding:.55em 1em;border:var(--borda);border-radius:6px;background:var(--papel);color:var(--tinta);
  font-family:var(--t-titulo);font-size:1.15rem;letter-spacing:.05em;text-transform:uppercase;box-shadow:var(--sombra-s);transition:transform .08s,box-shadow .08s;min-height:44px;white-space:nowrap}
.btn:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--tinta)} .btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--tinta)}
.btn.rosa{background:var(--rosa);color:#fff;text-shadow:2px 2px 0 var(--tinta)} .btn.ciano{background:var(--ciano)} .btn.amarelo{background:var(--amarelo)} .btn.verm{background:var(--verm);color:#fff;text-shadow:2px 2px 0 var(--tinta)}
.btn.roxo{background:var(--roxo);color:#fff;text-shadow:2px 2px 0 var(--tinta)} .btn.verde{background:var(--verde)} .btn.escuro{background:var(--tinta2);color:var(--papel);border-color:var(--papel2)}
.btn.grande{font-size:1.7rem;padding:.5em 1.2em;min-height:64px} .btn.peq{font-size:.95rem;padding:.3em .7em;min-height:34px} .btn.mini{font-size:.82rem;padding:.15em .5em;min-height:28px;border-width:2px;box-shadow:2px 2px 0 var(--tinta)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none!important;box-shadow:var(--sombra-s)!important}
.btn .ico{width:1.2em;height:1.2em}
.btn-icone{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 8px;background:none;border:none;color:var(--papel);font-family:var(--t-ui);font-weight:800;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;min-width:58px;border-radius:6px;position:relative}
.btn-icone svg{width:26px;height:26px} .btn-icone:hover{background:rgba(255,255,255,.08)} .btn-icone.ativo{background:var(--rosa);color:#fff;box-shadow:inset 0 0 0 3px var(--tinta)}
.btn-icone .badge{position:absolute;top:0;right:6px;background:var(--amarelo);color:var(--tinta);border:2px solid var(--tinta);border-radius:10px;font-size:.7rem;padding:0 5px;line-height:1.3}

/* ---------- painéis de quadrinho ---------- */
.painel{background:var(--papel);color:var(--tinta);border:var(--borda);border-radius:6px;box-shadow:var(--sombra);padding:16px;position:relative}
.painel.escuro{background:var(--tinta2);color:var(--papel);border-color:var(--papel2);box-shadow:6px 6px 0 #000}
.painel .canto{position:absolute;top:-14px;left:12px;background:var(--amarelo);border:var(--borda);padding:2px 10px;font-family:var(--t-titulo);font-size:1rem;letter-spacing:.06em;color:var(--tinta);transform:rotate(-2deg);box-shadow:var(--sombra-s)}
.legenda{background:var(--amarelo);color:var(--tinta);border:var(--borda);padding:10px 14px;font-family:var(--t-maq);font-size:1.02rem;box-shadow:var(--sombra-s)}
.balao{background:#fff;color:var(--tinta);border:var(--borda);border-radius:24px;padding:12px 16px;position:relative;box-shadow:var(--sombra-s)}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border:2px solid var(--tinta);border-radius:4px;font-family:var(--t-ui);font-weight:800;font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;background:var(--papel2);color:var(--tinta);white-space:nowrap}
.tag.ativa{background:var(--rosa);color:#fff} .tag.pacifica{background:var(--ciano)} .tag.fis{background:var(--laranja)} .tag.mag{background:var(--roxo);color:#fff} .tag.efe{background:var(--amarelo)}
.tag.arma{background:#ff8a1f} .tag.vigor{background:#3dff8a} .tag.arcano{background:#b18cff}
.sep{height:3px;background:var(--tinta);margin:12px 0;border:none}
.grade{display:grid;gap:12px} .linha{display:flex;gap:10px;align-items:center;flex-wrap:wrap} .col{display:flex;flex-direction:column;gap:8px} .fill{flex:1} .centro{text-align:center}
.oculto{display:none!important}

/* ---------- TELA TÍTULO ---------- */
.titulo-tela{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:20px;overflow:auto;position:relative}
.logo{display:flex;flex-direction:column;align-items:center;gap:6px;transform:rotate(-2deg);filter:drop-shadow(8px 8px 0 #000)}
.logo .l1{display:flex;flex-wrap:wrap;justify-content:center;font-size:clamp(3rem,10vw,7.5rem)}
.logo .l1 .recorte:nth-child(odd){background:var(--papel);color:var(--tinta)} .logo .l1 .recorte:nth-child(3n){background:var(--rosa);color:#fff} .logo .l1 .recorte:nth-child(4n){background:var(--amarelo);color:var(--tinta)} .logo .l1 .recorte:nth-child(5n){background:var(--ciano);color:var(--tinta)}
.logo .l2{font-family:var(--t-titulo);font-size:clamp(4rem,14vw,10rem);color:var(--rosa);-webkit-text-stroke:4px var(--tinta);text-shadow:-6px 0 var(--ciano),6px 6px 0 var(--tinta);line-height:.9;letter-spacing:.06em}
.logo .l3{font-family:var(--t-mao);color:var(--amarelo);font-size:clamp(1rem,2.4vw,1.5rem);transform:rotate(3deg);text-shadow:2px 2px 0 #000}
.menu-titulo{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;width:min(980px,100%)}
.menu-titulo .opcao{display:flex;flex-direction:column;gap:6px;text-align:left;padding:16px 18px;border:var(--borda);border-radius:8px;box-shadow:var(--sombra);background:var(--papel);color:var(--tinta);transition:transform .1s}
.menu-titulo .opcao:hover{transform:translate(-3px,-3px) rotate(-.5deg);box-shadow:9px 9px 0 var(--tinta)}
.menu-titulo .opcao .hq{font-size:2rem} .menu-titulo .opcao p{margin:0;font-size:.95rem}
.menu-titulo .opcao.m{background:var(--rosa);color:#fff} .menu-titulo .opcao.m .hq{text-shadow:3px 3px 0 var(--tinta)} .menu-titulo .opcao.j{background:var(--ciano)} .menu-titulo .opcao.u{background:var(--amarelo)}
.pichacao{position:absolute;font-family:var(--t-mao);color:var(--rosa);opacity:.55;font-size:1.6rem;pointer-events:none;text-shadow:2px 2px 0 #000}
.rodape-titulo{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}

/* ---------- formulários / telas simples ---------- */
.tela-centro{flex:1;overflow:auto;display:flex;justify-content:center;align-items:flex-start;padding:30px 16px}
.caixa{width:min(720px,100%)}
.codigo-grande{font-family:var(--t-mono);font-size:clamp(3rem,10vw,5rem);letter-spacing:.2em;background:var(--amarelo);color:var(--tinta);border:var(--borda);box-shadow:var(--sombra);padding:6px 18px;display:inline-block;transform:rotate(-1.5deg)}
.campo{display:flex;flex-direction:column;gap:4px;margin-bottom:12px} .campo label{font-family:var(--t-ui);font-weight:800;text-transform:uppercase;letter-spacing:.06em;font-size:.85rem}

/* ---------- CRIAÇÃO ---------- */
.criacao{flex:1;display:flex;flex-direction:column;overflow:hidden}
.passos{display:flex;gap:6px;padding:10px 14px;overflow-x:auto;background:var(--tinta2);border-bottom:var(--borda);flex-shrink:0}
.passo{display:flex;align-items:center;gap:6px;padding:6px 12px;border:2px solid var(--papel2);border-radius:20px;font-family:var(--t-ui);font-weight:800;text-transform:uppercase;font-size:.85rem;white-space:nowrap;opacity:.6;background:none;color:var(--papel)}
.passo.feito{opacity:1;background:#2c2638} .passo.atual{opacity:1;background:var(--rosa);color:#fff;border-color:var(--tinta);box-shadow:var(--sombra-s)}
.passo b{font-family:var(--t-titulo);font-size:1rem}
.criacao-corpo{flex:1;overflow:auto;padding:18px}
.criacao-pe{display:flex;justify-content:space-between;gap:10px;padding:12px 16px;border-top:var(--borda);background:var(--tinta2);flex-shrink:0;align-items:center}
.grid-cartas{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px}
.carta-tarot{position:relative;border:var(--borda);border-radius:10px;background:var(--papel);color:var(--tinta);box-shadow:var(--sombra-s);overflow:hidden;cursor:pointer;transition:transform .12s;display:flex;flex-direction:column}
.carta-tarot:hover{transform:translateY(-4px) rotate(-1deg)} .carta-tarot.sel{outline:5px solid var(--rosa);outline-offset:2px;transform:translateY(-4px)}
.carta-tarot .ct-arte{height:150px;position:relative;border-bottom:var(--borda);display:flex;align-items:center;justify-content:center;overflow:hidden}
.carta-tarot .ct-num{position:absolute;top:6px;left:8px;font-family:var(--t-titulo);font-size:1.6rem;color:#fff;text-shadow:2px 2px 0 var(--tinta)}
.carta-tarot .ct-morto{position:absolute;top:8px;right:-30px;transform:rotate(35deg);background:var(--tinta);color:var(--amarelo);font-family:var(--t-ui);font-weight:800;font-size:.7rem;padding:2px 34px;letter-spacing:.1em}
.carta-tarot .ct-corpo{padding:8px 10px;display:flex;flex-direction:column;gap:4px;flex:1}
.carta-tarot .ct-nome{font-family:var(--t-titulo);font-size:1.45rem;line-height:1} .carta-tarot .ct-carta{font-family:var(--t-ui);font-weight:800;text-transform:uppercase;font-size:.8rem;opacity:.75}
.detalhe-ent{display:grid;grid-template-columns:240px 1fr;gap:18px;margin-top:18px} @media(max-width:760px){.detalhe-ent{grid-template-columns:1fr}}
.classe-card{border:var(--borda);border-radius:10px;background:var(--papel);color:var(--tinta);box-shadow:var(--sombra-s);padding:14px;cursor:pointer;transition:transform .12s;display:flex;flex-direction:column;gap:6px}
.classe-card:hover{transform:translateY(-3px)} .classe-card.sel{outline:5px solid var(--rosa);outline-offset:2px;background:#fff}
.classe-card .cc-ic{font-size:2.6rem;line-height:1;font-family:var(--t-titulo);width:64px;height:64px;display:grid;place-items:center;border:var(--borda);border-radius:50%;background:var(--amarelo)}
.attr-linha{display:grid;grid-template-columns:150px 1fr auto;gap:12px;align-items:center;padding:10px;border-bottom:2px dashed rgba(0,0,0,.25)}
.attr-val{font-family:var(--t-titulo);font-size:2.2rem;width:56px;text-align:center}
.pontos{font-family:var(--t-titulo);font-size:2rem;background:var(--amarelo);border:var(--borda);padding:2px 14px;box-shadow:var(--sombra-s);color:var(--tinta)}
.chip-sel{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border:var(--borda);border-radius:6px;background:var(--papel);color:var(--tinta);cursor:pointer;font-weight:700;box-shadow:var(--sombra-s);margin:4px}
.chip-sel.sel{background:var(--rosa);color:#fff} .chip-sel.off{opacity:.4;cursor:not-allowed}
.lista-escolha{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.item-escolha{border:var(--borda);border-radius:8px;background:var(--papel);color:var(--tinta);padding:10px 12px;cursor:pointer;box-shadow:var(--sombra-s);display:flex;flex-direction:column;gap:4px}
.item-escolha.sel{background:#fff;outline:4px solid var(--rosa)} .item-escolha.off{opacity:.45;cursor:not-allowed}
.item-escolha .ie-nome{font-family:var(--t-cab);font-size:1.15rem;text-transform:uppercase;letter-spacing:.02em}
.prontos{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}

/* ---------- MESA ---------- */
.topo{display:flex;align-items:center;gap:10px;padding:6px 10px;background:var(--tinta);border-bottom:var(--borda);border-color:var(--rosa);flex-shrink:0;min-height:62px;z-index:30;position:relative}
.topo .mini-logo{font-family:var(--t-titulo);font-size:1.5rem;color:var(--rosa);-webkit-text-stroke:1px #000;text-shadow:-2px 0 var(--ciano);white-space:nowrap;cursor:pointer}
.topo .sala{font-family:var(--t-mono);font-size:.85rem;background:var(--amarelo);color:var(--tinta);border:2px solid #000;padding:2px 8px;cursor:pointer}
.ordem{flex:1;display:flex;gap:6px;align-items:center;overflow-x:auto;padding:4px 6px;min-width:0}
.ordem .o-rod{font-family:var(--t-titulo);font-size:1.1rem;color:var(--amarelo);white-space:nowrap;margin-right:4px}
.o-peca{display:flex;align-items:center;gap:6px;padding:3px 10px 3px 3px;border:2px solid var(--papel2);border-radius:22px;background:var(--tinta2);white-space:nowrap;font-family:var(--t-ui);font-weight:800;font-size:.85rem;opacity:.75;flex-shrink:0}
.o-peca .o-ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:2px solid #000;font-size:1rem;font-family:var(--t-titulo)}
.o-peca.vez{opacity:1;background:var(--amarelo);color:var(--tinta);border-color:#000;box-shadow:3px 3px 0 var(--rosa);transform:scale(1.08)} .o-peca.ini .o-ic{background:var(--verm);color:#fff} .o-peca.caido{text-decoration:line-through;opacity:.4}
.o-peca .o-n{font-family:var(--t-titulo);font-size:1rem}
.corpo-mesa{flex:1;display:flex;min-height:0;position:relative}
.doca{width:380px;flex-shrink:0;display:flex;flex-direction:column;background:var(--tinta2);border-right:var(--borda);border-color:var(--rosa);min-height:0;z-index:20}
.doca.dir{border-right:none;border-left:var(--borda);border-color:var(--ciano);width:360px}
.doca-abas{display:flex;flex-wrap:wrap;gap:2px;padding:6px;border-bottom:3px solid #000;background:#120f18}
.doca-corpo{flex:1;overflow:auto;padding:14px}
.doca.fechada{display:none}
.area-tab{flex:1;position:relative;min-width:0;overflow:hidden;display:flex;flex-direction:column}

/* ---------- TABULEIRO 2.5D ---------- */
.tab-wrap{flex:1;position:relative;overflow:hidden;perspective:1400px;perspective-origin:50% 30%;touch-action:none}
.tab-cena{position:absolute;left:50%;top:50%;transform-style:preserve-3d}
.tab-plano{position:absolute;transform-style:preserve-3d;transform-origin:50% 50%}
.tab-chao{position:absolute;inset:-26px;background:#14101c;border:4px solid #000;box-shadow:0 0 0 6px var(--rosa),0 40px 60px rgba(0,0,0,.6);border-radius:6px}
.tab-chao::after{content:'';position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.06) 1.2px,transparent 1.6px);background-size:8px 8px}
.casa{position:absolute;border:1px solid rgba(24,224,255,.18);transition:background .15s}
.casa.escura{background:rgba(255,255,255,.035)}
.casa.alcance{background:rgba(24,224,255,.28);box-shadow:inset 0 0 0 2px rgba(24,224,255,.7);cursor:pointer}
.casa.alcance:hover{background:rgba(24,224,255,.55)}
.casa.alvo-area{background:rgba(255,45,149,.45);box-shadow:inset 0 0 0 3px var(--rosa)}
.casa.no-alcance{background:rgba(255,232,26,.12)}
.casa.tele{background:repeating-linear-gradient(45deg,rgba(255,59,48,.55) 0 8px,rgba(255,59,48,.25) 8px 16px);box-shadow:inset 0 0 0 3px var(--verm);animation:pulsaTele 1s infinite}
@keyframes pulsaTele{50%{background-color:rgba(255,59,48,.35)}}
.casa.obst{background:linear-gradient(135deg,#3a3245,#211b2a);box-shadow:inset 0 0 0 3px #000,inset 6px 6px 0 rgba(255,255,255,.08)}
.casa.obst::after{content:'';position:absolute;inset:6px;border:2px dashed rgba(255,255,255,.18)}
.casa.muro{background:repeating-linear-gradient(0deg,#b4462e 0 10px,#7a2c1d 10px 12px);box-shadow:inset 0 0 0 3px #000}
.casa.pintar:hover{background:rgba(255,232,26,.35)}
.casa .rot-tele{position:absolute;left:2px;top:2px;font-family:var(--t-ui);font-weight:800;font-size:11px;color:#fff;background:var(--verm);padding:0 4px;border:2px solid #000;white-space:nowrap;z-index:2}
.peca{position:absolute;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.3,1.4,.5,1);pointer-events:none}
.peca .salto{position:absolute;left:0;top:0;transform-style:preserve-3d}
.peca .base{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;border:4px solid #000;background:var(--cor,#ff2d95);opacity:.9;box-shadow:0 0 0 3px var(--cor,#ff2d95)}
.peca.vez .base{animation:anelVez 1.1s infinite} @keyframes anelVez{50%{box-shadow:0 0 0 9px var(--amarelo)}}
.peca .fig{position:absolute;left:50%;bottom:50%;width:74px;margin-left:-37px;transform-origin:50% 100%;transform-style:preserve-3d;pointer-events:auto;cursor:pointer}
.peca .fig-in{position:relative;display:flex;flex-direction:column;align-items:center;transition:filter .2s}
.peca .cartaz{width:66px;height:80px;border:3px solid #000;border-radius:8px;background:var(--papel);position:relative;overflow:hidden;box-shadow:4px 4px 0 #000;display:flex;align-items:center;justify-content:center}
.peca .cartaz::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 40%,var(--cor) 0 30%,transparent 31%),radial-gradient(rgba(0,0,0,.25) 1.1px,transparent 1.5px);background-size:auto,6px 6px}
.peca .glifo{position:relative;font-family:var(--t-titulo);font-size:34px;color:#fff;-webkit-text-stroke:1.5px #000;text-shadow:3px 3px 0 #000;line-height:1}
.peca .ini-faixa{position:absolute;left:0;right:0;bottom:0;height:12px;background:repeating-linear-gradient(45deg,#000 0 6px,var(--verm) 6px 12px)}
.peca .nome{margin-top:4px;max-width:120px;font-family:var(--t-ui);font-weight:800;font-size:13px;line-height:1.05;text-align:center;background:#000;color:#fff;padding:2px 6px;border-radius:3px;text-transform:uppercase;letter-spacing:.03em}
.peca.inimigo .nome{background:var(--verm)}
.peca .vida{position:absolute;top:-14px;left:-4px;right:-4px;height:10px;border:2px solid #000;background:#2a2230;border-radius:3px;overflow:hidden}
.peca .vida i{display:block;height:100%;background:var(--verde);transition:width .4s} .peca.inimigo .vida i{background:var(--verm)} .peca .vida b{position:absolute;right:0;top:0;height:100%;background:var(--ciano);opacity:.9}
.peca .conds{position:absolute;top:-36px;left:50%;transform:translateX(-50%);display:flex;gap:1px;font-size:15px;white-space:nowrap;filter:drop-shadow(1px 1px 0 #000)}
.peca.caido .fig-in{filter:grayscale(1) brightness(.6);transform:rotate(-80deg) translate(10px,30px)}
.peca.caido .fig{pointer-events:auto}
.peca.selecionada .cartaz{outline:4px solid var(--amarelo);outline-offset:2px}
.peca.alvejavel .cartaz{outline:4px dashed var(--rosa);outline-offset:3px;animation:alvoPulsa .8s infinite} @keyframes alvoPulsa{50%{outline-color:#fff}}
.peca.flash .cartaz{animation:flashDano .35s}
@keyframes flashDano{0%{background:#fff}30%{background:var(--verm);transform:translateX(-6px)}60%{transform:translateX(6px)}100%{transform:none}}
.flutua{position:absolute;left:50%;bottom:110%;transform:translateX(-50%);font-family:var(--t-titulo);font-size:34px;color:#fff;-webkit-text-stroke:2px #000;text-shadow:3px 3px 0 #000;white-space:nowrap;pointer-events:none;animation:sobe 1.8s forwards;z-index:5}
.flutua.cura{color:var(--verde)} .flutua.esc{color:var(--ciano)} .flutua.cond{font-size:20px;color:var(--amarelo)} .flutua.mag{color:#c9b4ff} .flutua.grande{font-size:46px}
@keyframes sobe{0%{opacity:0;transform:translate(-50%,10px) scale(.6)}15%{opacity:1;transform:translate(-50%,-10px) scale(1.2)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-70px) scale(1)}}
.projetil{position:fixed;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:var(--amarelo);box-shadow:0 0 0 3px #000,0 0 18px var(--amarelo);z-index:60;pointer-events:none}
.tab-ctrl{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px;z-index:5}
.tab-ctrl .btn{min-height:38px;width:42px;padding:0}
.dica-tab{position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:8;max-width:min(640px,90%);text-align:center;pointer-events:none}
.dica-tab .legenda{pointer-events:auto;display:inline-flex;gap:10px;align-items:center;font-size:1.05rem}
.dist-cursor{position:fixed;z-index:70;pointer-events:none;background:#000;color:var(--amarelo);font-family:var(--t-ui);font-weight:800;padding:2px 8px;border:2px solid var(--amarelo);border-radius:4px;font-size:.9rem;transform:translate(14px,14px)}
.tooltip-peca{position:fixed;z-index:65;pointer-events:none;width:300px;max-width:80vw}
.tooltip-peca .painel{padding:12px;font-size:.95rem}

/* cena narrada (legenda de quadrinho no topo da mesa) */
.cena-caixa{position:absolute;left:14px;top:14px;z-index:9;width:min(520px,calc(100% - 28px));max-height:46%;display:flex;flex-direction:column}
.cena-caixa .legenda{overflow:auto;font-size:1.08rem;line-height:1.55}
.cena-caixa .cena-tit{font-family:var(--t-titulo);font-size:1.4rem;letter-spacing:.04em;background:var(--tinta);color:var(--amarelo);border:var(--borda);border-bottom:none;padding:4px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.cena-mini{position:absolute;left:14px;top:14px;z-index:9}

/* ---------- HUD DO JOGADOR ---------- */
.hud{flex-shrink:0;display:flex;gap:12px;padding:10px 12px;background:var(--tinta2);border-top:var(--borda);border-color:var(--amarelo);z-index:25;align-items:stretch;min-height:var(--hud-h);position:relative}
.hud-retrato{display:flex;gap:10px;width:310px;flex-shrink:0}
.retrato{width:84px;height:104px;border:var(--borda);border-color:#000;border-radius:8px;background:var(--cor,#ff2d95);display:flex;align-items:center;justify-content:center;font-family:var(--t-titulo);font-size:52px;color:#fff;-webkit-text-stroke:2px #000;text-shadow:4px 4px 0 #000;box-shadow:4px 4px 0 var(--rosa);flex-shrink:0;position:relative;overflow:hidden}
.retrato::after{content:'';position:absolute;inset:0;background-image:radial-gradient(rgba(0,0,0,.25) 1.2px,transparent 1.6px);background-size:6px 6px}
.hud-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.hud-nome{font-family:var(--t-titulo);font-size:1.45rem;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barra{position:relative;height:22px;border:3px solid #000;border-radius:4px;background:#2a2230;overflow:hidden}
.barra i{position:absolute;left:0;top:0;bottom:0;transition:width .4s} .barra.vida i{background:linear-gradient(#ff6a5f,var(--verm))} .barra.en i{background:linear-gradient(#b49bff,var(--roxo))}
.barra .esc{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(45deg,var(--ciano) 0 5px,#0ab 5px 10px);opacity:.9}
.barra span{position:relative;z-index:2;display:block;text-align:center;font-family:var(--t-ui);font-weight:800;font-size:.9rem;line-height:16px;color:#fff;text-shadow:1px 1px 0 #000,-1px -1px 0 #000}
.medidor{display:flex;gap:3px;align-items:center;font-family:var(--t-ui);font-weight:800;font-size:.8rem;text-transform:uppercase}
.medidor i{width:16px;height:12px;border:2px solid #000;background:#2a2230;display:inline-block;transform:skew(-15deg)} .medidor i.on{background:var(--amarelo)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip-cond{display:inline-flex;align-items:center;gap:3px;padding:1px 7px;border:2px solid #000;border-radius:12px;background:var(--papel);color:var(--tinta);font-size:.8rem;font-weight:700;cursor:help}
.chip-cond.mau{background:#ffd0cc} .chip-cond.bom{background:#ccfff0}
.hud-turno{width:190px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;justify-content:center}
.pilula{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 10px;border:3px solid #000;border-radius:20px;font-family:var(--t-ui);font-weight:800;text-transform:uppercase;font-size:.9rem;letter-spacing:.04em}
.pilula.a{background:var(--rosa);color:#fff} .pilula.p{background:var(--ciano);color:var(--tinta)} .pilula.m{background:var(--papel);color:var(--tinta)}
.pilula.usada{background:#3a3445;color:#8d86a0;text-decoration:line-through}
.sua-vez{font-family:var(--t-titulo);font-size:1.5rem;color:var(--amarelo);text-shadow:3px 3px 0 #000;text-align:center;animation:pisca 1.2s infinite} @keyframes pisca{50%{opacity:.6}}
.espera-vez{font-family:var(--t-ui);font-weight:800;text-transform:uppercase;text-align:center;color:var(--papel2);font-size:.95rem}
.hud-acoes{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;overflow:hidden}
.fileira{display:flex;align-items:stretch;gap:6px;min-height:0}
.fileira .rot{writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--t-titulo);font-size:1rem;letter-spacing:.08em;padding:4px 2px;border:3px solid #000;border-radius:4px;text-align:center}
.fileira.a .rot{background:var(--rosa);color:#fff} .fileira.p .rot{background:var(--ciano);color:var(--tinta)}
.fileira .lista{display:flex;gap:6px;overflow-x:auto;padding:2px 4px 6px 2px;flex:1}
.acao{position:relative;width:78px;min-width:78px;height:74px;border:3px solid #000;border-radius:8px;background:var(--papel);color:var(--tinta);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:4px 3px;box-shadow:3px 3px 0 #000;transition:transform .08s;text-align:center}
.acao:hover{transform:translateY(-3px)} .acao.sel{background:var(--amarelo);transform:translateY(-4px);box-shadow:3px 7px 0 #000}
.acao .a-ic{font-size:1.6rem;line-height:1;font-family:var(--t-titulo)} .acao .a-n{font-family:var(--t-ui);font-weight:800;font-size:.74rem;line-height:1.05;text-transform:uppercase;max-height:2.2em;overflow:hidden}
.acao .a-en{position:absolute;top:-8px;right:-8px;background:var(--roxo);color:#fff;border:2px solid #000;border-radius:50%;width:24px;height:24px;display:grid;place-items:center;font-family:var(--t-titulo);font-size:.9rem}
.acao .a-q{position:absolute;top:-8px;left:-8px;background:var(--amarelo);border:2px solid #000;border-radius:10px;padding:0 5px;font-size:.75rem;font-weight:800}
.acao.off{opacity:.42} .acao.off:hover{transform:none}
.acao .a-rec{position:absolute;inset:0;background:rgba(13,11,18,.72);color:var(--amarelo);display:grid;place-items:center;font-family:var(--t-titulo);font-size:1.6rem;border-radius:5px}
.acao.magia{background:linear-gradient(180deg,#efe4ff,var(--papel))} .acao.musica{background:linear-gradient(180deg,#fff2a8,var(--papel))} .acao.comida{background:linear-gradient(180deg,#d6ffe6,var(--papel))}
.acao.apice{box-shadow:3px 3px 0 #000,0 0 0 3px var(--amarelo)}
.detalhe-acao{position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%);width:min(560px,94vw);z-index:40}
.detalhe-acao .painel{padding:14px 16px}
.da-cab{display:flex;align-items:center;gap:10px;margin-bottom:6px} .da-cab .hq{font-size:1.7rem} .da-tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.da-texto{font-size:1.05rem}
.da-grade{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px;margin:10px 0}
.da-grade div{background:var(--papel2);border:2px solid #000;border-radius:4px;padding:4px 8px} .da-grade b{display:block;font-family:var(--t-ui);font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;opacity:.7}
.hud-fora{display:flex;flex-direction:column;justify-content:center;gap:6px;width:190px;flex-shrink:0}

/* ---------- abas laterais ---------- */
.ficha-attr{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.ficha-attr button{border:3px solid #000;border-radius:6px;background:var(--papel);color:var(--tinta);padding:6px 2px;box-shadow:2px 2px 0 #000;display:flex;flex-direction:column;align-items:center}
.ficha-attr b{font-family:var(--t-titulo);font-size:1.8rem;line-height:1} .ficha-attr span{font-family:var(--t-ui);font-weight:800;font-size:.7rem;text-transform:uppercase}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stat{border:2px solid var(--papel2);border-radius:6px;padding:4px 8px;background:#120f18} .stat b{display:block;font-family:var(--t-titulo);font-size:1.4rem;color:var(--amarelo);line-height:1.1} .stat span{font-family:var(--t-ui);font-weight:800;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;opacity:.8}
.pericias{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.pericia{display:flex;justify-content:space-between;align-items:center;padding:4px 8px;border:2px solid #3a3445;border-radius:4px;background:#120f18;font-size:.92rem;cursor:pointer} .pericia:hover{border-color:var(--amarelo)} .pericia.tr{border-color:var(--ciano)} .pericia b{font-family:var(--t-titulo);font-size:1.1rem;color:var(--amarelo)}
.bloco{margin-bottom:16px}
.bloco > .rotulo{display:block;margin-bottom:6px;color:var(--amarelo)}
.inv-item{display:flex;align-items:center;gap:8px;padding:8px;border:2px solid #3a3445;border-radius:6px;background:#120f18;margin-bottom:6px}

.dinheiro{display:flex;gap:10px} .dinheiro div{flex:1;border:3px solid #000;border-radius:6px;padding:6px 10px;background:var(--amarelo);color:var(--tinta);font-family:var(--t-titulo);font-size:1.5rem;text-align:center} .dinheiro div.c{background:var(--roxo);color:#fff;text-shadow:2px 2px 0 #000}
.loja-aviso{padding:8px 12px;border:3px solid #000;border-radius:6px;background:var(--amarelo);color:var(--tinta);font-weight:700;margin-bottom:10px}

.loja-item .preco{font-family:var(--t-titulo);font-size:1.2rem;color:var(--amarelo);white-space:nowrap}
.registro{display:flex;flex-direction:column;gap:3px;font-size:.92rem}
.registro .l{padding:3px 8px;border-left:4px solid #3a3445} .registro .l.bom{border-color:var(--verde)} .registro .l.mau{border-color:var(--verm);color:#ffb3ad} .registro .l.aviso{border-color:var(--verm);background:rgba(255,59,48,.12);font-weight:700}
.registro .l.rodada{border:none;text-align:center;font-family:var(--t-titulo);color:var(--amarelo);font-size:1.1rem;letter-spacing:.06em} .registro .l.acao,.registro .l.acaoIni{font-weight:700;color:#fff;border-color:var(--rosa)} .registro .l.acaoIni{border-color:var(--verm)}
.registro .l.dado{border-color:var(--ciano)} .registro .l.chat{border-color:var(--amarelo)} .registro .l.cena{border-color:var(--amarelo);font-family:var(--t-maq)} .registro .l.erro{opacity:.7}
.registro .l .q{font-weight:800;color:var(--amarelo)}

/* ---------- MESTRE ---------- */
.m-sec{margin-bottom:18px} .m-sec > h4{margin:0 0 8px;font-family:var(--t-titulo);font-size:1.3rem;letter-spacing:.05em;color:var(--amarelo);display:flex;align-items:center;gap:8px}
.bestiario{display:flex;flex-direction:column;gap:5px}
.best{display:flex;align-items:center;gap:8px;padding:6px 8px;border:2px solid #3a3445;border-radius:6px;background:#120f18}
.best .b-ic{width:34px;height:34px;border-radius:50%;border:2px solid #000;background:var(--verm);display:grid;place-items:center;font-family:var(--t-titulo);color:#fff;flex-shrink:0}
.best.chefe .b-ic{background:var(--amarelo);color:#000} .best.deus .b-ic{background:var(--roxo)}
.best .b-n{flex:1;min-width:0;font-weight:700;line-height:1.15} .best .b-n small{display:block;opacity:.7;font-weight:400}
.ini-card{border:3px solid #000;border-radius:8px;background:var(--papel);color:var(--tinta);padding:10px;box-shadow:var(--sombra-s);margin-bottom:10px}
.ini-card .ic-cab{display:flex;align-items:center;gap:8px;margin-bottom:6px} .ini-card .ic-cab .hq{font-size:1.3rem;flex:1}
.atk-btn{display:flex;flex-direction:column;align-items:flex-start;text-align:left;width:100%;padding:6px 10px;border:2px solid #000;border-radius:6px;background:#fff;margin-bottom:5px;box-shadow:2px 2px 0 #000;color:var(--tinta)}
.atk-btn:hover{background:var(--amarelo)} .atk-btn.tele{background:#ffd6d3} .atk-btn b{font-family:var(--t-cab);text-transform:uppercase;font-size:1rem} .atk-btn span{font-size:.85rem}
.pc-card{border:2px solid #3a3445;border-radius:8px;background:#120f18;padding:10px;margin-bottom:10px}
.pc-card .pc-cab{display:flex;gap:8px;align-items:center}
.numctrl{display:flex;align-items:center;gap:4px} .numctrl input{width:70px;text-align:center;padding:4px}
.cena-lista .cena-item{border:2px solid #3a3445;border-radius:8px;padding:10px;margin-bottom:10px;background:#120f18}
.cena-item.feita{opacity:.6} .cena-item h5{margin:0 0 6px;font-family:var(--t-cab);font-size:1.1rem;text-transform:uppercase;color:var(--amarelo);letter-spacing:.02em}
.leitura{font-family:var(--t-maq);background:var(--amarelo);color:var(--tinta);border:3px solid #000;padding:10px;margin:6px 0;font-size:.98rem}
.nota-mestre{border-left:4px solid var(--rosa);padding:6px 10px;background:rgba(255,45,149,.08);font-size:.95rem;margin:6px 0}
.escolha{display:flex;gap:8px;align-items:flex-start;padding:6px;border:2px dashed #4a4458;border-radius:6px;margin:5px 0}
.escolha.feita{border-style:solid;border-color:var(--verde);background:rgba(61,255,138,.08)}
.laco{display:grid;grid-template-columns:90px 1fr 34px;align-items:center;gap:8px;margin-bottom:6px}
.laco-barra{display:grid;grid-template-columns:repeat(7,1fr);gap:2px} .laco-barra button{height:26px;border:2px solid #000;background:#2a2230;font-size:.75rem;font-weight:800;color:#fff;padding:0}
.laco-barra button.on{background:var(--amarelo);color:#000} .laco-barra button.neg.on{background:var(--verm);color:#fff}
.relogio{display:flex;gap:4px;flex-wrap:wrap} .relogio button{width:34px;height:34px;border:3px solid #000;border-radius:50%;background:var(--papel);font-family:var(--t-titulo);color:var(--tinta);padding:0} .relogio button.gasto{background:#000;color:#555}
.segredo-tag{display:inline-block;background:var(--verm);color:#fff;border:2px solid #000;font-family:var(--t-ui);font-weight:800;font-size:.75rem;padding:1px 6px;text-transform:uppercase;letter-spacing:.06em}

/* ---------- MODAIS / LIVRO ---------- */
.modal{position:fixed;inset:0;z-index:100;background:rgba(13,11,18,.86);display:flex;align-items:center;justify-content:center;padding:16px}
.modal > .painel{max-width:min(1100px,100%);max-height:100%;overflow:auto;width:100%}
.livro{position:fixed;inset:0;z-index:90;background:var(--tinta);display:flex;flex-direction:column}
.livro-topo{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:var(--borda);border-color:var(--amarelo);background:var(--tinta);position:relative;z-index:3;flex-wrap:wrap}

.livro-abas{display:flex;gap:4px;flex-wrap:wrap;flex:1}
.livro-abas button{border:2px solid var(--papel2);background:none;color:var(--papel);font-family:var(--t-ui);font-weight:800;text-transform:uppercase;font-size:.9rem;padding:5px 10px;border-radius:4px;letter-spacing:.04em}

.livro-corpo{flex:1;overflow:auto;padding:24px 16px;position:relative;z-index:1}

.pagina h2.hq{font-size:2.6rem;color:var(--tinta);text-shadow:3px 3px 0 var(--ciano)} .pagina h3{font-family:var(--t-cab);text-transform:uppercase;font-size:1.4rem;letter-spacing:.02em;margin-top:1.2em}
.pagina p,.pagina li{font-size:1.05rem}
.pagina .caixa-regra{border:3px solid #000;background:#fff;padding:12px 16px;margin:12px 0;box-shadow:4px 4px 0 var(--ciano)}
.pagina .caixa-regra.rosa{box-shadow:4px 4px 0 var(--rosa)} .pagina .caixa-regra.amarelo{background:var(--amarelo)}
.pagina table{border-collapse:collapse;width:100%;margin:10px 0;font-size:.95rem} .pagina th{background:var(--tinta);color:var(--amarelo);font-family:var(--t-ui);text-transform:uppercase;letter-spacing:.05em;padding:6px} .pagina td{border:2px solid #000;padding:6px;vertical-align:top}
.spoiler-portao{max-width:640px;margin:40px auto;text-align:center}
.spoiler-portao .painel{background:var(--verm);color:#fff;transform:rotate(-1deg)} .spoiler-portao .hq{font-size:3rem;text-shadow:4px 4px 0 #000}

/* ---------- bandeja de dados ---------- */
.bandeja{position:fixed;left:50%;top:46%;transform:translate(-50%,-50%) rotate(-.6deg);width:min(640px,94vw);z-index:80;background:var(--papel);border:4px solid #000;border-radius:10px;box-shadow:10px 10px 0 #000,0 0 0 8px var(--rosa);padding:10px;transition:opacity .2s}
.bandeja.oculta{opacity:0;pointer-events:none;transform:translate(-50%,-40%)}
.bj-cab{display:flex;justify-content:space-between;align-items:baseline;gap:8px;color:var(--tinta);padding:0 6px 6px}
.bj-quem{font-family:var(--t-titulo);font-size:1.5rem} .bj-label{font-family:var(--t-ui);font-weight:800;text-transform:uppercase;font-size:1.05rem;letter-spacing:.06em;background:var(--tinta);color:var(--amarelo);padding:2px 10px;border-radius:3px}
.bj-mesa{position:relative;height:clamp(200px,32vh,300px);border:4px solid #000;border-radius:8px;background:#1b3a2a;background-image:radial-gradient(rgba(0,0,0,.25) 1.4px,transparent 1.8px),radial-gradient(ellipse at 50% 40%,#2f6b4a,#123222);background-size:8px 8px,100% 100%;box-shadow:inset 0 0 0 6px #6b3d1f,inset 0 0 40px rgba(0,0,0,.6);overflow:hidden;touch-action:none}
.bandeja.espera .bj-mesa{cursor:grab} .bandeja.segurando .bj-mesa{cursor:grabbing}
.bj-dica{position:absolute;left:0;right:0;bottom:10px;text-align:center;color:#fff;font-family:var(--t-ui);font-weight:800;font-size:1.15rem;text-transform:uppercase;letter-spacing:.05em;text-shadow:2px 2px 0 #000;pointer-events:none;animation:pisca 1.2s infinite}
.bj-res{min-height:96px;color:var(--tinta);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding-top:6px}
.bj-sub{font-family:var(--t-ui);font-weight:800;text-transform:uppercase;letter-spacing:.04em;font-size:1rem}
.bj-total{display:flex;align-items:baseline;gap:10px;font-family:var(--t-titulo)} .bj-total .bj-num{font-size:3.6rem;line-height:1;color:var(--rosa);-webkit-text-stroke:2px #000;text-shadow:4px 4px 0 #000} .bj-total .bj-nat,.bj-total .bj-op{font-size:2rem}
.bj-total.dano .bj-num{color:var(--verm)} .bj-total.dano.mag .bj-num{color:var(--roxo)} .bj-total.cura .bj-num{color:var(--verde)} .bj-vs{font-family:var(--t-ui);font-weight:800;text-transform:uppercase;font-size:1.1rem}
.bj-carimbo{font-family:var(--t-titulo);font-size:2.6rem;letter-spacing:.05em;transform:rotate(-4deg);animation:carimbo .35s cubic-bezier(.3,1.8,.5,1)} .bj-carimbo.ok{color:#0a9e4a;text-shadow:3px 3px 0 #000} .bj-carimbo.bad{color:var(--verm);text-shadow:3px 3px 0 #000}
@keyframes carimbo{0%{transform:rotate(-4deg) scale(2.4);opacity:0}100%{transform:rotate(-4deg) scale(1);opacity:1}}
.bj-pular{position:absolute;right:12px;bottom:6px;font-family:var(--t-ui);font-weight:800;color:#555;font-size:.85rem;text-transform:uppercase;cursor:pointer}
.bandeja.espera .bj-pular{display:none}
.bandeja.nat20{box-shadow:10px 10px 0 #000,0 0 0 8px var(--amarelo),0 0 80px var(--amarelo)} .bandeja.nat20 .bj-num{color:var(--amarelo)}
.bandeja.nat1{box-shadow:10px 10px 0 #000,0 0 0 8px #000;animation:tremor .5s} .bandeja.nat1 .bj-mesa{filter:saturate(.3) brightness(.7)}
@keyframes tremor{20%{transform:translate(-52%,-50%) rotate(-2deg)}40%{transform:translate(-48%,-50%) rotate(1deg)}60%{transform:translate(-51%,-50%)}}

/* banners curtos (sem cobrir a mesa por muito tempo) */
.banner{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%) rotate(-4deg);z-index:75;pointer-events:none;font-family:var(--t-titulo);font-size:clamp(3rem,9vw,6rem);color:var(--amarelo);-webkit-text-stroke:3px #000;text-shadow:6px 6px 0 #000,-4px 0 var(--ciano);animation:banner 1.6s forwards;white-space:nowrap}
.banner.curto{animation-duration:1.1s;font-size:clamp(2rem,6vw,4rem)}
@keyframes banner{0%{opacity:0;transform:translate(-50%,-50%) rotate(-4deg) scale(2.2)}15%{opacity:1;transform:translate(-50%,-50%) rotate(-4deg) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%) rotate(-4deg) scale(.95)}}
.toasts{position:fixed;right:14px;bottom:calc(var(--hud-h) + 14px);z-index:95;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{background:var(--papel);color:var(--tinta);border:3px solid #000;box-shadow:var(--sombra-s);padding:8px 14px;font-weight:700;max-width:360px;animation:toastIn .25s} .toast.erro{background:var(--verm);color:#fff} .toast.bom{background:var(--verde)}
@keyframes toastIn{from{transform:translateX(40px);opacity:0}}

/* ---------- derrota ---------- */
.derrota{position:fixed;inset:0;z-index:85;background:radial-gradient(circle,rgba(60,0,10,.85),rgba(0,0,0,.95));display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;padding:20px;text-align:center}
.derrota .hq{font-size:clamp(3rem,12vw,8rem);color:var(--verm);-webkit-text-stroke:3px #000;text-shadow:8px 8px 0 #000}
.derrota .sub{font-family:var(--t-maq);font-size:1.3rem;max-width:640px;color:var(--papel)}

/* ---------- tutorial ---------- */
.tuto{position:fixed;inset:0;z-index:110;pointer-events:none}
.tuto .furo{position:fixed;border:4px solid var(--amarelo);border-radius:10px;box-shadow:0 0 0 9999px rgba(13,11,18,.78);transition:all .3s;pointer-events:none}
.tuto .tuto-caixa{position:fixed;width:min(420px,92vw);pointer-events:auto;transition:all .3s}
.tuto .tuto-caixa .painel{padding:16px 18px} .tuto .tuto-caixa .hq{font-size:1.6rem}

@media (max-width:1180px){ .doca{width:320px} .doca.dir{width:300px} }
@media (max-width:980px){
  :root{--hud-h:auto}
  .doca{position:absolute;top:0;bottom:0;left:0;width:min(420px,92vw);box-shadow:10px 0 30px rgba(0,0,0,.6)} .doca.dir{left:auto;right:0}
  .hud{flex-wrap:wrap} .hud-retrato{width:100%} .hud-turno,.hud-fora{width:100%;flex-direction:row;flex-wrap:wrap} .hud-acoes{width:100%;flex:none}
  .topo .mini-logo{display:none}
}
@media (max-width:600px){ html{font-size:calc(15px * var(--esc))} .acao{width:66px;min-width:66px;height:66px} .retrato{width:62px;height:78px;font-size:38px} }
.reduzir *{animation-duration:.01ms!important;transition-duration:.01ms!important}
/* livro no app */
.pagina .arcano{display:grid;grid-template-columns:130px 1fr;gap:16px;padding:14px 0;border-bottom:3px dashed rgba(0,0,0,.3)} .pagina .arcano-arte svg{width:100%;height:auto}
.pagina .arcano h3{margin-top:0} .pagina .classe-livro{border-bottom:3px dashed rgba(0,0,0,.3);padding-bottom:10px}

@media(max-width:640px){.pagina{padding:16px}.pagina .arcano{grid-template-columns:1fr}.pagina .arcano-arte{width:120px}}

.bj-grupo{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;font-family:var(--t-ui);font-weight:800;text-transform:uppercase;font-size:1.05rem}
.bj-grupo b{font-family:var(--t-titulo);font-size:1.7rem;color:var(--rosa);-webkit-text-stroke:1px #000;margin-right:2px}

.peca.na-mira .cartaz{outline:5px solid var(--verm);outline-offset:3px;animation:alvoPulsa .6s infinite}
.peca.na-mira .fig-in::after{content:'⚠ NA MIRA';position:absolute;top:-58px;left:50%;transform:translateX(-50%);background:var(--verm);color:#fff;border:2px solid #000;font-family:var(--t-ui);font-weight:800;font-size:13px;padding:1px 6px;white-space:nowrap}
.detalhe-acao.compacto .painel{padding:8px 12px} .detalhe-acao.compacto .da-texto,.detalhe-acao.compacto .da-grade{display:none}
.detalhe-acao.compacto{width:min(520px,94vw)}

es de esmagar o aço. Seu poder acelera o crescimento celular, curando feridas instantaneamente ou causando mutações explosivas nos inimigos, que florescem até a morte.", "dom": "no fim de cada cena, recupera 1d4 + Corpo de Vida. Curas que você realiza curam +2.", "fraqueza": "sofre +2 de dano de Plasma e de qualquer fogo.", "sim": "<ellipse cx=\"62.00\" cy=\"80.00\" rx=\"10\" ry=\"5.5\" transform=\"rotate(0 62.00 80.00)\" fill=\"none\" stroke=\"#0d0b12\" stroke-width=\"3.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><ellipse cx=\"56.00\" cy=\"90.39\" rx=\"10\" ry=\"5.5\" transform=\"rotate(60 56.00 90.39)\" fill=\"none\" stroke=\"#0d0b12\" stroke-width=\"3.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><ellipse cx=\"44.00\" cy=\"90.39\" rx=\"10\" ry=\"5.5\" transform=\"rotate(120 44.00 90.39)\" fill=\"none\" stroke=\"#0d0b12\" stroke-width=\"3.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><ellipse cx=\"38.00\" cy=\"80.00\" rx=\"10\" ry=\"5.5\" transform=\"rotate(180 38.00 80.00)\" fill=\"none\" stroke=\"#0d0b12\" stroke-width=\"3.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><ellipse cx=\"44.00\" cy=\"69.61\" rx=\"10\" ry=\"5.5\" transform=\"rotate(240 44.00 69.61)\" fill=\"none\" stroke=\"#0d0b12\" stroke-width=\"3.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><ellipse cx=\"56.00\" cy=\"69.61\" rx=\"10\" ry=\"5.5\" transform=\"rotate(300 56.00 69.61)\" fill=\"none\" stroke=\"#0d0b12\" stroke-width=\"3.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><circle cx=\"50\" cy=\"80\" r=\"4.5\" fill=\"#0d0b12\"/><path d=\"M50,104 Q46,112 50,118\" fill=\"none\" stroke=\"#0d0b12\" stroke-width=\"3.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>"}, {"i": 4, "num": "IV", "carta": "O Imperador", "nome": "Tiberion", "morto": false, "cor": "#c08a3e", "conceito": "estrutura, autoridade, ordem e concretização.", "desc": "Tiberion é a força que não pode ser movida. Controla a densidade e a estase. Torna a própria pele mais dura que diamante ou impõe campos de força onde absolutamente nada se move sem a sua permissão. Um soco de Tiberion não é apenas força física: é o peso de uma montanha concentrado em um único ponto.", "dom": "+1 de Blindagem; você não pode ser empurrado nem derrubado por efeitos de criaturas do seu tamanho.", "fraqueza": "desvantagem em Furtividade; seu deslocamento é −1,5 m.", "sim": "<path d=\"M50,54 L72,66 L72,94 L50,106 L28,94 L28,66Z\" fill=\"none\" stroke=\"#0d0b12\" stroke-width=\"3.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M28,66 L50,78 L72,66 M50,78 L50,106\" fill=\"none\" stroke=\"#0d0b12\" stroke-width=\"3.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>"}, {"i": 5, "num": "V", "carta": "O Hierofante", "nome": "Oram", "morto": false, "cor": "#ffd23f", "conceito": "tradição, ensinamentos espirituais e sabedoria.", "desc": "A voz de Oram é a própria lei. Ele controla a matéria e a mente através de ondas sonoras e palavras de poder. Se ele disser \"Ajoelhe\", a gravidade local esmaga os joelhos dos inimigos contra o chão. Seus coros geram campos de ressonância capazes de desintegrar armaduras e estilhaçar a força de vontade de quem os escuta.", "dom": "+2 em Persuasão e Intimidação; suas músicas e ordens são ouvidas a 30 m.", "fraqueza": "se estiver impedido de falar ou Silenciado, perde o Dom e não usa magias.", "sim": "<line x1=\"50\" y1=\"50\" x2=\"50\" y2=\"110\" fill=\"none\" stroke=\"#0d0b12\" stroke-width=\"3.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><line x1=\"42\" y1=\"58\" x2=\"58\" y2=\"58\" fill=\"none\" stroke=\"#0d0b12\" stroke-width=\"3.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><line x1=\"38\" y1=\"67\" x2=\"62\" y2=\"67\" fill=\"none\" stroke=\"#0d0b12\" stroke-width=\"3.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><line x1=\"34\" y1=\"76\" x2=\"66\" y2=\"76\" fill=\"none\" stroke=\"#0d0b12\" stroke-width=\"3.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M34.4,100.8 A26,26 0 0,1 34.4,59.2\" fill=\"none\" stroke=\"#0d0b12\" stroke-width=\"3.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" opacity=\".7\"/><path d=\"M65.6,100.8 A26,26 0 0,0 65.6,59.2\" fill=\"none\" stroke=\"#0d0b12\" stroke-width=\"3.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" opacity=\".7\"/><path d=\"M29.6,107.2 A34,34 0 0,1 29.6,52.8\" fill=\"none\" stroke=\"#0d0b12\" stroke-width=\"3.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" opacity=\".7\"/><path d=\"M70.4,107.2 A34,34 0 0,0 70.4,52.8\" fill=\"none\" stroke=\"#0d0b12\" stroke-width=\"3.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" opacity=\".7\"/>"}, {"i": 6, "num": "VI", "carta": "Os Enamorados", "nome": "Ilios e Lyra", "morto": false, "cor": "#ff6b35", "conceito": "escolhas, dualidade e uniões.", "desc": "Eles operam a magia da dualidade. Separam o calor e o frio extremos, criando tempestades térmicas avassaladoras. Seu poder mais letal é o Vínculo: ligam misticamente a alma de dois alvos. Se Ilios cortar o próprio braço, o braço do inimigo cai. Eles forçam o universo a compartilhar a dor, o amor e o dano.", "dom": "escolha um aliado como seu Par no início da cena. Uma vez por cena, você pode receber em seu lugar um dano que ele sofreria (ou vice-versa).", "fraqueza": "quando seu Par cai, você sofre 1d6 de dano e fica Atordoado por 1 rodada.", "sim": "<circle cx=\"41\" cy=\"80\" r=\"17\" fill=\"none\" stroke=\"#0d0b12\" stroke-width=\"3.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><circle cx=\"59\" cy=\"80\" r=\"17\" fill=\"none\" stroke=\"#5cc8ff\" stroke-width=\"3.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>"}, {"i": 7, "num": "VII", "carta": "O Carro", "nome": "Balthazar", "morto": false, "cor": "#ff9f1c", "conceito": "sucesso, determinação e controle.", "desc": "Balthazar é a personificação do movimento. Absorve e multiplica energia cinética. Quanto mais se move, mais indestrutível e rápido se torna, criando ondas de choque devastadoras apenas ao correr. Uma vez que ele foca em um alvo, as leis da fricção deixam de existir, e seu corpo vira o projétil perfeito.", "dom": "+3 m de deslocamento e +2 em Atletismo.", "fraqueza": "se não se mover no turno, sofre −2 de Defesa até o próximo.", "sim": "<path d=\"M28,70 L50,56 L72,70\" fill=\"none\" stroke=\"#0d0b12\" stroke-width=\"3.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M28,84 L50,70 L72,84\" fill=\"none\" stroke=\"#0d0b12\" stroke-width=\"3.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M28,98 L50,84 L72,98\" fill=\"none\" stroke=\"#0d0b12\" stroke-width=\"3.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><circle cx=\"34\" cy=\"110\" r=\"5\" fill=\"none\" stroke=\"#0d0b12\" stroke-width=\"3.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><circle cx=\"66\" cy=\"110\" r=\"5\" fill=\"none\" stroke=\"#0d0b12\" stroke-width=\"3.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>"}, {"i": 8, "num": "VIII", "carta": "A Força", "nome": "Leonora", "morto": false, "cor": "#e63946", "conceito": "coragem, autocontrole e compaixão.", "desc": "Leonora não é apenas forte: ela converte o sofrimento em fúria. Cada ferida que recebe amplifica sua força muscular e sua regeneração. Além de uma força base capaz de rasgar aço com as mãos, ela domina telepaticamente a mente de qualquer criatura selvagem ou corrompida, transformando os monstros do cenário em seu exército pessoal.", "dom": "com menos da metade da Vida, ganha +2 em Luta e +2 de dano corpo a corpo.", "fraqueza": "ao ficar abaixo da metade da Vida, faça TR de Mente (DT 12) ou ataque o alvo mais próximo no próximo turno, seja quem for.", "sim": "<path d=\"M32,56 Q44,80 36,108\" fill=\"none\" stroke=\"#0d0b12\" stroke-width=\"3.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M44,56 Q56,80 48,108\" fill=\"none\" stroke=\"#0d0b12\" stroke-width=\"3.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M56,56 Q68,80 60,108\" fill=\"none\" stroke=\"#0d0b12\" stroke-width=\"3.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>"}, {"i": 9, "num": "IX", "carta": "O Eremita", "nome": "Enoch", "morto": false, "cor": "#8d9bb3", "conceito": "busca interior, reflexão e contemplação.", "desc": "Enoch controla as sombras e a privação. Devora a luz de um ambiente e cria Zonas de Silêncio onde os inimigos perdem visão, audição e tato. No escuro absoluto, sua magia isola os oponentes, enquanto a luz gélida de sua lanterna dispara feixes de energia espiritual que queimam a alma sem deixar marcas no corpo.", "dom": "enxerga no escuro e ganha +2 em Furtividade em locais sombrios.", "fraqueza": "sofre −2 em todos os testes sob luz intensa ou sob efeito de Plasma/Estelar.", "sim": "<path d=\"M38,60 L62,60 L66,102 L34,102Z\" fill=\"none\" stroke=\"#0d0b12\" stroke-width=\"3.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M44,60 Q50,46 56,60\" fill=\"none\" stroke=\"#0d0b12\" stroke-width=\"3.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><polygon points=\"50.00,73.00 51.75,78.97 57.79,77.50 53.50,82.00 57.79,86.50 51.75,85.03 50.00,91.00 48.25,85.03 42.21,86.50 46.50,82.00 42.21,77.50 48.25,78.97\" fill=\"#0d0b12\"/>"}, {"i": 10, "num": "X", "carta": "A Roda da Fortuna", "nome": "Vesper", "morto": false, "cor": "#d4b483", "conceito": "ciclos da vida, sorte e mudanças.", "desc": "Vesper gira a engrenagem do tempo e do destino. Acelera a degradação de uma estrutura — enferrujando uma ponte em segundos — ou rebobina os próprios ferimentos. Em batalha, afeta as probabilidades: armas inimigas travam, projéteis desviam de forma impossível e o azar absoluto recai sobre quem ousa atacá-lo.", "dom": "uma vez por cena, role de novo um teste que falhou.", "fraqueza": "sempre que usar o Dom, o Mestre ganha um \"Azar\": pode forçar uma rolagem sua a ser refeita na mesma cena.", "sim": "<circle cx=\"50\" cy=\"80\" r=\"26\" fill=\"none\" stroke=\"#0d0b12\" stroke-width=\"3.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><circle cx=\"50\" cy=\"80\" r=\"6\" fill=\"none\" stroke=\"#0d0b12\" stroke-width=\"3.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><line x1=\"56.00\" y1=\"80.00\" x2=\"76.00\" y2=\"80.00\" fill=\"none\" stroke=\"#0d0b12\" stroke-width=\"3.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><line x1=\"54.24\" y1=\"84.24\" x2=\"68.38\" y2=\"98.38\" fill=\"none\" stroke=\"#0d0b12\" stroke-width=\"3.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><line x1=\"50.00\" y1=\"86.00\" x2=\"50.00\" y2=\"106.00\" fill=\"none\" stroke=\"#0d0b12\" stroke-width=\"3.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><line x1=\"45.76\" y1=\"84.24\" x2=\"31.62\" y2=\"98.38\" fill=\"none\" stroke=\"#0d0b12\" stroke-width=\"3.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><line x1=\"44.00\" y1=\"80.00\" x2=\"24.00\" y2=\"80.00\" fill=\"none\" stroke=\"#0d0b12\" stroke-width=\"3.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><line x1=\"45.76\" y1=\"75.76\" x2=\"31.62\" y2=\"61.62\" fill=\"none\" stroke=\"#0d0b12\" stroke-width=\"3.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><line x1=\"50.00\" y1=\"74.00\" x2=\"50.00\" y2=\"54.00\" fill=\"none\" stroke=\"#0d0b12\" stroke-width=\"3.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><line x1=\"54.24\" y1=\"75.76\" x2=\"68.38\" y2=\"61.62\" fill=\"none\" stroke=\"#0d0b12\" stroke-width=\"3.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>"}, {"i": 11, "num": "XI", "carta": "A Justiça", "nome": "Valeria", "morto": false, "cor": "#f1f1f1", "conceito": "causa e efeito, verdade e equilíbrio.", "desc": "Valeria dita o equilíbrio matemático do universo. Ela não ataca diretamente: invoca a Balança. Qualquer dano físico ou mágico desferido contra ela é imediatamente refletido no agressor na mesma proporção. Se um deus usar todo o seu poder contra Valeria, esse deus sofrerá o impacto integral do próprio golpe. Ela torna todos iguais perante a dor.", "dom": "uma vez por cena, ao sofrer dano, devolva metade dele ao agressor (Retributivo).", "fraqueza": "se atacar quem não atacou você nem um aliado nesta cena, perde o Dom até o fim da cena.", "sim": "<line x1=\"50\" y1=\"52\" x2=\"50\" y2=\"108\" fill=\"none\" stroke=\"#0d0b12\" stroke-width=\"3.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><line x1=\"24\" y1=\"64\" x2=\"76\" y2=\"64\" fill=\"none\" stroke=\"#0d0b12\" stroke-width=\"3.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M16,86 L24,64 L32,86 Q24,94 16,86Z\" fill=\"none\" stroke=\"#0d0b12\" stroke-width=\"3.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M68,86 L76,64 L84,86 Q76,94 68,86Z\" fill=\"none\" stroke=\"#0d0b12\" stroke-width=\"3.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><line x1=\"38\" y1=\"108\" x2=\"62\" y2=\"108\" fill=\"none\" stroke=\"#0d0b12\" stroke-width=\"3.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>"}, {"i": 12, "num": "XII", "carta": "O Enforcado", "nome": "Mael", "morto": false, "cor": "#d0213a", "conceito": "sacrifício, pausa e novas perspectivas.", "desc": "Mael detém o poder sobre a estagnação. Suspende alvos no ar, paralisando-os no tempo e no espaço. Seu verdadeiro poder é o sacrifício: ao ferir a si mesmo — como perfurar a própria mão —, converte a dor em magias catastróficas de área, quebrando as leis da física porque o tributo de sangue já foi pago.", "dom": "ao perder 3 de Vida de propósito (Ação Rápida), ganha +2 POT e +2 no próximo teste até o fim do turno.", "fraqueza": "magias de Tier II e III exigem pagar metade do custo em Vida em vez de Energia.", "sim": "<line x1=\"24\" y1=\"50\" x2=\"76\" y2=\"50\" fill=\"none\" stroke=\"#0d0b12\" stroke-width=\"3.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><line x1=\"50\" y1=\"50\" x2=\"50\" y2=\"66\" fill=\"none\" stroke=\"#0d0b12\" stroke-width=\"3.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M32,66 L68,66 L50,100Z\" fill=\"none\" stroke=\"#0d0b12\" stroke-width=\"3.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><circle cx=\"50\" cy=\"108\" r=\"4\" fill=\"#0d0b12\"/>"}, {"i": 13, "num": "XIII", "carta": "A Morte", "nome": "Moros", "morto": false, "cor": "#9bb45f", "conceito": "términos, transformações profundas e recomeços.", "desc": "Moros é o fim inevitável. Tudo o que ele toca entra em rápida decomposição e entropia: o aço enferruja e vira pó, a carne apodrece instantaneamente. Ele se alimenta da energia vital de coisas moribundas, ficando mais forte quanto mais destruição houver ao redor, e reanima os minerais e ossos do chão para lutar por ele.", "dom": "ao participar de um abate, recupera 1d4 de Energia.", "fraqueza": "equipamentos de metal que carrega enferrujam (seus itens de Arma custam +2 ✦), e estranhos o evitam (−2 em Persuasão).", "sim": "<path d=\"M32,52 L68,52 L50,80 L68,108 L32,108 L50,80Z\" fill=\"none\" stroke=\"#0d0b12\" stroke-width=\"3.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M41,102 L59,102 L50,92Z\" fill=\"#0d0b12\"/><line x1=\"26\" y1=\"52\" x2=\"74\" y2=\"52\" fill=\"none\" stroke=\"#0d0b12\" stroke-width=\"3.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><line x1=\"26\" y1=\"108\" x2=\"74\" y2=\"108\" fill=\"none\" stroke=\"#0d0b12\" stroke-width=\"3.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>"}, {"i": 14, "num": "XIV", "carta": "A Temperança", "nome": "Seraphina", "morto": false, "cor": "#9fe7ff", "conceito": "equilíbrio, paciência e moderação.", "desc": "Seraphina é o poder do cancelamento. Ela não destrói os inimigos: anula os ataques deles. Sua presença passiva extingue chamas, limpa venenos e dissipa magias ativas. Pode misturar elementos opostos, fundindo gelo e fogo em vapores cáusticos, mas seu maior poder é forçar a estagnação pacífica, drenando a agressividade e a energia bruta da área.", "dom": "+2 de Égide.", "fraqueza": "sofre −2 em ataques contra alvos que ainda não atacaram ninguém nesta cena.", "sim": "<path d=\"M24,56 L40,56 L36,72 L28,72Z\" fill=\"none\" stroke=\"#0d0b12\" stroke-width=\"3.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M60,86 L76,86 L72,102 L64,102Z\" fill=\"none\" stroke=\"#0d0b12\" stroke-width=\"3.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M36,70 Q52,74 66,86\" fill=\"none\" stroke=\"#0d0b12\" stroke-width=\"3.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-dasharray=\"3 3\"/><circle cx=\"50\" cy=\"80\" r=\"32\" fill=\"none\" stroke=\"#0d0b12\" stroke-width=\"3.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" opacity=\".45\"/>"}, {"i": 15, "num": "XV", "carta": "O Diabo", "nome": "Karn", "morto": false, "cor": "#e3b505", "conceito": "apego, excessos, materialismo e sombras.", "desc": "Karn arma os desejos e os vícios. Invoca correntes etéreas de ouro que drenam a vitalidade dos inimigos para curá-lo. Corrompe fisicamente quem toca, forçando os corpos de seus alvos a sofrer mutações grotescas que refletem seus piores defeitos, e controla-os por pura manipulação de dor e prazer.", "dom": "uma vez por cena, ao causar dano, recupera metade dele como Vida. Itens custam −2 ✦ para você.", "fraqueza": "escolha um vício. Se passar um dia sem satisfazê-lo, sofre −2 em todos os testes.", "sim": "<path d=\"M30,52 Q32,68 44,70\" fill=\"none\" stroke=\"#0d0b12\" stroke-width=\"3.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M70,52 Q68,68 56,70\" fill=\"none\" stroke=\"#0d0b12\" stroke-width=\"3.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><ellipse cx=\"44\" cy=\"78\" rx=\"9\" ry=\"5.5\" fill=\"none\" stroke=\"#0d0b12\" stroke-width=\"3.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><ellipse cx=\"56\" cy=\"89\" rx=\"9\" ry=\"5.5\" fill=\"none\" stroke=\"#0d0b12\" stroke-width=\"3.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><ellipse cx=\"44\" cy=\"100\" rx=\"9\" ry=\"5.5\" fill=\"none\" stroke=\"#0d0b12\" stroke-width=\"3.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>"}, {"i": 16, "num": "XVI", "carta": "A Torre", "nome": "Golgoth", "morto": true, "cor": "#c8693a", "conceito": "mudanças bruscas, quebra de estruturas e revelação.", "desc": "Golgoth é o poder do desastre absoluto. Manipula vibrações sísmicas e a quebra estrutural. Ao bater as mãos, fragmenta feitiços lançados contra ele, estilhaça o chão em abismos e faz edifícios desmoronarem como areia. Seus ataques ignoram completamente escudos e armaduras pesadas, pois sua magia ataca as microfissuras da matéria.", "dom": "+2 de dano contra estruturas e Sentinelas; ignore 2 de Blindagem.", "fraqueza": "Poeira no Sangue — magias de cura têm metade do efeito em você.", "sim": "<path d=\"M36,110 L40,58 L60,58 L64,110Z\" fill=\"none\" stroke=\"#0d0b12\" stroke-width=\"3.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M38,58 L38,50 L46,50 L46,54 L54,54 L54,50 L62,50 L62,58\" fill=\"none\" stroke=\"#0d0b12\" stroke-width=\"3.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M72,44 L52,74 L60,76 L44,100\" fill=\"none\" stroke=\"#0d0b12\" stroke-width=\"3.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"4.8\"/>"}, {"i": 17, "num": "XVII", "carta": "A Estrela", "nome": "Astraea", "morto": true, "cor": "#bde0fe", "conceito": "esperança, inspiração e fé.", "desc": "Astraea comanda os astros. Conjura a luz mortiça de estrelas antigas, disparando raios orbitais de puro plasma e radiação cósmica que derretem o solo. Controla a gravidade direcional em pequena escala, fazendo destroços choverem como meteoros, e usa luz estelar para purificar aliados de qualquer aflição corrompida.", "dom": "aliados a 3 m de você ganham +2 em TR contra medo e corrupção e +1 de Égide.", "fraqueza": "Poeira no Sangue — magias de cura têm metade do efeito em você.", "sim": "<polygon points=\"50.00,50.00 53.44,71.69 71.21,58.79 58.31,76.56 80.00,80.00 58.31,83.44 71.21,101.21 53.44,88.31 50.   'Dezembro de 1999. Albion se prepara para o bug do milênio, para os fogos da virada e para mais um discurso da Rainha de Vidro na TV. Nas ruas do Distrito de Cinza, ninguém se prepara para nada: o aluguel subiu de novo, a Guarda fecha um pub por semana e as rádios piratas tocam até a polícia arrombar a porta.',
  'Vocês são Tocados. Ninguém sabe exatamente o que isso quer dizer. Um dia, uma voz que só vocês escutam disse o seu nome — e desde então suas mãos brilham quando vocês ficam com raiva, as luzes piscam quando vocês choram e às vezes vocês sabem coisas que não deveriam saber. Os livros que explicariam isso foram queimados há séculos. Quem sabia alguma coisa sumiu. Existem pouquíssimos como vocês no mundo inteiro, e a Coroa tem uma unidade inteira dedicada a encontrá-los: a Seção Zero.',
  'E vocês têm um plano. Um plano idiota, juvenil, irresponsável e lindo: no dia 20 de dezembro, durante a Gala do Milênio transmitida ao vivo para o país inteiro, vocês vão roubar a Coroa da Rainha — e no lugar dela vão deixar uma coroa de lata pichada com ABAIXO À RAINHA.',
  'O que pode dar errado?'],
 tom: 'Pensem em Missão Impossível com jaqueta de couro, Indiana Jones no metrô abandonado e 007 sem orçamento. A primeira metade é uma aventura de roubo, cheia de disfarces, planos que dão errado e piadas ruins. Depois… o céu escurece.',
 regrasDeMesa: ['O Mestre tem a palavra final sobre o que acontece no mundo. Vocês têm a palavra final sobre quem seus personagens são.', 'Planos ruins são bem-vindos. Planos ruins rendem as melhores histórias.', 'Se algo na mesa incomodar alguém de verdade, parem e conversem. É um jogo.'],
 lugares: [
  ['O Starman', 'Pub de rock no Distrito de Cinza. Palco minúsculo, cerveja quente, um porão onde bandas que ninguém conhece tocam até as três da manhã. O dono é Ziggy Lennox.'],
  ['Distrito de Cinza', 'Prédios de tijolo, fábricas fechadas, muros pichados. A fumaça das chaminés mortas virou neblina permanente.'],
  ['Rua dos Amplificadores', 'Lojas de discos, oficinas de guitarra, estúdios de fundo de quintal. O coração do punk de Albion.'],
  ['O Palácio de Vidro', 'A residência da Rainha, inteira de vidro e aço. Dizem que de dentro dá para ver a cidade toda, e que de fora não se vê nada.'],
  ['O Domo do Milênio', 'Um gigantesco domo branco à beira do rio, construído pela Coroa para a festa da virada. Vai ser inaugurado à meia-noite de 31 de dezembro.'],
  ['A Linha Morta', 'Uma linha de metrô abandonada desde um desabamento em 1888. Os trens ainda passam lá embaixo, às vezes. Ninguém dirige.']],
 pessoas: [
  ['Ziggy Lennox', 'Dono do Starman. Ex-astro do glam rock dos anos 70, jaqueta de lantejoulas, voz de veludo rouco. Trata vocês como sobrinhos.'],
  ['Dee Dee', '15 anos, faz tudo no Starman, conserta qualquer coisa com fita crepe. Fala rápido demais.'],
  ['Raulzito Krig-Há', 'Brasileiro, contrabandista, motorista, filósofo de boteco. Dirige uma Kombi chamada Metamorfose.'],
  ['Vivienne II', 'A Rainha de Vidro. Governa Albion há 40 anos. Nunca aparece em público sem a coroa — nem sem as luvas.'],
  ['Inspetora Siouxsie Marr', 'A policial mais temida da cidade. Nunca aceitou suborno. Nunca perdeu um suspeito.']],
},

// ----------------- A VERDADE (SÓ O MESTRE) -----------------
verdade: [
 'No ano 999, um homem rico fez o Primeiro Pedido no Campo das Constelações e o mundo foi refeito para dar poder a quem já tinha. O que a história não conta é como ele fez isso. O Pedido precisa de duas coisas: um pedaço de uma Entidade morta no centro do Campo e as vozes de Tocados cantando ao redor. O homem rico usou um fragmento do coração de Astraea, a Estrela — uma das duas Entidades que se destruíram na Batalha das Constelações.',
 'Depois do Pedido, o homem rico entendeu o risco: em mil anos, alguém poderia fazer outro Pedido e desfazer o dele. Então ele prendeu o fragmento numa coroa e lacrou essa coroa num palácio construído para isso. Enquanto a coroa estiver no Palácio de Vidro, o céu fica "parado" e ninguém pode fazer o próximo Pedido. O preço do lacre é cruel: quem usa a coroa vira vidro, aos poucos. É por isso que a dinastia é chamada de Reis de Vidro. Vivienne II está quase metade vidro. Cada passo dói.',
 'O lacre também precisa de uma voz viva da Estrela — um Tocado de Astraea dormindo dentro dele. A cada geração, a Coroa encontra um e o vitrifica na Câmara Astral, sob o palácio. É para isso que a Seção Zero existe: caçar Tocados não é só tirania, é manutenção. Em 1989, a voz escolhida foi Joplin "Jo" Lennox, 15 anos. A filha de Ziggy.',
 'Ziggy passou dez anos procurando. Descobriu tudo: a Câmara, o Astrolábio, o lacre, o Pedido. E entendeu que só existe um jeito de ter a filha de volta e desfazer o que fizeram com ela: tirar a coroa do palácio antes da meia-noite de 31/12/1999 e fazer ele mesmo o Segundo Pedido — "que 1989 nunca tenha acontecido". Ele não pode fazer isso sozinho. Precisa de Tocados jovens, impulsivos, que acreditem que a ideia de roubar a coroa foi deles. Precisa dos jogadores.',
 'Existe uma terceira camada que nem Ziggy conhece. A "voz" que todos os Tocados escutam desde a infância — aquela que disse o nome deles — é Astraea. A Estrela morta nunca morreu de verdade: dormiu dentro do fragmento por mil anos, sonhando através de Jo, sussurrando para todo Tocado que nascia. Ela quer o que todo deus quer: existir. Se alguém fizer o Pedido segurando o fragmento dela, Astraea vai tentar torcer o desejo para renascer. E uma deusa que acabou de voltar dos mortos não tem motivo nenhum para gostar da humanidade.',
 'Resumindo para a mesa: a coroa é um lacre. A Rainha é tirana e carcereira ao mesmo tempo. Ziggy é o pai que armou o golpe. Jo é a menina dentro do vidro. Astraea é a voz. Os jogadores roubaram a coroa achando que era uma piada — e começaram o fim do mundo.'],

linhaDoTempo: [
 ['999', 'O Primeiro Pedido. O homem rico refaz o mundo. A coroa-lacre é forjada.'],
 ['1888', 'Desabamento na Linha Morta: operários cavavam perto demais da Câmara Astral. O Colosso nasce.'],
 ['1959', 'Vivienne II é coroada aos 19 anos. Na mesma semana, a Seção Zero é criada.'],
 ['1973', 'Ziggy Lennox lança o disco "Os Mil Anos de Joplin" e vira astro. Nasce sua filha.'],
 ['1986', 'Ziggy descobre que é Tocado de Astraea. Esconde de todos.'],
 ['1989', 'Jo, 15 anos, também Tocada da Estrela, é levada pela Seção Zero após um show. A voz anterior do lacre havia morrido de velhice. Ziggy abandona a música.'],
 ['1990–1998', 'Ziggy compra o Starman e passa a ajudar Tocados fugidos. Reúne, peça por peça, a verdade.'],
 ['nov/1999', 'A Rainha anuncia: a Coroa será exibida em público pela primeira vez em 40 anos, na Gala do Milênio. Ela sabe que o lacre está fraco e quer reforçá-lo com o ritual da Gala. Ziggy vê sua janela.'],
 ['1/dez/1999', 'Início da campanha.'],
 ['20/dez/1999', 'A Gala. A coroa é roubada. O céu escurece.'],
 ['31/dez/1999 · 23:59', 'O Segundo Pedido.']],

// ----------------- NPCs (MESTRE) -----------------
npcs: [
 { id: 'ziggy', nome: 'Ziggy Lennox', remete: 'Ziggy Stardust (David Bowie) + John Lennon', idade: 52, papel: 'Mentor · Mandante do golpe · Antagonista final',
   aparencia: 'Magro, alto, cabelo ruivo desbotado com raiz grisalha, um olho de cada cor por causa de um soco em 1976. Sempre de lantejoulas, mesmo servindo cerveja.',
   voz: 'Fala baixo e devagar, chama todo mundo de "estrelinha", ri das próprias desgraças. Cita letras que inventou e nunca gravou.',
   quer: 'A filha de volta. E que 1989 nunca tenha acontecido.', medo: 'Que Jo, acordada, não o reconheça. Ou pior: que reconheça e o odeie.',
   segredo: 'Armou tudo. Plantou a ideia do roubo nas conversas, comprou as informações, mandou Gus para o leilão como plano B. Gosta de verdade dos jogadores — e vai traí-los mesmo assim.',
   arco: 'Ato I–II: o tio legal que banca o plano. Ato III: a traição na Câmara Astral. Ato IV: um fantasma que deixa pistas (ele quer, no fundo, ser impedido). Ato V: no palco do Domo, a guitarra na mão, cantando para chamar o Coro.',
   redencao: 'Se os jogadores trouxerem a fita "Jo, 1989" e Jo estiver livre e presente, Ziggy pode desistir. Teste de Persuasão DT 18 (−2 por Laço negativo, +2 por Laço positivo). Se desistir, ele assume o lugar de Jo no lacre — ou se oferece como sacrifício no Círculo Quebrado.' },
 { id: 'jo', nome: 'Joplin "Jo" Lennox', remete: 'Janis Joplin', idade: '25 (parece 15)', papel: 'A voz do lacre · Chave',
   aparencia: 'Uma menina de 15 anos dentro de um sarcófago de vidro, cabelos flutuando como debaixo d’água. Ao acordar, o vidro descasca da pele como gelo fino.',
   voz: 'Acorda falando como em 1989: gírias velhas, pergunta pelo pai, pergunta quem ganhou a Copa. Às vezes fala com a voz de outra pessoa — a de Astraea.',
   quer: 'Ir para casa. Depois: que a voz pare.', medo: 'Voltar para o vidro.',
   segredo: 'Dez anos sonhando com Astraea. Jo conhece a deusa melhor que ninguém. Sabe que o Pedido com o fragmento da Estrela vai acordá-la. Pode ser a maior aliada dos jogadores — se alguém perguntar a ela, e não sobre ela.',
   arco: 'Ato III: acordada à força por Ziggy. Ato IV: refém e filha, ao mesmo tempo. Ato V: o centro de tudo. Ela pode resistir a Astraea (+2 no Julgamento) se tiver Laço +2 ou mais com o grupo.' },
 { id: 'rainha', nome: 'Vivienne II, a Rainha de Vidro', remete: 'Vivienne Westwood (a estilista que vestiu o punk)', idade: 59, papel: 'Tirana · Carcereira · Aliada possível',
   aparencia: 'Pele que tilinta. Luvas de couro para não rachar os dedos. Olhos ainda humanos, cansados.',
   voz: 'Fria, cortante, ironia de quem já viu tudo. Quando a máscara cai, uma mulher exausta.',
   quer: 'Reforçar o lacre e morrer em paz sabendo que ninguém fará outro Pedido. Num momento de fraqueza: ser só gente de novo.', medo: 'O que um Pedido faria nas mãos de qualquer um — inclusive dela.',
   segredo: 'Ela não escolheu ser a carcereira. Foi coroada aos 19. Assinou a vitrificação de Jo e de outros 11 Tocados ao longo de 40 anos e se lembra do nome de cada um. A Gala era para reforçar o lacre com um novo Tocado vitrificado — talvez um dos jogadores.',
   arco: 'Ato I–III: o símbolo de tudo que eles odeiam. Ato IV: no palácio rachando, ela conta a verdade — se ouvirem. Ato V: pode aparecer para recolocar o lacre (A Coroa Eterna) ou para ajudar a quebrá-lo (O Círculo Quebrado).' },
 { id: 'siouxsie', nome: 'Inspetora Siouxsie Marr', remete: 'Siouxsie Sioux + Johnny Marr', idade: 38, papel: 'Caçadora · Rival · Virada de lado',
   aparencia: 'Delineador preto pesado, sobretudo cinza, distintivo no pescoço. Cicatriz fina no queixo.',
   voz: 'Frases curtas. Nunca levanta a voz. Chama os jogadores pelo sobrenome.',
   quer: 'Que a lei valha para todos. Inclusive para a Rainha.', medo: 'Descobrir que passou a vida servindo a algo podre.',
   segredo: 'É Tocada de Valeria, a Justiça, e esconde isso há 20 anos dentro da própria Seção Zero. Acredita que os Tocados presos vão para "reeducação". No Ato IV, descobre a ordem de vitrificação.',
   arco: 'Ato II: infiltrada no leilão. Ato III: a última barreira na fuga. Ato IV: caça os jogadores — até encontrar a ordem. Ato V: se tiver Laço +1 ou mais, chega com informação e cobertura; se +3, luta ao lado deles.' },
 { id: 'gus', nome: 'Gustavo "Gus" Cerati', remete: 'Gustavo Cerati (Soda Stereo, Argentina)', idade: 34, papel: 'Ladrão rival · Coringa',
   aparencia: 'Terno de linho, óculos escuros redondos, bengala com florete dentro. Sempre um cravo na lapela.',
   voz: 'Portunhol elegante, cita Borges, chama todo mundo de "querido". Mente com o corpo inteiro.',
   quer: 'O maior golpe da vida dele. E o dinheiro que Ziggy prometeu.', medo: 'Ser comum.',
   segredo: 'Contratado por Ziggy como plano B: se os jogadores falharem no leilão, Gus pega o Astrolábio. Não sabe nada do Pedido — acha que é só um roubo grande. Quando descobrir, fica indignado: ninguém usa Gus Cerati sem avisar.',
   arco: 'Ato II: rival elegante. Ato III: pode estar trabalhando para Ziggy na Gala. Ato IV: se tiver Laço 0 ou mais, vira aliado por vingança contra Ziggy.' },
 { id: 'deedee', nome: 'Dee Dee', remete: 'Dee Dee Ramone', idade: 15, papel: 'Coração do grupo',
   aparencia: 'Moicano verde caído, jardineira jeans cheia de bottons, rolo de fita crepe no pulso como pulseira.',

   arco: 'Está em perigo nos momentos certos. Se os jogadores a protegerem, ela aparece no Ato V com uma ideia brilhante (e fita crepe).' },
 { id: 'raulzito', nome: 'Raulzito Krig-Há', remete: 'Raul Seixas', idade: 44, papel: 'Motorista · Contrabandista · Alívio cômico',
   aparencia: 'Barba, óculos escuros, camisa aberta, medalhinha. A Kombi Metamorfose é pintada à mão com discos voadores.',
   voz: 'Mistura português e inglês, filosofa sobre tudo, sempre tem "um primo" que resolve.',
   quer: 'Voltar para a Bahia rico. Ou pelo menos com a Kombi inteira.', medo: 'Polícia, tédio e o fim do mundo — nessa ordem.',

 { id: 'faithless', nome: 'Madame Marianne Faithless', remete: 'Marianne Faithfull', idade: 53, papel: 'Leiloeira · Mercadora de segredos',
   aparencia: 'Vestido de veludo, voz rouca de cigarro, um monóculo que não precisa.',
   voz: 'Trata tudo como um lance: "quanto vale isso para você, querida?"',

 { id: 'viktor', nome: 'Viktor Kino', remete: 'Viktor Tsoi (Kino, URSS)', idade: 37, papel: 'Astrônomo exilado',

 { id: 'patti', nome: 'Irmã Patti Smithers', remete: 'Patti Smith', idade: 61, papel: 'Freira punk · Guardiã do diário',

 { id: 'morrissey', nome: 'Sr. Steven Morrissey', remete: 'Morrissey (The Smiths)', idade: 40, papel: 'Arquivista melancólico',
